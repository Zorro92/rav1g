[package]
name = "rav1g-parse-check"
description = "Holds the parser of phase 2 (rav1d's parse pass behind the sink of rav1g-parse) against the entropy decoder of libaom: every mode info record, the grid, the block lists, the transform block records and the coefficients of every frame. No GPU; Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
rav1g-sys = { workspace = true }
rav1g-parse = { workspace = true }
