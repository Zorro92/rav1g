name: Build

on:
  push:
    branches: [main, cpp]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      experiments:
        description: >
          Also build the uavsync package and decode the conformance set again with each experiment
          flag, with poisoned buffers (-poisonmi, -poisonbuf) and with the uavsync shaders (the job
          rust-experiments, about 20 minutes)
        type: boolean
        default: false
      parser_timing:
        description: >
          Also time the two parsers in pairs on a runner (the job parser-timing, about 18 minutes;
          docs/warp-decoder.md, "Paired timing of the parsers")
        type: boolean
        default: false
  # Once a week, Monday 03:23 UTC: every job of a push, and the paired timing of the two parsers
  # (the job parser-timing), which no push runs.
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

env:
  # The av1-xbox-one commit this repository is forked from (recorded in SOURCES.txt).
  UPSTREAM_URL: https://aomedia.googlesource.com/av1-xbox-one
  UPSTREAM_COMMIT: b5c61563b48625c261a8d627cfa928896fd10b13
  # The equality reference (docs/rust-port.md, "Equality reference"): the commit of branch cpp whose
  # warp_decoder the rust-equal job holds rav1g-dec against. Bumped on purpose, with the docs, when a
  # change that both decoders have (a shader, the C of the parser) lands on both branches.
  CPP_REFERENCE_COMMIT: df73d8c2aeaa95d31a6c603e57a0c92cccbd7ed9

jobs:
  player:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLATFORM_TOOLSET: v145
      WINDOWS_SDK: 10.0.26100.0
    steps:
      # Byte-exact sources: no newline conversion on the Windows runner.
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Record sources and copy licence notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          git -C src merge-base --is-ancestor $env:UPSTREAM_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The pinned upstream commit is not an ancestor of HEAD' }
          $sources = @(
            "Repository: https://github.com/$env:GITHUB_REPOSITORY",
            "Commit: $env:GITHUB_SHA",
            "Forked from: $env:UPSTREAM_URL at $env:UPSTREAM_COMMIT",
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: Release x64; PlatformToolset=$env:PLATFORM_TOOLSET; Windows SDK=$env:WINDOWS_SDK",
            'Changes since the fork point:'
          )
          $sources += @(git -C src log --format='%h %s' "$env:UPSTREAM_COMMIT..HEAD")
          if ($LASTEXITCODE -ne 0) { throw 'git log failed' }
          $sources | Set-Content out/SOURCES.txt -Encoding utf8
          # Binary redistribution retains the BSD notices and AOM patent license, including libwebm and
          # rav1d (the library has rav1d's parse pass, third_party/rav1d), and the MIT and Apache-2.0
          # notices of the crates the library links (third_party/rust-crates/NOTICES.txt, which the
          # rust-cross job holds against Cargo.lock).
          foreach ($license in @('LICENSE.txt', 'libav1/LICENSE', 'libav1/PATENTS',
              'third_party/libwebm/LICENSE.TXT', 'third_party/libwebm/PATENTS.TXT',
              'third_party/rav1d/COPYING', 'third_party/rav1d/doc/PATENTS',
              'third_party/rust-crates/NOTICES.txt')) {
            $destination = Join-Path out/licenses $license
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item (Join-Path src $license) $destination
          }

      # The shaders: the bytecode header and the listing of every shader from one FXC call per shader
      # (cs_5_0, entry main, default optimization, /Od for the two upstream intra shaders), for the normal
      # build and for the uavsync variant, from a cache by content (.github/actions/shaders,
      # testing/shader_cache/shaders.py). A shader that does not compile stops the run here.
      - name: Shaders
        id: shaders
        uses: ./src/.github/actions/shaders
        with:
          repo: src
          sdk: ${{ env.WINDOWS_SDK }}

      # The shaders of the Shader Model 6 test (player flag -sm6test, docs/test-player.md): DXC shaders of
      # testing/sm6test/shaders, not shaders of the decoder and in none of the steps around this one that
      # are about the decoder's shaders. The player gets their bytecode through /p:Rav1gSm6TestShaders.
      - name: Shader Model 6 test shaders
        id: sm6
        uses: ./src/.github/actions/sm6test-shaders
        with:
          repo: src
          sdk: ${{ env.WINDOWS_SDK }}

      # Codegen evidence for the CDEF and intra rewrites, which cannot be measured without a console: the
      # CDEF and intra listings get a side-by-side count, all shaders a one-line survey.
      # intra_main_opt and intra_main_hbd_opt are the upstream intra_main sources built with optimization
      # (player flag -intraopt), listed next to the /Od builds of the same sources. A bit field
      # instruction whose width is known only at run time stops the run (docs/gpu-av1-decoder.md, "Bit
      # fields of width 0").
      - name: Shader survey, CDEF and intra listings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python src/testing/shader_cache/shaders.py survey --report shader-build/normal/report.json `
            --listings shader-build/normal/asm --out out --sdk $env:WINDOWS_SDK
          if ($LASTEXITCODE -ne 0) { throw 'The shader survey failed' }
          # The static view of the inter prediction shaders (docs/gpu-av1-decoder.md, "Inter prediction
          # breakdown"): the listings next to what a thread of each shader does, which is read from the
          # source. A shader whose listing no longer has the loads the table says stops the run.
          python src/testing/shader_cache/inter_static.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'The self-test of the inter static view failed' }
          python src/testing/shader_cache/inter_static.py --listings shader-build/normal/asm --strict `
            --out out/shader-survey/inter-static.md
          if ($LASTEXITCODE -ne 0) { throw 'An inter shader differs from the table in testing/shader_cache/inter_static.py: update the table and the docs' }
          # All listings, and which key, compile time and header hash each shader of the build has.
          Copy-Item shader-build/normal/asm out/shader-survey/asm -Recurse
          Copy-Item shader-build/normal/report.json out/shader-survey/build.json
          # The Shader Model 6 test shaders of the package: DXC's listings and the report of their build.
          New-Item -ItemType Directory -Force out/sm6test-shaders | Out-Null
          Copy-Item sm6test-build/asm out/sm6test-shaders/asm -Recurse
          Copy-Item sm6test-build/report.json, sm6test-build/report.md out/sm6test-shaders/

      # The listings of both variants are scanned for the pair of instructions that the console's driver
      # compiled wrongly in the 8-bit vertical loop filter: a vector instruction that rewrites components
      # of a register from the same register across components, and before it, in the same run of
      # instructions, an instruction that reads two of those components into one result
      # (docs/gpu-av1-decoder.md, "A paired read before an overlapping in-place write"). A pair that
      # testing/dxbc_scan/allow.txt does not have stops the run; the report with every overlapping
      # in-place write goes into the artifact next to the survey.
      - name: Listings scan, paired read before an overlapping in-place write
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python src/testing/dxbc_scan/scan.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'The listings scan does not find the known pair' }
          python src/testing/dxbc_scan/scan.py --listings shader-build/normal/asm --listings shader-build/uavsync/asm `
            --min-listings 92 --out out/shader-survey/listing-scan.txt
          if ($LASTEXITCODE -ne 0) {
            throw 'A listing has a paired read before an overlapping in-place write: rewrite the HLSL (see the scan output)'
          }

      # MSBuild with the v145 toolset and Windows SDK 10.0.26100.0 (upstream targets v141/17763).
      - uses: microsoft/setup-msbuild@v3

      # Identity name and publisher stay those of the earlier test player builds, so the
      # package family (and its LocalState with streams and md5 references) carries over.
      # Version 0.2.x outranks the 0.1.x packages built before this repository existed.
      - name: Create sideload certificate and stamp package identity
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Bale Development' `
            -KeyUsage DigitalSignature -FriendlyName 'rav1g Test Player Development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-Certificate -Cert $cert -FilePath out/Av1GpuTestPlayer.cer | Out-Null
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Name = 'Av1GpuTestPlayer'
          $manifest.Package.Identity.Publisher = $cert.Subject
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.0"
          $manifest.Package.Properties.DisplayName = 'rav1g Test Player'
          $manifest.Package.Properties.PublisherDisplayName = 'rav1g'
          $manifest.Package.Applications.Application.VisualElements.DisplayName = 'rav1g Test Player'
          $manifest.Package.Applications.Application.VisualElements.Description = 'rav1g D3D12 compute AV1 test player'
          $manifest.Save($path)

      # ---------------------------------------------------------------------------------------------
      # The player is C++ (testing/uwp_dx12_player, testing/uwp_common) on the functions of rav1g.h; the
      # decoder behind them is the Rust library of the Cargo workspace with the C of the parser and
      # entropy decoder (docs/rust-port.md). Two packages of the same identity per run, which differ in
      # what compiled that C, which is where the tile threads spend their time (docs/test-player.md):
      #   revision 0, the default: clang with link time optimisation, linked with the Rust by lld-link
      #               into rav1g.dll, which is in the package next to the program;
      #   revision 2: MSVC with /GL, a static library, the objects compiled by the player's link
      #               (/LTCG:incremental).
      # Revision 1 is the uavsync package of the experiments input. A higher revision installs over a
      # lower one and keeps LocalState.
      # ---------------------------------------------------------------------------------------------

      # Stable Rust, and libclang for bindgen, as in the rust job.
      - name: Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install stable' }
          rustup default stable
          rustc --version
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $llvm 'libclang.dll')) { "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV }
          foreach ($tool in @('clang-cl.exe', 'lld-link.exe', 'llvm-lib.exe')) {
            if (-not (Test-Path (Join-Path $llvm $tool))) { throw "$tool is not in $llvm" }
          }
          & (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1

      # nasm: the Rust library has rav1d's parse pass, whose entropy decoder is assembly
      # (third_party/rav1d, docs/phase2-rav1d.md).
      - name: nasm
        uses: ./src/.github/actions/nasm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: player

      # The C compiled by clang-cl with full link time optimisation: on the console the build whose tile
      # threads are 1.5 to 4 % faster than those of the MSVC build (docs/rust-port.md, "Console results of
      # step 5"). Its objects are LLVM bitcode, which the player's link.exe cannot read; and lld-link, which
      # can, cannot link the player: it reads neither the /GL objects the player is made of nor the options
      # that write the Windows metadata of a C++/CX program (/WINMD; docs/rust-port.md, step 5, part 3). So
      # the library is linked by lld-link into a DLL, rav1g.dll, with the functions of rav1g.h and the few
      # functions of the C that the player's stream readers call, and the player links its import library.
      # WindowsApp.lib is first on that link, the runtime is the app runtime (the store directory of the
      # toolset): testing/uwp_dx12_player/build_rav1g_dll.ps1.
      - name: Rust library for the default package, C of clang (rav1g.dll)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          & src/testing/uwp_dx12_player/build_rav1g_dll.ps1 -Shaders '${{ steps.shaders.outputs.normal }}' -Features 'capi,app-container' `
            -TargetDir target-app-clang -Out rust-clang
          "## Rust library for the default package, C of clang", '', "cargo rustc: $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min ($(rustc --version); $(& (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1))." >> $env:GITHUB_STEP_SUMMARY

      - name: Build the signed default package (Release x64, rav1g.dll with the C of clang)
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          # /sdl promotes upstream's deprecated GetDesktopDpi call to C4996 even without /WX.
          # _CL_ appends this override after the project's compiler options; no source patch is needed.
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-clang'
          # Building the solution supplies SolutionDir to the include paths and builds both projects.
          # Clear the upstream committed PFX: signing must use only this run's certificate in the store.
          & MSBuild.exe src/av1xbox.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustDll=$library" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'Release x64 player build/package failed; see msbuild.log' }
          $packages = @(Get-ChildItem out/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No application sideload package was produced' }
          # -sm6test needs its shaders in the player: the bytecode of each is in the program of the package.
          python src/testing/sm6test/compile.py --verify sm6test-build @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package does not have the Shader Model 6 test shaders of this run' }
          # The DLLs the programs of the package (the player and rav1g.dll, which has to be in it) import
          # from, against the list of testing/uwp_imports: the API sets of WindowsApp.lib, the runtime of
          # VCLibs, DirectX; no kernel32.dll, no desktop runtime (docs/rust-port.md, "The app container").
          python -m pip install --quiet uv
          if ($LASTEXITCODE -ne 0) { throw 'uv could not be installed' }
          python src/testing/uwp_imports/check_package.py --out out/imports --need rav1g.dll --also rav1g.dll out/packages
          if ($LASTEXITCODE -ne 0) { throw 'A program of the package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt, or rav1g.dll is not in the package' }
          # The listings describe the shipped shaders: each comes from the FXC call that wrote the header the
          # library was compiled from, and the bytecode of the headers is in the rav1g.dll of the package,
          # byte for byte.
          python src/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal --note out/cdef-shaders/stats.txt --note out/intra-shaders/stats.txt `
            --note out/shader-survey/survey.md out/imports/unpacked/rav1g.dll
          if ($LASTEXITCODE -ne 0) { throw 'The rav1g.dll of the package was not built from the shader headers of this run' }
          Remove-Item out/imports/unpacked -Recurse -Force
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          "Variant: default: the Rust library (rav1g.dll, $(rustc --version)); the C of the entropy decoder compiled by $(& (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1) with full link time optimisation, linked by lld-link; package version 0.2.$env:GITHUB_RUN_NUMBER.0" |
            Add-Content out/SOURCES.txt -Encoding utf8
          Copy-Item rust-clang/rav1g.pdb out/
          @('## rav1g test player', '', 'CI build only; console timings are taken separately.', '',
            "Two packages of the same player and the same identity (docs/test-player.md): this one, version 0.2.$env:GITHUB_RUN_NUMBER.0, the default, with the Rust library as rav1g.dll and the C of clang; 0.2.$env:GITHUB_RUN_NUMBER.2 with the Rust library linked statically and the C of MSVC.", '',
            '```') + @($packages | ForEach-Object { $_.Name }) + @(Get-Content out/imports/check.txt) + @('```', '',
            '### Artifact files', '```') +
            @(Get-ChildItem out -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath((Resolve-Path out), $_.FullName) }) +
            @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve package, certificate, dependencies, licenses, shader listings, survey and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-x64-${{ github.run_id }}
          path: out/
          if-no-files-found: warn

      # The alternative package (docs/rust-port.md, "The C runtime"): the static library with the interface
      # for C, for the DLL runtime, the C compiled by MSVC with /GL for the app family of the Windows API
      # and by the player's link.
      - name: Rust library for the alternative package, C of MSVC (static library)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.normal }}
        run: |
          $ErrorActionPreference = 'Stop'
          $separator = [char]0x1f
          $env:CARGO_ENCODED_RUSTFLAGS = "-Ctarget-feature=-crt-static${separator}--cfg${separator}windows_slim_errors"
          $env:RAV1G_C_LIB_DIR = Join-Path $env:GITHUB_WORKSPACE 'rust-msvc'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo build --manifest-path src/Cargo.toml --release --locked -p rav1g --lib --features capi,app-container `
            --target-dir target-app-msvc
          if ($LASTEXITCODE -ne 0) { throw 'cargo build of the library failed' }
          Copy-Item target-app-msvc/release/rav1g.lib rust-msvc/
          # Without the import members for desktop DLLs (kernel32.dll, ...) that the windows crates put
          # into the library: link.exe would take the functions of Windows from them.
          python src/testing/uwp_imports/prune_import_members.py --ar (Join-Path $env:ProgramFiles 'LLVM\bin\llvm-ar.exe') rust-msvc/rav1g.lib
          if ($LASTEXITCODE -ne 0) { throw 'The import members could not be taken out of rav1g.lib' }
          Get-ChildItem rust-msvc | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
          "## Rust library for the alternative package, C of MSVC", '', "cargo build: $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min ($(rustc --version))." >> $env:GITHUB_STEP_SUMMARY

      - name: Stamp the alternative package, C of MSVC (same identity, revision 2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.2"
          $manifest.Save($path)

      - name: Build the signed alternative package (rav1g.lib with the C of MSVC)
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-msvc | Out-Null
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out-msvc/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out-msvc/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-msvc'
          & MSBuild.exe src/av1xbox.sln /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustLib=$library" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'The player with the static Rust library (C of MSVC) did not build; see out-msvc/msbuild.log' }
          $packages = @(Get-ChildItem out-msvc/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No sideload package with the static Rust library (C of MSVC) was produced' }
          # The Rust library has the shaders of this run: their bytecode is in the program of the package.
          python src/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal --note out-msvc/SHADERS.txt @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package with the static Rust library was not built from the shader headers of this run' }
          python src/testing/sm6test/compile.py --verify sm6test-build @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package does not have the Shader Model 6 test shaders of this run' }
          python src/testing/uwp_imports/check_package.py --out out-msvc/imports out-msvc/packages
          if ($LASTEXITCODE -ne 0) { throw 'The program of the package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt' }
          Remove-Item out-msvc/imports/unpacked -Recurse -Force
          # The certificate, the notices and the record of the sources of the default package apply.
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'cdef-shaders', 'intra-shaders', 'sm6test-shaders', 'imports', 'rav1g.pdb') })) {
            Copy-Item $item.FullName out-msvc/ -Recurse
          }
          (Get-Content out-msvc/SOURCES.txt) -notmatch '^Variant: ' | Set-Content out-msvc/SOURCES.txt -Encoding utf8
          "Variant: alternative: the Rust library (static, $(rustc --version)); the C of the entropy decoder compiled by MSVC with /GL and by the player's link (/LTCG:incremental); package version 0.2.$env:GITHUB_RUN_NUMBER.2" |
            Add-Content out-msvc/SOURCES.txt -Encoding utf8
          @('## Alternative package: static Rust library, C of MSVC', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.2: installs over 0.2.$env:GITHUB_RUN_NUMBER.0.", '', '```') +
            @($packages | ForEach-Object { $_.Name }) + @(Get-Content out-msvc/imports/check.txt) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the alternative package (C of MSVC)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-msvc-x64-${{ github.run_id }}
          path: out-msvc/
          if-no-files-found: warn

      # The uavsync package: the default package with every group sync of the shaders compiled as a sync
      # of all memory (AllMemoryBarrierWithGroupSync): rav1g.dll built from the shader headers of the
      # uavsync variant of the Shaders step, with the uavsync feature of the crates, which makes the
      # library say which shaders it has. An experiment for a device on which a frame buffer store of one
      # thread is not seen by another thread of the group behind a sync of the group memory alone
      # (docs/test-player.md, "Experiments"). Same identity as the default package and revision 1 instead
      # of 0: it installs over the default package of this run and keeps its LocalState, and the default
      # package of a later run installs over it.
      - name: Rust library for the uavsync package (rav1g.dll with the uavsync shaders)
        if: ${{ inputs.experiments }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & src/testing/uwp_dx12_player/build_rav1g_dll.ps1 -Shaders '${{ steps.shaders.outputs.uavsync }}' -Features 'capi,app-container,uavsync' `
            -TargetDir target-app-uavsync -Out rust-uavsync

      - name: Stamp the uavsync package (same identity, revision 1)
        if: ${{ inputs.experiments }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.1"
          $manifest.Save($path)

      - name: Build the signed uavsync package (all-memory group syncs)
        if: ${{ inputs.experiments }}
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-uavsync | Out-Null
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out-uavsync/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out-uavsync/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-uavsync'
          & MSBuild.exe src/av1xbox.sln /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustDll=$library" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'uavsync player build/package failed; see out-uavsync/msbuild.log' }
          $packages = @(Get-ChildItem out-uavsync/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No uavsync sideload package was produced' }
          python src/testing/uwp_imports/check_package.py --out out-uavsync/imports --need rav1g.dll --also rav1g.dll out-uavsync/packages
          if ($LASTEXITCODE -ne 0) { throw 'A program of the uavsync package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt, or rav1g.dll is not in the package' }
          # The rav1g.dll of the package has the shaders of the uavsync build (the action has checked that
          # they are not those of the normal build).
          python src/testing/shader_cache/shaders.py verify --report shader-build/uavsync/report.json `
            --root shader-build/uavsync --note out-uavsync/SHADERS.txt out-uavsync/imports/unpacked/rav1g.dll
          if ($LASTEXITCODE -ne 0) { throw 'The rav1g.dll of the uavsync package was not built from the uavsync shader headers of this run' }
          Remove-Item out-uavsync/imports/unpacked -Recurse -Force
          # The certificate, the notices and the record of the sources of the default package apply.
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'cdef-shaders', 'intra-shaders', 'sm6test-shaders', 'imports', 'rav1g.pdb') })) {
            Copy-Item $item.FullName out-uavsync/ -Recurse
          }
          (Get-Content out-uavsync/SOURCES.txt) -notmatch '^Variant: ' | Set-Content out-uavsync/SOURCES.txt -Encoding utf8
          "Variant: uavsync: the default build (rav1g.dll, C of clang) with the shaders compiled with GroupMemoryBarrierWithGroupSync=AllMemoryBarrierWithGroupSync; package version 0.2.$env:GITHUB_RUN_NUMBER.1" |
            Add-Content out-uavsync/SOURCES.txt -Encoding utf8
          Copy-Item rust-uavsync/rav1g.pdb out-uavsync/
          @('## uavsync package', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.1: installs over 0.2.$env:GITHUB_RUN_NUMBER.0.", '', '```') +
            @($packages | ForEach-Object { $_.Name }) + @(Get-Content out-uavsync/imports/check.txt) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the uavsync package
        if: ${{ always() && inputs.experiments }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-uavsync-x64-${{ github.run_id }}
          path: out-uavsync/
          if-no-files-found: warn

  # The streams of the conformance run: AOM's decoder test vectors with AOM's md5 files, cuts of
  # Netflix Open Content and streams encoded here with SVT-AV1, both with md5 references from dav1d
  # (testing/conformance/streams.txt, prepare_streams.sh). The streams are media: they are kept in
  # the Actions cache, keyed by the list and the scripts that make them, and never in the repository
  # or in an artifact. The artifact of this job has the md5 references and the task list only.
  conformance-streams:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache key
        id: key
        run: echo "key=conformance-streams-v1-${{ hashFiles('testing/conformance/streams.txt', 'testing/conformance/prepare_streams.sh', 'testing/md5ref/make_md5_ref.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Streams from the cache
        id: streams
        uses: actions/cache@v6
        with:
          path: conformance-streams
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: Fetch and make the streams and their md5 references
        if: steps.streams.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          sh testing/conformance/prepare_streams.sh conformance-streams 2>&1 | grep -v '^Svt\[info\]' | tee prepare.log

      - name: Collect the md5 references (no media)
        run: |
          set -euo pipefail
          mkdir conformance-md5
          cp conformance-streams/manifest.txt conformance-streams/SOURCES.txt conformance-md5/
          (cd conformance-streams && find . -name '*.md5' | while read -r f; do
            mkdir -p "../conformance-md5/$(dirname "$f")" && cp "$f" "../conformance-md5/$f"; done)
          {
            echo '## Conformance streams'
            echo
            echo "- $(grep -c . conformance-streams/manifest.txt) streams, $(du -sh conformance-streams | cut -f1) (cache \`${{ steps.key.outputs.key }}\`, hit: ${{ steps.streams.outputs.cache-hit == 'true' }})"
            echo '```'
            cat conformance-streams/SOURCES.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the md5 references and the task list
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-conformance-md5-${{ github.run_id }}
          path: conformance-md5/
          if-no-files-found: error

  # The equality reference (docs/rust-port.md, "Equality reference"): warp_decoder, the desktop program of
  # the C++ decoder, built from branch cpp at the commit CPP_REFERENCE_COMMIT names, with the shaders of
  # that commit. It decodes the conformance set, writes the stage dumps and the MEMORY lines with the
  # scripts, the streams and the task lists of this commit, and the rust-equal job holds what rav1g-dec
  # wrote against it. The C++ decoder itself is tested by the workflow of its own branch; here it is only
  # the second implementation the Rust decoder has to agree with, for as long as the two branches have the
  # same shaders (rust-equal checks that first).
  cpp-reference:
    needs: conformance-streams
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLATFORM_TOOLSET: v145
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the C++ decoder (branch cpp at the pinned commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CPP_REFERENCE_COMMIT }}
          path: cpp-reference
          persist-credentials: false

      - uses: microsoft/setup-msbuild@v3

      # The shaders of the pinned commit, by its own script and action: the same cache as the other jobs,
      # so no shader is compiled while the shaders of the two branches are the same.
      - name: Shaders of the C++ decoder
        id: shaders
        uses: ./cpp-reference/.github/actions/shaders
        with:
          repo: cpp-reference
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Build warp_decoder of the C++ decoder (desktop, Release x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          $commit = git -C cpp-reference rev-parse HEAD
          if ($commit -ne $env:CPP_REFERENCE_COMMIT) { throw "cpp-reference is at $commit, not at $env:CPP_REFERENCE_COMMIT" }
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out/msbuild.log'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          & MSBuild.exe cpp-reference/testing/warp_decoder/warp_decoder.vcxproj /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            "/p:Rav1gPrebuiltShaders=${{ steps.shaders.outputs.normal }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'warp_decoder build failed; see msbuild.log' }
          $bin = 'cpp-reference/testing/warp_decoder/bin/x64/Release'
          if (-not (Test-Path "$bin/warp_decoder.exe")) { throw 'warp_decoder.exe was not produced' }
          # Built from the headers of the Shaders step: MSBuild ran FXC on no shader, and their bytecode
          # is in the program.
          if (Select-String -Path $buildLog -Pattern 'fxc\.exe.*[\\/]dx[\\/]shaders[\\/]' -Quiet) {
            throw 'MSBuild compiled the shaders itself: Rav1gPrebuiltShaders was not in effect'
          }
          python cpp-reference/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal "$bin/warp_decoder.exe"
          if ($LASTEXITCODE -ne 0) { throw 'warp_decoder was not built from the shader headers of the pinned commit' }
          New-Item -ItemType Directory -Force out/warp_decoder, out/shaders | Out-Null
          Copy-Item "$bin/warp_decoder.exe" out/warp_decoder/
          # Which shaders the reference has, for the rust-equal job.
          Copy-Item shader-build/normal/report.json out/shaders/report.json
          "Commit: $commit (branch cpp of https://github.com/$env:GITHUB_REPOSITORY)",
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: Release x64; PlatformToolset=$env:PLATFORM_TOOLSET; Windows SDK=$env:WINDOWS_SDK" |
            Set-Content out/SOURCES.txt -Encoding utf8
          "## Equality reference: warp_decoder of the C++ decoder", '',
            "Branch cpp at ``$commit``: $(git -C cpp-reference log -1 --format=%s). Built in $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min.", '' >> $env:GITHUB_STEP_SUMMARY

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # Every stream of the set, for the md5 of every output frame. The C++ decoder has to give the results
      # of expected.txt as well: a reference that is wrong itself is no reference.
      - name: Decode every stream on WARP with the C++ decoder
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --out out/conformance --threads 4 "--title=warp_decoder of branch cpp (the equality reference)"
          if ($LASTEXITCODE -ne 0) { throw "conformance run of the reference: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # Stage dumps (testing/conformance/dump_tasks.txt): the buffers behind every GPU stage of a few
      # frames, as the C++ decoder's shaders wrote them on WARP. Dumps of the vectors and of the streams
      # encoded here; of the cuts of published streams only digests (hashes), never samples.
      - name: Stage dumps of the frames in dump_tasks.txt with the C++ decoder
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/stage_dump/ci_dumps.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps --threads 4
          if ($LASTEXITCODE -ne 0) { throw "stage dumps of the reference: exit code $LASTEXITCODE" }

      # The MEMORY lines of the decoder (testing/conformance/memory_lines.py): what a decoder of a few
      # configurations holds, its budget line and the steps of its release.
      - name: MEMORY log lines of a few decoder configurations with the C++ decoder
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/memory_lines.py run --tool out/warp_decoder/warp_decoder.exe `
            --streams conformance-streams --out out/memory-lines
          if ($LASTEXITCODE -ne 0) { throw "memory lines of the reference: exit code $LASTEXITCODE" }

      - name: Preserve the stage dumps of the reference
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-cpp-reference-stage-dumps-${{ github.run_id }}
          path: out/stage-dumps/
          if-no-files-found: warn

      - name: Preserve the results, the per-stream logs and md5 files, the MEMORY lines and the build log of the reference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-cpp-reference-${{ github.run_id }}
          path: |
            out/conformance/
            out/memory-lines/
            out/shaders/
            out/SOURCES.txt
            out/msbuild.log
          if-no-files-found: warn

  # The decoder as a desktop console program (docs/rust-port.md): the Cargo workspace builds the Rust library
  # with the C of the parser and entropy decoder (crates/rav1g-sys, cc) from the shader headers of the Shaders
  # step, and rav1g-dec (tools/rav1g-dec) with MSVC. This job builds the program once, runs the unit tests
  # and the Shader Model 6 test, and keeps the program as an artifact. The jobs behind it take the program
  # from there and run side by side, each on its own runner, every check on the D3D12 WARP software adapter
  # (docs/warp-decoder.md, "The jobs of a push"):
  #   rust-conformance  the set through the Rust interface and through rav1g.h, the test player's decoder
  #                     code, the parse digest, decode errors, the order check, the memory check, the timing
  #                     smoke test, the stage dumps and the MEMORY lines;
  #   rust-parser-c     the same checks with the other parser of the decoder (-parser c);
  #   rust-switches     the other side of the decoder's switches: the poisoned buffers, the fast inter
  #                     path, the switches of rav1d's parse;
  #   rust-clears       the clears of a pipeline slot: who clears what without a flag (nobody), and the
  #                     ways that clear the wavefront grid: -gpuclear, -cpuclear, -syncclear;
  #   rust-parsers-equal  what the four wrote, held against each other;
  #   rust-experiments, parser-timing  only when the workflow is started for them.
  # The rust-equal job then holds the md5 per frame, the stage dumps and the MEMORY lines of rust-parser-c
  # against those of the C++ decoder (cpp-reference).
  rust:
    needs: conformance-streams
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same cache and keys as the player job: the same bytecode.
      - name: Shaders
        id: shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Shader Model 6 test shaders
        id: sm6
        uses: ./.github/actions/sm6test-shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      # Stable Rust (the minimum supported version is the latest stable), and libclang for bindgen.
      - name: Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install stable' }
          rustup default stable
          rustc --version
          cargo --version
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $llvm 'libclang.dll')) { "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV }

      # nasm, for the assembly of rav1d's parse pass (third_party/rav1d).
      - name: nasm
        uses: ./.github/actions/nasm

      - uses: Swatinem/rust-cache@v2

      - name: Build rav1g-dec (cargo, MSVC, release)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.normal }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/rav1g-dec | Out-Null
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          $built = [math]::Round($clock.Elapsed.TotalMinutes, 1)
          if (-not (Test-Path target/release/rav1g-dec.exe)) { throw 'rav1g-dec.exe was not produced' }
          # Built from the headers of the Shaders step: their bytecode is in the program, byte for byte.
          python testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal target/release/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'rav1g-dec was not built from the shader headers of this run' }
          python testing/sm6test/compile.py --verify sm6test-build target/release/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'rav1g-dec does not have the Shader Model 6 test shaders of this run' }
          Copy-Item target/release/rav1g-dec.exe, target/release/rav1g_dec.pdb -Destination out/rav1g-dec/
          # Binary redistribution retains the BSD notices and AOM patent license, including libwebm and
          # rav1d (the library has rav1d's parse pass, third_party/rav1d), and the MIT and Apache-2.0
          # notices of the crates the library links (third_party/rust-crates/NOTICES.txt, which the
          # rust-cross job holds against Cargo.lock).
          foreach ($license in @('LICENSE.txt', 'libav1/LICENSE', 'libav1/PATENTS',
              'third_party/libwebm/LICENSE.TXT', 'third_party/libwebm/PATENTS.TXT',
              'third_party/rav1d/COPYING', 'third_party/rav1d/doc/PATENTS',
              'third_party/rust-crates/NOTICES.txt')) {
            $destination = Join-Path out/rav1g-dec/licenses $license
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $license $destination
          }
          "Commit: $env:GITHUB_SHA", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: cargo build --release, $(rustc --version), MSVC" |
            Set-Content out/rav1g-dec/SOURCES.txt -Encoding utf8
          "## rav1g-dec", '', "cargo build --release: $built min ($(rustc --version)).", '' >> $env:GITHUB_STEP_SUMMARY

      # The unit tests of the workspace (the md5 of rav1g-dec, its argument parser) and the layout tests of
      # the bindings (crates/rav1g-sys/src/layout_tests.rs): the size and alignment of every struct that
      # Rust shares with the C interface, the entropy decoder or the shaders, and the offset and size of
      # each of its fields, as the bindings have them against what the C compiler of this build says; and
      # MB_MODE_INFO of blockd.h against the struct the shaders read it with (dx/shaders/mode_info.h).
      - name: Tests (cargo test)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.normal }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          cargo test --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }

      # Shader Model 6 test (docs/test-player.md): what WARP reports about itself (CAPS lines) and the test
      # shaders run on it (SM6TEST lines), for reference next to the console's. What WARP does with a shader
      # is a result and never fails the job: a pipeline state it refuses (PSO FAILED) and values that differ
      # (FAIL, with a warning on the run). The job fails when the test itself breaks: the program ends with
      # an error, a test has no result line, the report is missing.
      - name: Shader Model 6 test on WARP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/sm6test | Out-Null
          & out/rav1g-dec/rav1g-dec.exe -sm6test > out/sm6test/warp.log
          $code = $LASTEXITCODE
          $lines = @(Get-Content out/sm6test/warp.log)
          $shown = @($lines | Where-Object { $_ -match '^(ADAPTER|CAPS|SM6TEST) ' })
          @('## Shader Model 6 test on WARP', '', '```') + $shown + @('```', '') >> $env:GITHUB_STEP_SUMMARY
          $shown | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "rav1g-dec -sm6test: exit code $code (2: the test could not run its shaders; see the SM6TEST lines)" }
          $expected = @((Get-Content sm6test-build/report.json -Raw | ConvertFrom-Json).shaders).Count
          $results = @($lines | Where-Object { $_ -match '^SM6TEST \S+: (PASS|FAIL|PSO FAILED|NOT BUILT)' })
          if ($results.Count -ne $expected) { throw "$($results.Count) result lines for $expected test shaders" }
          if (-not @($lines | Where-Object { $_ -match '^SM6TEST summary: ' }).Count) { throw 'No SM6TEST summary line' }
          if (@($lines | Where-Object { $_ -match '^CAPS ' }).Count -lt 15) { throw 'The capability report is not complete' }
          foreach ($needed in @('^CAPS shader model: ', '^CAPS options1: ', '^CAPS options4: ', '^CAPS wave size: ')) {
            if (-not @($lines | Where-Object { $_ -match $needed }).Count) { throw "No line $needed in the capability report" }
          }
          $failed = @($results | Where-Object { $_ -match '^SM6TEST \S+: FAIL' })
          foreach ($line in $failed) { Write-Host "::warning title=Shader Model 6 test on WARP::$line" }

      # rav1g-dec with the shaders of the uavsync package, for the rust-experiments job: the uavsync feature
      # of the crates and the shader headers of that variant.
      - name: Build rav1g-dec with the shaders of the uavsync package
        if: ${{ inputs.experiments }}
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.uavsync }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p rav1g-dec --features uavsync --target-dir target-uavsync
          if ($LASTEXITCODE -ne 0) { throw 'cargo build of rav1g-dec with the uavsync shaders failed' }
          New-Item -ItemType Directory -Force out/rav1g-dec-uavsync | Out-Null
          Copy-Item target-uavsync/release/rav1g-dec.exe out/rav1g-dec-uavsync/
          python testing/shader_cache/shaders.py verify --report shader-build/uavsync/report.json `
            --root shader-build/uavsync out/rav1g-dec-uavsync/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'The uavsync rav1g-dec was not built from the uavsync shader headers of this run' }

      - name: Preserve the log of the Shader Model 6 test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-sm6test-${{ github.run_id }}
          path: out/sm6test/
          if-no-files-found: warn

      - name: Preserve rav1g-dec.exe with the shaders of the uavsync package
        if: ${{ inputs.experiments }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-uavsync-x64-${{ github.run_id }}
          path: out/rav1g-dec-uavsync/
          if-no-files-found: error

      # The program every job behind this one runs.
      - name: Preserve rav1g-dec.exe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec/
          if-no-files-found: warn

  # Conformance run of the decoder: rav1g-dec of the rust job decodes every stream of the set on the D3D12
  # WARP software adapter of the runner and compares the md5 of every output frame with the reference.
  # testing/conformance/expected.txt lists the streams that fail today; a pass fails on a failure that is
  # not listed, on a failure of another kind than listed, on a crash or timeout that is not listed, and
  # when a listed stream passes. Then the checks that need no second parser and no switch: the set through
  # rav1g.h, the test player's decoder code, the parse digest, decode errors, the order check, the memory
  # check, the timing smoke test, the stage dumps and the MEMORY lines.
  rust-conformance:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The decoder code of the test player (testing/player_common), run as the player runs it: its task
      # file, its decoder creation with a device and no queue, its output pool, its md5 check, through
      # rav1g.h on the Rust library: the files and the functions the packages of the player job have. The
      # player itself is a UWP app and does not run here; rav1g-dec -playersmoke is the part of it that
      # uses the decoder (testing/conformance/player_smoke.py). Every task has to end with "MD5 is OK", the
      # log must name the Rust library and have no error line, and the launch has to end, also without a
      # task file.
      - name: The test player's decoder code through rav1g.h on the Rust library (rav1g-dec -playersmoke)
        shell: pwsh
        run: |
          python testing/conformance/player_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke "--title=the Rust library (cargo, MSVC)"
          if ($LASTEXITCODE -ne 0) { throw "the player's decoder code on the Rust library: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      # Every stream of the set, against its reference and expected.txt. The decoder of a task that names
      # no parser reads its stream with the parse pass of rav1d and the two switches that are on by
      # default (docs/phase2-rav1d.md): this run and every check below that names no parser are checks of
      # that parser, and the run has to say so. It also has to say that the clears of a pipeline slot are
      # nowhere, the default: the wavefront of intra prediction is kept at the edges of the tiles (the
      # rust-clears job has the runs with -gpuclear, -cpuclear and -syncclear).
      - name: Decode every stream on WARP with rav1g-dec and compare with expected.txt
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance --threads 4 "--title=rav1g-dec (cargo, MSVC)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance/lists/run001.log -Pattern '^PARSER .*the parse pass of rav1d.*switches nolfmask,tilethread \(' -Quiet)) {
            throw 'The decoder of this run does not report the parse pass of rav1d with its default switches'
          }
          if (-not (Select-String -Path out/conformance/lists/run001.log -Pattern 'clears completion thread' -Quiet)) {
            throw 'The decoder of this run does not report the clears on the completion thread'
          }
          if ($code -ne 0) { throw "conformance run with rav1g-dec: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # The parser of phase 2 in this build (docs/phase2-rav1d.md): rav1d's parse pass on every stream,
      # with four threads, and what it read folded into a number per stream. The parse-digest job holds
      # the lines against those of the Linux build, whose parser is checked against the entropy decoder
      # of libaom value by value (parse-check).
      - name: Parse digest of every stream, rav1d's parse pass in rav1g-dec (-parsedigest)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/parse-digest | Out-Null
          $tool = Resolve-Path out/rav1g-dec/rav1g-dec.exe
          Push-Location conformance-streams
          & $tool -parsedigest -t 4 -list manifest.txt > ../out/parse-digest/digest.txt
          $code = $LASTEXITCODE
          Pop-Location
          $lines = @(Select-String -Path out/parse-digest/digest.txt -Pattern '^PARSEDIGEST ').Count
          "## Parse digest, rav1g-dec (cargo, MSVC)", '', "$lines streams, exit code $code." >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { Get-Content out/parse-digest/digest.txt | Select-Object -Last 20; throw "rav1g-dec -parsedigest: exit code $code" }

      - name: Preserve the parse digests of the MSVC build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-parse-digest-msvc-${{ github.run_id }}
          path: out/parse-digest/
          if-no-files-found: warn

      # The interface for C (docs/rust-port.md, step 5): the whole set once more with -capi, which uses
      # the decoder through the functions of rav1g.h (the device, the settings, the output callbacks, the
      # frames), as the UWP test player and every application that is not Rust does.
      - name: Decode every stream on WARP through rav1g.h (rav1g-dec -capi)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-capi --threads 4 "--tool-args=-capi" "--title=rav1g-dec through rav1g.h (-capi)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance-capi/lists/run001.log -Pattern '^INTERFACE .*rav1g\.h' -Quiet)) {
            throw 'The decoder of this run does not report the interface for C'
          }
          if ($code -ne 0) { throw "conformance run with rav1g-dec -capi: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # A decode error in the middle of a stream (testing/conformance/cut_tile_check.py): the tile data of
      # one temporal unit of two streams of the set cut short (one tile, eight tiles), which fails behind
      # the frame's setup and before its submission. The task ends with the error, with the frames before
      # it right, and the stream behind it in the same process decodes right; with -continue_on_error the
      # same decoder is given the rest of the stream, and the frames from the next key frame on are those
      # of the reference; no device is lost. Through the Rust interface, through rav1g.h, and with the
      # decoder code of the test player (-playersmoke), whose task ends with the error and whose stream
      # behind it decodes right, and which goes on with -continue_on_error as the program does.
      - name: Decode error in a cut stream, rav1g-dec
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { throw "decode error check with rav1g-dec: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-capi" `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { throw "decode error check with rav1g-dec -capi: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }
          python testing/conformance/cut_tile_check.py --player-smoke out/rav1g-dec/rav1g-dec.exe `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { throw "decode error check with the player's decoder code: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      # Order check (testing/conformance/order_check.py; docs/gpu-av1-decoder.md, "Padding of the mode info
      # record"): what a decoder writes must not depend on what the process decoded before. The sequences that
      # showed such a dependence, each in one decoder process and in this order, every stream against its
      # reference: an 8-bit quantizer vector and then the first 10-bit one, the ten 8-bit ones and then the
      # 10-bit one (-t 1 and -t 4), svc-L2T1 and then svc-L2T1-2. No stream is decoded again alone: that is
      # what kept the dependence out of sight. Only a sequence that lost the D3D12 device runs again, whole.
      - name: Order check, streams one after the other in one process
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/order_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/order-check "--title=rav1g-dec (cargo, MSVC)"
          if ($LASTEXITCODE -ne 0) { throw "order check with rav1g-dec: exit code $LASTEXITCODE (1: a stream is wrong behind other streams, 2: the check could not be done)" }

      # Memory check (testing/conformance/memory_check.py; docs/warp-decoder.md, "Memory check"): what the
      # console showed twice and no run here could: a destroyed decoder that leaves memory behind, and a
      # budget guard that loses its credit when a creation is refused. One process creates, uses and
      # releases decoders of several configurations eight times over (the largest stream, a decoder of the
      # 4K 10-bit size, three slots, -lowmem, a creation the guard must refuse, a smaller one it must
      # accept); the video memory of the adapter after every release must be what it was before the first
      # decoder, and the private bytes of the process must stop growing once the process is warm. Then
      # the player's decoder code with a modelled app memory limit: a refused creation, and behind it a
      # smaller decoder that is accepted only with the credit of the decoder released before.
      - name: Memory check, decoders one after the other in one process
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/memory_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check "--title=rav1g-dec (cargo, MSVC)"
          if ($LASTEXITCODE -ne 0) { throw "memory check with rav1g-dec: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      # The inter breakdown of the timing run (-gputimedetail, -gputimeisolate; docs/test-player.md, "Inter
      # prediction breakdown") as a smoke test: a 10-bit stream and one with scaled references, each decoded
      # with -gputime, -gputimedetail and -gputimeisolate against its reference. WARP's times say nothing;
      # checked are the output, that the breakdown is there, that the dispatches the recording counts and
      # the blocks the tile threads count agree on every frame, and that the numbers are plausible.
      - name: Timing run with the inter breakdown on WARP with rav1g-dec (smoke test)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/gputime_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/gputime-smoke --threads 4 --stream nf-chimera-10b-1080p.ivf:16 --stream syn-resize-10b-1080p.ivf:24:scaled `
            --stream nf-chimera-8b-270p.ivf:40
          if ($LASTEXITCODE -ne 0) { throw "inter breakdown smoke test with rav1g-dec: exit code $LASTEXITCODE (1: a check failed, 2: a run could not be done)" }

      # Stage dumps (testing/conformance/dump_tasks.txt): the buffers behind every GPU stage of a few
      # frames, as WARP wrote them, to compare with the dumps of another device (the test player's
      # -dumpstages) with testing/stage_dump/stage_dump.py, and in the rust-parsers-equal job with the
      # dumps of -parser c and of the other switches of the parser. Dumps of the vectors and of the streams
      # encoded here; of the cuts of published streams only digests (hashes), never samples.
      - name: Stage dumps of the frames in dump_tasks.txt with rav1g-dec
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps --threads 4
          if ($LASTEXITCODE -ne 0) { throw "stage dumps with rav1g-dec: exit code $LASTEXITCODE" }

      # The MEMORY lines of the decoder (testing/conformance/memory_lines.py): what a decoder of a few
      # configurations holds, its budget line and the steps of its release, for the comparison with the
      # lines of -parser c in the rust-parsers-equal job.
      - name: MEMORY log lines of a few decoder configurations with rav1g-dec
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/memory_lines.py run --tool out/rav1g-dec/rav1g-dec.exe `
            --streams conformance-streams --out out/memory-lines
          if ($LASTEXITCODE -ne 0) { throw "memory lines with rav1g-dec: exit code $LASTEXITCODE" }

      - name: Preserve the stage dumps of rav1g-dec
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-stage-dumps-${{ github.run_id }}
          path: out/stage-dumps/
          if-no-files-found: warn

      - name: Preserve the results, the per-stream logs and md5 files of rav1g-dec
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-conformance-${{ github.run_id }}
          path: |
            out/conformance/
            out/conformance-capi/
            out/order-check/
            out/memory-check/
            out/gputime-smoke/
            out/memory-lines/
            out/player-smoke/
            out/cut-tile/
          if-no-files-found: warn

  # The entropy decoder of libaom, which stays the other parser of the decoder until the last step of
  # phase 2 (docs/phase2-rav1d.md): the checks of the rust-conformance and rust-switches jobs once more
  # with -parser c. The whole set against its references and expected.txt, a part of it through rav1g.h,
  # the decode errors in cut streams (with the words and the error behaviour of that parser), the order
  # check, the memory check, the part of the set with -poisonmi and with -poisonbuf, the whole set with
  # -interfast, the decoder code of the test player with its -parser flag, the stage dumps and the MEMORY
  # lines. The rust-equal job holds this run, not the one of rust-conformance, against the C++ decoder,
  # whose parser is the same C; the rust-parsers-equal job holds it against the run of rust-conformance.
  rust-parser-c:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Decode every stream on WARP with -parser c
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-c --threads 4 "--tool-args=-parser c" "--title=rav1g-dec (cargo, MSVC) with -parser c"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance-c/lists/run001.log -Pattern '^PARSER .*the entropy decoder of libaom' -Quiet)) {
            throw 'The decoder of this run does not report the entropy decoder of libaom'
          }
          if ($code -ne 0) { throw "conformance run with -parser c: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      - name: The other checks with -parser c
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          $part = '--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)'
          $runs = @(@{ name = 'poisonmi-c'; args = '-poisonmi -parser c'; only = $part },
            @{ name = 'poisonbuf-c'; args = '-poisonbuf -parser c'; only = $part },
            @{ name = 'capi-c'; args = '-capi -parser c'; only = $part },
            @{ name = 'interfast-c'; args = '-interfast -parser c'; only = '--only=' })
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" `
              "--title=rav1g-dec (cargo, MSVC) with $($run.args)" $run.only
            if ($LASTEXITCODE -ne 0) { $failed += "conformance with $($run.args): exit code $LASTEXITCODE" }
          }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe --parser c `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { $failed += "decode error check: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-capi" --parser c `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { $failed += "decode error check with -capi: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --player-smoke out/rav1g-dec/rav1g-dec.exe --parser c `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { $failed += "decode error check with the player's decoder code: exit code $LASTEXITCODE" }
          python testing/conformance/order_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/order-check-c "--tool-args=-parser c" "--title=rav1g-dec (cargo, MSVC) with -parser c"
          if ($LASTEXITCODE -ne 0) { $failed += "order check: exit code $LASTEXITCODE" }
          python testing/conformance/memory_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check-c "--tool-args=-parser c" "--title=rav1g-dec (cargo, MSVC) with -parser c"
          if ($LASTEXITCODE -ne 0) { $failed += "memory check: exit code $LASTEXITCODE" }
          python testing/conformance/player_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-c "--player-args=-parser c" "--title=the Rust library (cargo, MSVC), the player with -parser c"
          if ($LASTEXITCODE -ne 0) { $failed += "the player's decoder code: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "with -parser c: $($failed -join '; ')" }

      # The stage dumps and the MEMORY lines of -parser c (the comments are in the rust-conformance job):
      # what the rust-parsers-equal job holds against those of the default parser, and the rust-equal job
      # against those of the C++ decoder.
      - name: Stage dumps and MEMORY log lines with -parser c
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps-c --threads 4 "--tool-args=-parser c"
          if ($LASTEXITCODE -ne 0) { $failed += "stage dumps with -parser c: exit code $LASTEXITCODE" }
          python testing/conformance/memory_lines.py run --tool out/rav1g-dec/rav1g-dec.exe `
            --streams conformance-streams --out out/memory-lines-c "--tool-args=-parser c"
          if ($LASTEXITCODE -ne 0) { $failed += "memory lines with -parser c: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "with -parser c: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs, the md5 files, the stage dumps and the MEMORY lines of -parser c
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-parser-c-${{ github.run_id }}
          path: |
            out/conformance-*/
            out/*-c/
            out/cut-tile/
          if-no-files-found: warn

  # The other side of the decoder's switches, each with the parser and the other switches of the default:
  # the poisoned mode info pool and the poisoned buffers (a part of the set), the fast inter path (the
  # whole set), and the switches of rav1d's parse (the whole set, the stage dumps, the test player's
  # decoder code, decode errors). The clears of a pipeline slot have a job of their own (rust-clears).
  rust-switches:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The dependence of the order check (rust-conformance: what a decoder writes must not depend on what
      # the process decoded before) without waiting for the memory of an earlier decoder: with -poisonmi the decoder
      # fills the mode info pool with the byte 0xA5 when it creates it, so a shader that reads bytes of a
      # record that the entropy decoder never wrote (padding of the C struct, a field the block's kind does
      # not have) gives another output at once. The output has to be the same: a part of the set, about half
      # a minute (ten quantizer vectors of each bit depth, the other vectors, one cut), has to give the
      # results of expected.txt.
      - name: Conformance of the vectors with a poisoned mode info pool (-poisonmi)
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-poisonmi --threads 4 "--tool-args=-poisonmi" "--title=rav1g-dec, part of the set with -poisonmi" `
            "--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -poisonmi with rav1g-dec: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # -poisonbuf, the same for every buffer the CPU writes for the shaders, and for the constants of the
      # stages in every frame: their memory is reused from frame to frame, so the decoder fills each record
      # with 0xA5 when it hands it out, right before the stage writes it. A field that a stage does not write
      # and a shader reads then has no plausible value left from an earlier frame. That was the case of loop
      # restoration, whose shader computed an address from the unit fields of a plane without restoration
      # and loaded from it, which could remove the device (docs/gpu-av1-decoder.md, "Unwritten fields of a
      # constant record"). The same part of the set as with -poisonmi has to give the results of
      # expected.txt; the whole set, also with -interfast and with -intrav2, is decoded with it when the
      # workflow is started with the experiments input (rust-experiments).
      - name: Conformance of the vectors with poisoned buffers and constants (-poisonbuf)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-poisonbuf --threads 4 "--tool-args=-poisonbuf" "--title=rav1g-dec, part of the set with -poisonbuf" `
            "--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -poisonbuf with rav1g-dec: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The fast inter path (-interfast; docs/gpu-av1-decoder.md, "Inter prediction: breakdown and fast
      # paths"): the blocks with one reference and the averaged compound blocks are listed by the fraction
      # of their motion vectors and predicted by inter_fast.hlsl and inter_compound_fast.hlsl. The output
      # has to be the same, so the whole set is decoded once more with the flag and has to give the
      # results of expected.txt. This pass is the gate of the feature and runs on every push.
      - name: Conformance with -interfast
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-interfast --threads 4 "--tool-args=-interfast" "--title=rav1g-dec with -interfast"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -interfast: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The switches of rav1d's parse (-parseopt, docs/phase2-rav1d.md "Where the time goes"): ways of doing
      # the same parse. Here the other side of each: the two that are on by default off, which is rav1d's
      # parse as upstream schedules it, the block lists of a tile counted at its end and not superblock by
      # superblock (latelists), and the calls of the sink timed. The whole set against its references and
      # expected.txt, the stage dumps, the decoder code of the test player with its -parseopt flag, and the
      # decode errors in cut streams (a tile that is handed from thread to thread ends as one that keeps
      # its thread). The rust-parsers-equal job holds the stage dumps and the md5 of every frame against
      # those of -parser c, and the stage dumps against those of the default switches byte for byte.
      - name: The other side of every switch of the parser (-parseopt none,latelists)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          $switches = '-parser rav1d -parseopt none,latelists,time'
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-switches-rav1d --threads 4 "--tool-args=$switches" "--title=rav1g-dec (cargo, MSVC) with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with ${switches}: exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out/conformance-switches-rav1d/lists/run001.log -Pattern '^PARSER .*switches none,time,latelists \(' -Quiet)) {
            $failed += 'the decoder of the run does not report the switches of the parser'
          }
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps-switches-rav1d --threads 4 "--tool-args=$switches"
          if ($LASTEXITCODE -ne 0) { $failed += "stage dumps with ${switches}: exit code $LASTEXITCODE" }
          python testing/conformance/player_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-switches-rav1d "--player-args=$switches" "--title=the Rust library (cargo, MSVC), the player with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "the player's decoder code with ${switches}: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-parseopt none,latelists" --parser rav1d `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { $failed += "decode error check with -parseopt none,latelists: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "the switches of the parser: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs, the md5 files and the stage dumps of the switches
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-switches-${{ github.run_id }}
          path: |
            out/conformance-*/
            out/*-rav1d/
            out/cut-tile/
          if-no-files-found: warn

  # The clears of a pipeline slot (docs/test-player.md, "Pipeline slots and clears"; docs/phase2-rav1d.md,
  # "No clears by the CPU"). Without a flag, which is every other run of the workflow, a frame keeps the
  # wavefront of intra prediction at the edges of its tiles and no thread clears a grid of the slot for
  # it. Here the ways that keep the wavefront in the slot's grid and clear it for every frame, which stay
  # as switches: by the GPU at the end of the frame's command list (-gpuclear), by the completion thread
  # (-cpuclear, the default up to package 0.2.144), by the decode thread (-syncclear, the default up to
  # 0.2.139). The output has to be the same with each.
  rust-clears:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # Who clears what, from the timing run (testing/conformance/clears_check.py): the 2160p stream and
      # the stream with eight tiles, each decoded in every way, also with the mode info grid cleared for
      # every frame (-parseopt cleargrid, -parser c). Without a flag the completion thread and the GPU
      # clear nothing and the decode and tile threads the counters of the tiles' block lists; with
      # -gpuclear the command list of every frame clears, and no thread; with -cpuclear the completion
      # thread clears the same bytes; with -syncclear the decode thread.
      - name: Who clears the grids of a slot, and how much
        shell: pwsh
        run: |
          python testing/conformance/clears_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/clears-check --threads 4 --stream nf-dvbdash-d2-10b-2160p.ivf --stream syn-tiles-10b-1080p.ivf:24
          if ($LASTEXITCODE -ne 0) { throw "the clears of a slot: exit code $LASTEXITCODE (1: a check failed, 2: a run could not be done)" }

      # The clears by the GPU: the whole set has to give the results of expected.txt, and the memory check
      # has to hold (the grids of such a decoder are buffers the GPU may write; they are released like the
      # others).
      - name: Conformance and memory check with the clears of the GPU (-gpuclear)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-gpuclear --threads 4 "--tool-args=-gpuclear" "--title=rav1g-dec with -gpuclear"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -gpuclear: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }
          if (-not (Select-String -Path out/conformance-gpuclear/lists/run001.log -Pattern 'clears GPU \(-gpuclear\)' -Quiet)) {
            $failed += 'the decoder of the run with -gpuclear does not report the clears of the GPU'
          }
          python testing/conformance/memory_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check-gpuclear "--tool-args=-gpuclear" "--title=rav1g-dec (cargo, MSVC) with -gpuclear"
          if ($LASTEXITCODE -ne 0) { $failed += "memory check with -gpuclear: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "with -gpuclear: $($failed -join '; ')" }

      # The clears on the completion thread, with the wavefront in the grid: the default of the packages
      # up to 0.2.144. The whole set, and the stage dumps, which the rust-parsers-equal job holds against
      # those of the default byte for byte: the block lists of the two ways of keeping the wavefront
      # have to be the same lists.
      - name: Conformance and stage dumps with the clears on the completion thread (-cpuclear)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-cpuclear --threads 4 "--tool-args=-cpuclear" "--title=rav1g-dec with -cpuclear"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -cpuclear: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }
          if (-not (Select-String -Path out/conformance-cpuclear/lists/run001.log -Pattern 'clears completion thread \(-cpuclear\)' -Quiet)) {
            $failed += 'the decoder of the run with -cpuclear does not report the clears on the completion thread'
          }
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps-cpuclear --threads 4 "--tool-args=-cpuclear"
          if ($LASTEXITCODE -ne 0) { $failed += "stage dumps with -cpuclear: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "with -cpuclear: $($failed -join '; ')" }

      # The clears on the decode thread: the path of the first packages, the whole set once more.
      - name: Conformance with the clears on the decode thread (-syncclear)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-syncclear --threads 4 "--tool-args=-syncclear" "--title=rav1g-dec with -syncclear"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -syncclear: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }
          if (-not (Select-String -Path out/conformance-syncclear/lists/run001.log -Pattern 'clears decode thread \(-syncclear\)' -Quiet)) {
            $failed += 'the decoder of the run with -syncclear does not report the clears on the decode thread'
          }
          if ($failed.Count) { throw "with -syncclear: $($failed -join '; ')" }

      # The clears of the GPU where both grids are cleared: with the entropy decoder of libaom, whose mode
      # info grid is cleared for every frame, and with rav1d's parse made to clear it (-parseopt
      # cleargrid) on poisoned buffers, three slots and four threads. With -poisonbuf the grids start as
      # 0xA5 bytes, so an entry that neither the CPU nor the clear of the GPU has written shows in the
      # output. The part of the set of the poisoned runs.
      - name: The clears of the GPU with -parser c and with poisoned buffers
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $part = '--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)'
          $runs = @(@{ name = 'gpuclear-c'; args = '-gpuclear -parser c' },
            @{ name = 'gpuclear-poisonbuf'; args = '-gpuclear -poisonbuf -parseopt cleargrid -slots 3 -t 4' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" `
              "--title=rav1g-dec, part of the set with $($run.args)" $part
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "the clears of the GPU: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs, the md5 files and the stage dumps of the clears
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-clears-${{ github.run_id }}
          path: |
            out/clears-check/
            out/conformance-*/
            out/memory-check-gpuclear/
            out/stage-dumps-cpuclear/
          if-no-files-found: warn

  # What the jobs above wrote, held against each other; no decoder runs here. It runs also when one of
  # them failed, on what that job wrote before it did.
  rust-parsers-equal:
    needs: [rust, rust-conformance, rust-parser-c, rust-switches, rust-clears]
    if: ${{ !cancelled() && needs.rust.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-conformance-${{ github.run_id }}
          path: default

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-stage-dumps-${{ github.run_id }}
          path: default-dumps

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-parser-c-${{ github.run_id }}
          path: parser-c

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-switches-${{ github.run_id }}
          path: switches

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-clears-${{ github.run_id }}
          path: clears

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-conformance-md5-${{ github.run_id }}
          path: conformance-md5

      # The two parsers against each other: the md5 of every output frame of every stream, the buffers
      # behind every GPU stage of the frames of dump_tasks.txt (the block lists, the loop filter lists and
      # parameters, the CDEF and loop restoration lists, every frame buffer), and the MEMORY lines of a few
      # decoder configurations. The mode info records themselves are listed, not held equal: the entropy
      # decoder of libaom leaves in a field a block's kind does not have what an earlier frame had there,
      # rav1d's sink writes zero (stage_dump.py compare --two-parsers). The dumps and the MEMORY lines of
      # -parser c are also what the rust-equal job holds against the C++ decoder.
      - name: The two parsers give the same frames, stage dumps and MEMORY lines
        run: |
          set -euo pipefail
          status=0
          python3 testing/conformance/compare_md5.py --reference parser-c/conformance-c --candidate default/conformance \
            --manifest conformance-md5/manifest.txt --reference-dumps parser-c/stage-dumps-c --candidate-dumps default-dumps \
            --reference-name 'rav1g-dec -parser c' --candidate-name 'rav1g-dec (rav1d, the default)' --two-parsers || {
              echo "::error::the two parsers: md5 per frame or stage dumps differ (exit code $?)"; status=1; }
          python3 testing/conformance/memory_lines.py compare --reference parser-c/memory-lines-c --candidate default/memory-lines \
            --reference-name 'rav1g-dec -parser c' --candidate-name 'rav1g-dec (rav1d, the default)' || {
              echo "::error::the two parsers: the MEMORY lines differ (exit code $?)"; status=1; }
          exit "$status"

      # The other side of every switch of rav1d's parse (the run of the rust-switches job): the stage
      # dumps against those of the default switches byte for byte (the mode info records too: the same
      # parser wrote them), and the stage dumps and the md5 of every frame against those of -parser c.
      - name: The other side of every switch of the parser gives the same stage dumps and frames
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          switches='-parser rav1d -parseopt none,latelists,time'
          dumped=0
          for dir in default-dumps/*/; do
            name=$(basename "$dir")
            [ "$name" != streams ] || continue
            dumped=$((dumped + 1))
            code=0
            python3 testing/stage_dump/stage_dump.py compare "$dir" "switches/stage-dumps-switches-rav1d/$name" > compare.txt 2>&1 || code=$?
            tail -n 3 compare.txt
            if [ "$code" -ne 0 ]; then
              echo "::error::stage dumps of $name: the default switches and $switches differ"
              status=1
            fi
          done
          if [ "$dumped" -eq 0 ]; then
            echo '::error::no stage dumps of the default switches to hold these against'
            status=1
          fi
          python3 testing/conformance/compare_md5.py --reference parser-c/conformance-c --candidate switches/conformance-switches-rav1d \
            --manifest conformance-md5/manifest.txt --reference-dumps parser-c/stage-dumps-c \
            --candidate-dumps switches/stage-dumps-switches-rav1d \
            --reference-name 'rav1g-dec -parser c' --candidate-name "rav1g-dec $switches" --two-parsers || {
              echo "::error::-parser c against $switches: md5 per frame or stage dumps differ (exit code $?)"; status=1; }
          exit "$status"

      # The two ways of keeping the wavefront of intra prediction (the run of the rust-clears job): the
      # stage dumps of the wavefront in the slot's grid (-cpuclear) against those of the wavefront at the
      # edges of the tiles (the default) byte for byte. The lists of the prediction blocks are in them:
      # they are equal only if every transform block has the same iteration either way.
      - name: The wavefront in the grid and at the edges of the tiles give the same stage dumps
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          dumped=0
          for dir in default-dumps/*/; do
            name=$(basename "$dir")
            [ "$name" != streams ] || continue
            dumped=$((dumped + 1))
            code=0
            python3 testing/stage_dump/stage_dump.py compare "$dir" "clears/stage-dumps-cpuclear/$name" > compare.txt 2>&1 || code=$?
            tail -n 3 compare.txt
            if [ "$code" -ne 0 ]; then
              echo "::error::stage dumps of $name: the default and -cpuclear differ"
              status=1
            fi
          done
          if [ "$dumped" -eq 0 ]; then
            echo '::error::no stage dumps of the default to hold these against'
            status=1
          fi
          exit "$status"

  # The experiments (docs/test-player.md, "Experiments"), only when the workflow is started by hand with
  # the experiments input: the whole set with each experiment flag, with the poisoned buffers, and with
  # the program the rust job builds with the shaders of the uavsync package.
  rust-experiments:
    needs: [conformance-streams, rust]
    if: ${{ inputs.experiments }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: rav1g-dec.exe with the shaders of the uavsync package, of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-uavsync-x64-${{ github.run_id }}
          path: out/rav1g-dec-uavsync

      # The experiments (docs/test-player.md, "Experiments"): on a device that follows D3D each of them
      # leaves the output as it is, so the whole set is decoded again with each flag and has to give the
      # results of expected.txt, and once more with a decoder whose shaders are those of the uavsync
      # package. They answered their question (none changed the console's output), so they run only
      # when the workflow is started by hand with the experiments input.
      - name: Conformance with each experiment flag
        shell: pwsh
        run: |
          $runs = @(@{ name = 'lfhsplit1'; args = '-lfhsplit 1' }, @{ name = 'lfhsplit2'; args = '-lfhsplit 2' },
            @{ name = 'intraedgefix'; args = '-intraedgefix' },
            # Not experiments for a device: the whole set with the mode info pool poisoned, and with every
            # buffer and the constants poisoned, also on the fast inter path and with the second intra
            # scheduler (the rust-switches job decodes a part of the set with -poisonmi and -poisonbuf on every push).
            @{ name = 'poisonmi-all'; args = '-poisonmi' },
            @{ name = 'poisonbuf-all'; args = '-poisonbuf' },
            @{ name = 'poisonbuf-interfast'; args = '-poisonbuf -interfast' },
            @{ name = 'poisonbuf-intrav2'; args = '-poisonbuf -intrav2' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" "--title=rav1g-dec with $($run.args)"
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "conformance with an experiment flag: $($failed -join '; ')" }

      - name: Conformance with the uavsync shaders
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec-uavsync/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-uavsync --threads 4 "--title=rav1g-dec, uavsync shaders (all-memory group syncs)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance-uavsync/lists/run001.log -Pattern '^SHADERS uavsync' -Quiet)) {
            throw 'The decoder of this run does not report the uavsync shaders'
          }
          if ($code -ne 0) { throw "conformance with the uavsync shaders: exit code $code" }

      - name: Preserve the results, the per-stream logs and md5 files of the experiments
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-experiments-${{ github.run_id }}
          path: out/conformance-*/
          if-no-files-found: warn

  # Not on a push: once a week (schedule) and when the workflow is started by hand with the parser_timing
  # input (gh workflow run build.yml -f parser_timing=true). The console makes the speed decisions, and
  # the C parser leaves in the last step of phase 2, so a push does not wait 17 minutes for these numbers.
  parser-timing:
    needs: [conformance-streams, rust]
    if: ${{ github.event_name == 'schedule' || inputs.parser_timing }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The two parsers timed in pairs on this runner (testing/conformance/parser_timing.py): the CPU
      # timers of the decode thread with -parser c, with -parser rav1d (its default switches) and with
      # rav1d and other switches, in turns, three rounds each; the two 2160p streams first, the heavy
      # 10-bit one in front. One parser thread for the streams with one tile, with the block lists at the
      # end of a tile (latelists: the way of before, against the default) and with the calls of the sink
      # timed; four for the stream with eight tiles; and the 2160p streams once more with four threads,
      # the 8-bit one with each switch by itself (one tile: what further threads cost a parse that
      # cannot use them). The numbers of a runner say how the decoders compare on it; the console's
      # numbers decide.
      - name: The two parsers, timed in pairs
        shell: pwsh
        run: |
          python testing/conformance/parser_timing.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/parser-timing --rounds 3 --threads 1 --switches latelists --switches time `
            --stream nf-dvbdash-d2-10b-2160p.ivf --stream nf-dvbdash-a1-8b-2160p.ivf `
            --stream nf-chimera-10b-1080p.ivf --stream nf-sparks-10b-1080p.ivf
          if ($LASTEXITCODE -ne 0) { throw "paired timing of the parsers: exit code $LASTEXITCODE" }
          python testing/conformance/parser_timing.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/parser-timing-t4 --rounds 3 --threads 4 --switches latelists --switches none `
            --stream syn-tiles-10b-1080p.ivf
          if ($LASTEXITCODE -ne 0) { throw "paired timing of the parsers with four threads: exit code $LASTEXITCODE" }
          python testing/conformance/parser_timing.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/parser-timing-d2-t4 --rounds 2 --threads 4 --switches latelists --switches none `
            --stream nf-dvbdash-d2-10b-2160p.ivf
          if ($LASTEXITCODE -ne 0) { throw "paired timing of the parsers, the 10-bit 2160p stream with four threads: exit code $LASTEXITCODE" }
          python testing/conformance/parser_timing.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/parser-timing-switches --rounds 3 --threads 4 --stream nf-dvbdash-a1-8b-2160p.ivf `
            --switches none --switches nolfmask --switches tilethread --switches latelists --switches time
          if ($LASTEXITCODE -ne 0) { throw "paired timing of the switches of the parser: exit code $LASTEXITCODE" }

      - name: Preserve the timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-parser-timing-${{ github.run_id }}
          path: out/parser-timing*/
          if-no-files-found: warn

  # Equality with the C++ decoder (docs/rust-port.md, "Equality reference"): rav1g-dec of this commit and
  # warp_decoder of branch cpp at CPP_REFERENCE_COMMIT must write the same md5 for every output frame of
  # every stream of the set, the same buffers behind every GPU stage of the dumped frames, and the same
  # MEMORY lines. Two implementations of the host can only be held against each other while they run the
  # same shaders, so that is checked first: when a shader of this branch changes and the pinned commit
  # does not have the change, this job fails there, and the comparison either gets a new pin (the change
  # was made on both branches) or ends (the shaders of the branches diverge: the switch to DXC, phase 2).
  rust-equal:
    needs: [cpp-reference, rust-parser-c, shader-headers]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-cpp-reference-${{ github.run_id }}
          path: cpp-reference

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-parser-c-${{ github.run_id }}
          path: rav1g-dec

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-cpp-reference-stage-dumps-${{ github.run_id }}
          path: cpp-reference-dumps

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-conformance-md5-${{ github.run_id }}
          path: conformance-md5

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-shader-headers-${{ github.run_id }}
          path: shader-headers

      - name: The shaders of this commit are those of the reference
        run: |
          set -euo pipefail
          {
            echo '## Equality with the C++ decoder'
            echo
            echo "Reference: warp_decoder of branch cpp at \`$CPP_REFERENCE_COMMIT\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if ! python3 testing/shader_cache/shaders.py same --reference cpp-reference/shaders/report.json \
              --candidate shader-headers/report.json --reference-name "branch cpp at ${CPP_REFERENCE_COMMIT:0:7}" \
              --candidate-name 'this commit'; then
            echo '::error title=The shaders differ from those of the equality reference::The C++ decoder of the pinned commit of branch cpp does not have the shaders of this commit, so its output cannot be held against. If the change is on branch cpp as well, set CPP_REFERENCE_COMMIT to that commit; if the shaders of the branches diverge from here on, the comparison ends (docs/rust-port.md, "Equality reference").'
            exit 1
          fi

      # The C++ decoder reads a stream with the entropy decoder of libaom, so what is held against it is
      # rav1g-dec with -parser c (the run, the dumps and the MEMORY lines of the rust-parser-c job):
      # the same parser on both sides, and the mode info records byte for byte. The parse pass of rav1d,
      # which rav1g-dec uses without the flag, is held against -parser c in the rust-parsers-equal job.
      - name: md5 per frame and stage dumps, rav1g-dec -parser c against the C++ decoder
        run: |
          set -euo pipefail
          python3 testing/conformance/compare_md5.py --reference cpp-reference/conformance --candidate rav1g-dec/conformance-c \
            --manifest conformance-md5/manifest.txt --reference-dumps cpp-reference-dumps --candidate-dumps rav1g-dec/stage-dumps-c \
            --reference-name 'warp_decoder (cpp)' --candidate-name 'rav1g-dec -parser c'

      # The decoder creation, the buffer plan and the release: the same buffers of the same sizes, and the
      # same text about them.
      - name: MEMORY log lines, rav1g-dec -parser c against the C++ decoder
        run: |
          python3 testing/conformance/memory_lines.py compare --reference cpp-reference/memory-lines \
            --candidate rav1g-dec/memory-lines-c --reference-name 'warp_decoder (cpp)' --candidate-name 'rav1g-dec -parser c'

  # The shader headers of the normal build for the Linux build below, which has no FXC: the headers and
  # the report of the Shaders step, as an artifact.
  shader-headers:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shaders
        id: shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Preserve the shader headers of the normal build
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-shader-headers-${{ github.run_id }}
          path: |
            shader-build/normal/dx/shaders/h/
            shader-build/normal/report.json
          if-no-files-found: error

  # Linux-native build (docs/rust-port.md, "Requirements"): the workspace for x86_64-pc-windows-msvc on a
  # Linux runner with cargo xwin, which is clang-cl and lld-link with the Windows SDK and C runtime that xwin
  # fetches; no wine, no MSVC. The C of the parser and entropy decoder, and the C++ of the test player that
  # rav1g-dec has for -playersmoke, are compiled by cc the same way. The shaders are the FXC headers of the
  # shader-headers job.
  rust-cross:
    needs: shader-headers
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CARGO_XWIN_VERSION: 0.23.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-shader-headers-${{ github.run_id }}
          path: shader-headers

      # clang-cl, lld-link, llvm-lib and libclang (bindgen). The C++ standard library of the MSVC runtime
      # that xwin fetches (the stream readers and the player's code are C++) wants Clang 19 or newer.
      - name: Rust toolchain, LLVM and cargo-xwin
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          sudo apt-get update -qq
          # nasm, for the assembly of rav1d's parse pass (third_party/rav1d).
          sudo apt-get install -y -qq --no-install-recommends nasm
          nasm -v
          llvm=
          for version in 21 20 19; do
            if sudo apt-get install -y -qq --no-install-recommends clang-$version lld-$version llvm-$version libclang-$version-dev; then
              llvm=$version
              break
            fi
          done
          if [ -z "$llvm" ]; then
            # The distribution has none: the packages of apt.llvm.org.
            llvm=20
            curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
            sudo bash llvm.sh $llvm
            rm llvm.sh
            sudo apt-get install -y -qq --no-install-recommends clang-$llvm lld-$llvm llvm-$llvm libclang-$llvm-dev
          fi
          echo "/usr/lib/llvm-$llvm/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$llvm/lib" >> "$GITHUB_ENV"
          pipx install "cargo-xwin==$CARGO_XWIN_VERSION"
          rustc --version
          "/usr/lib/llvm-$llvm/bin/clang-cl" --version | head -n 1
          "/usr/lib/llvm-$llvm/bin/lld-link" --version | head -n 1

      # The Windows SDK and the MSVC C runtime (headers and import libraries), about 1.2 GB unpacked.
      - name: xwin cache (Windows SDK and C runtime)
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ env.CARGO_XWIN_VERSION }}-v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: xwin

      - name: Build the workspace for x86_64-pc-windows-msvc (cargo xwin, release)
        env:
          RAV1G_SHADER_DIR: ${{ github.workspace }}/shader-headers
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo xwin build --release --locked --target x86_64-pc-windows-msvc
          exe=target/x86_64-pc-windows-msvc/release/rav1g-dec.exe
          test -f "$exe"
          # Built from the headers of this run: their bytecode is in the program, byte for byte.
          python3 testing/shader_cache/shaders.py verify --report shader-headers/report.json --root shader-headers "$exe"
          mkdir -p out/rav1g-dec-xwin
          cp "$exe" target/x86_64-pc-windows-msvc/release/rav1g_dec.pdb out/rav1g-dec-xwin/
          # The notices of the crates the library links are those of Cargo.lock.
          python3 third_party/rust-crates/collect.py --check
          for license in LICENSE.txt libav1/LICENSE libav1/PATENTS third_party/libwebm/LICENSE.TXT third_party/libwebm/PATENTS.TXT \
              third_party/rav1d/COPYING third_party/rav1d/doc/PATENTS third_party/rust-crates/NOTICES.txt; do
            mkdir -p "out/rav1g-dec-xwin/licenses/$(dirname "$license")"
            cp "$license" "out/rav1g-dec-xwin/licenses/$license"
          done
          {
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Build: cargo xwin build --release --target x86_64-pc-windows-msvc on Linux, $(rustc --version), $(clang-cl --version | head -n 1)"
          } > out/rav1g-dec-xwin/SOURCES.txt
          {
            echo '## rav1g-dec, built on Linux'
            echo
            echo "cargo xwin build --release: $(( $(date +%s) - start )) s ($(clang-cl --version | head -n 1)); $(stat -c %s "$exe") bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      # rav1g.h, the interface for C, is written from crates/rav1g/src/capi.rs by cbindgen
      # (tools/rav1g-header) and kept in the tree: the file there has to be what the source gives.
      - name: rav1g.h is what crates/rav1g/src/capi.rs gives
        run: cargo run --release --locked -p rav1g-header -- --check

      # The library as an application in an app container links it (docs/rust-port.md, "The app
      # container"): the static library with the interface for C, the C compiled for the app family of the
      # Windows API, both for the DLL runtime. It is linked here into a DLL that has every function of
      # rav1g.h, WindowsApp.lib first, and the DLLs that program imports from are held against the list
      # of the test player (testing/uwp_imports): no kernel32.dll, and of ntdll.dll two functions. The
      # player job does the same with the programs of its packages.
      - name: Library for an app container application, and the DLLs it imports from
        env:
          RAV1G_SHADER_DIR: ${{ github.workspace }}/shader-headers
        run: |
          set -euo pipefail
          separator=$(printf '\037')
          CARGO_ENCODED_RUSTFLAGS="-Ctarget-feature=-crt-static${separator}--cfg${separator}windows_slim_errors" \
            RAV1G_C_LIB_DIR="$PWD/out/app-container" \
            cargo xwin build --release --locked -p rav1g --lib --features capi,app-container \
            --target x86_64-pc-windows-msvc --target-dir target/app-container
          cp target/app-container/x86_64-pc-windows-msvc/release/rav1g.lib out/app-container/
          sh testing/uwp_imports/link_probe.sh out/app-container/rav1g.lib out/app-container \
            "$HOME/.cache/cargo-xwin/xwin" out/app-container-probe
          pipx install uv
          uv run --with pefile==2024.8.26 python testing/uwp_imports/check_imports.py \
            --allow testing/uwp_imports/player-dlls-allow.txt --also vcruntime140.dll \
            --report out/app-container-probe/imports.tsv out/app-container-probe/probe.dll | tee out/app-container-probe/check.txt
          {
            echo '## Library for an app container application (Linux build)'
            echo
            echo '```'
            cat out/app-container-probe/check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the imports of the app container probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-app-container-probe-${{ github.run_id }}
          path: |
            out/app-container-probe/imports.tsv
            out/app-container-probe/check.txt
          if-no-files-found: warn

      - name: Preserve rav1g-dec.exe of the Linux build
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-x64-xwin-${{ github.run_id }}
          path: out/rav1g-dec-xwin/
          if-no-files-found: error

  # The program of the Linux build is a Windows program like the other: it decodes the conformance set on
  # WARP against the same references and expected.txt, and runs the decoder code of the test player, which
  # in this program is compiled by clang-cl, as the C of the default package of the player is. The checks
  # of the rust-conformance and rust-switches jobs that do not depend on a second run of the set follow
  # with it, in two jobs side by side: this one has the parser of the default, rust-cross-run-parsers the
  # other parser and the other side of the switches of the parser.
  rust-cross-run:
    needs: [rust-cross, conformance-streams]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-xwin-${{ github.run_id }}
          path: rav1g-dec-xwin

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # As in the rust-conformance job: a task that names no parser is a task of the parse pass of rav1d with its
      # default switches, and the run has to say so.
      - name: Decode every stream on WARP with the rav1g-dec of the Linux build
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance --threads 4 "--title=rav1g-dec built on Linux (cargo xwin, clang-cl)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance/lists/run001.log -Pattern '^PARSER .*the parse pass of rav1d.*switches nolfmask,tilethread \(' -Quiet)) {
            throw 'The decoder of this run does not report the parse pass of rav1d with its default switches'
          }
          if ($code -ne 0) { throw "conformance run with the rav1g-dec of the Linux build: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # As in the rust-conformance job: the parser of phase 2 in the program of the Linux build.
      - name: Parse digest of every stream, rav1d's parse pass in the rav1g-dec of the Linux build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/parse-digest | Out-Null
          $tool = Resolve-Path rav1g-dec-xwin/rav1g-dec.exe
          Push-Location conformance-streams
          & $tool -parsedigest -t 4 -list manifest.txt > ../out/parse-digest/digest.txt
          $code = $LASTEXITCODE
          Pop-Location
          $lines = @(Select-String -Path out/parse-digest/digest.txt -Pattern '^PARSEDIGEST ').Count
          "## Parse digest, rav1g-dec built on Linux (cargo xwin, clang-cl)", '', "$lines streams, exit code $code." >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { Get-Content out/parse-digest/digest.txt | Select-Object -Last 20; throw "rav1g-dec -parsedigest: exit code $code" }

      - name: Preserve the parse digests of the Linux build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-parse-digest-xwin-${{ github.run_id }}
          path: out/parse-digest/
          if-no-files-found: warn

      - name: The test player's decoder code through rav1g.h on the Rust library of the Linux build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/player_smoke.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke "--title=the Rust library built on Linux (cargo xwin, clang-cl)"
          if ($LASTEXITCODE -ne 0) { throw "the player's decoder code on the Rust library of the Linux build: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      # The other checks of the rust-conformance and rust-switches jobs with this program (the comments are there): decode errors in cut
      # streams through the Rust interface and with the player's decoder code, the order check, the memory
      # check, the part of the set with -poisonmi and with -poisonbuf, and the whole set with -interfast
      # and with -gpuclear (the clears of a slot by the GPU, with the wavefront in the slot's grid; the
      # rust-clears job has the other ways).
      - name: Decode error in a cut stream, the rav1g-dec of the Linux build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/cut_tile_check.py --tool rav1g-dec-xwin/rav1g-dec.exe `
            --player-smoke rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { throw "decode error check with the rav1g-dec of the Linux build: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      - name: Order check with the rav1g-dec of the Linux build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/order_check.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/order-check "--title=rav1g-dec built on Linux (cargo xwin, clang-cl)"
          if ($LASTEXITCODE -ne 0) { throw "order check with the rav1g-dec of the Linux build: exit code $LASTEXITCODE (1: a stream is wrong behind other streams, 2: the check could not be done)" }

      - name: Memory check with the rav1g-dec of the Linux build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/memory_check.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check "--title=rav1g-dec built on Linux (cargo xwin, clang-cl)"
          if ($LASTEXITCODE -ne 0) { throw "memory check with the rav1g-dec of the Linux build: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      - name: Conformance with -poisonmi, with -poisonbuf, with -interfast and with -gpuclear, the rav1g-dec of the Linux build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $part = '--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)'
          $runs = @(@{ name = 'poisonmi'; args = '-poisonmi'; only = $part }, @{ name = 'poisonbuf'; args = '-poisonbuf'; only = $part },
            @{ name = 'interfast'; args = '-interfast'; only = '--only=' }, @{ name = 'gpuclear'; args = '-gpuclear'; only = '--only=' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" `
              "--title=rav1g-dec built on Linux, with $($run.args)" $run.only
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "conformance with the rav1g-dec of the Linux build: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs and md5 files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-xwin-conformance-${{ github.run_id }}
          path: |
            out/conformance/
            out/conformance-*/
            out/player-smoke/
            out/cut-tile/
            out/order-check/
            out/memory-check/
          if-no-files-found: warn

  # The second half of the checks with the program of the Linux build: the other parser, and the other
  # side of every switch of rav1d's parse.
  rust-cross-run-parsers:
    needs: [rust-cross, conformance-streams]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the Linux build
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-xwin-${{ github.run_id }}
          path: rav1g-dec-xwin

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The entropy decoder of libaom, the other parser of the decoder until the last step of phase 2
      # (docs/phase2-rav1d.md): the checks of the rust-cross-run job once more with -parser c. The whole set against its
      # references and expected.txt, the decode errors in cut streams (with the words and the error
      # behaviour of that parser), the order check, the memory check, the part of the set with -poisonmi
      # and with -poisonbuf, the whole set with -interfast, and the decoder code of the test player with
      # its -parser flag.
      - name: Decode every stream on WARP with -parser c, the rav1g-dec of the Linux build
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-c --threads 4 "--tool-args=-parser c" "--title=rav1g-dec built on Linux with -parser c"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance-c/lists/run001.log -Pattern '^PARSER .*the entropy decoder of libaom' -Quiet)) {
            throw 'The decoder of this run does not report the entropy decoder of libaom'
          }
          if ($code -ne 0) { throw "conformance run with -parser c: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      - name: The other checks with -parser c, the rav1g-dec of the Linux build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          $part = '--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)'
          $runs = @(@{ name = 'poisonmi-c'; args = '-poisonmi -parser c'; only = $part },
            @{ name = 'poisonbuf-c'; args = '-poisonbuf -parser c'; only = $part },
            @{ name = 'interfast-c'; args = '-interfast -parser c'; only = '--only=' })
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" `
              "--title=rav1g-dec built on Linux with $($run.args)" $run.only
            if ($LASTEXITCODE -ne 0) { $failed += "conformance with $($run.args): exit code $LASTEXITCODE" }
          }
          python testing/conformance/cut_tile_check.py --tool rav1g-dec-xwin/rav1g-dec.exe --parser c `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { $failed += "decode error check: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --player-smoke rav1g-dec-xwin/rav1g-dec.exe --parser c `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { $failed += "decode error check with the player's decoder code: exit code $LASTEXITCODE" }
          python testing/conformance/order_check.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/order-check-c "--tool-args=-parser c" "--title=rav1g-dec built on Linux with -parser c"
          if ($LASTEXITCODE -ne 0) { $failed += "order check: exit code $LASTEXITCODE" }
          python testing/conformance/memory_check.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check-c "--tool-args=-parser c" "--title=rav1g-dec built on Linux with -parser c"
          if ($LASTEXITCODE -ne 0) { $failed += "memory check: exit code $LASTEXITCODE" }
          python testing/conformance/player_smoke.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-c "--player-args=-parser c" "--title=the Rust library built on Linux, the player with -parser c"
          if ($LASTEXITCODE -ne 0) { $failed += "the player's decoder code: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "with -parser c: $($failed -join '; ')" }

      # The other side of every switch of rav1d's parse (docs/phase2-rav1d.md "Where the time goes"):
      # without its two default switches, the block lists at the end of a tile, the calls of the sink
      # timed. The whole set, and the decoder code of the test player.
      - name: The same with the other side of every switch of the parser, the rav1g-dec of the Linux build
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          $switches = '-parser rav1d -parseopt none,latelists,time'
          python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-switches-rav1d --threads 4 "--tool-args=$switches" "--title=rav1g-dec built on Linux with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with ${switches}: exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out/conformance-switches-rav1d/lists/run001.log -Pattern '^PARSER .*switches none,time,latelists \(' -Quiet)) {
            $failed += 'the decoder of the run does not report the switches of the parser'
          }
          python testing/conformance/player_smoke.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-switches-rav1d "--player-args=$switches" "--title=the Rust library built on Linux, the player with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "the player's decoder code with ${switches}: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "the switches of the parser: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs and md5 files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-xwin-parsers-${{ github.run_id }}
          path: |
            out/conformance-*/
            out/player-smoke-*/
            out/cut-tile/
            out/*-rav1d/
            out/*-c/
          if-no-files-found: warn

  # Phase 2, step 1 (docs/phase2-rav1d.md): rav1d as it is upstream, at the commit the copy in
  # third_party/rav1d starts from, decodes every stream of the conformance set to its reference md5
  # (testing/rav1d_md5 builds upstream's crate from its repository); and the copy is that commit with the
  # changes third_party/rav1d/PATCHES.md lists and nothing else (upstream_diff.sh).
  rav1d:
    needs: conformance-streams
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Rust toolchain and nasm
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nasm
          rustc --version
          nasm -v

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: testing/rav1d_md5
          key: rav1d

      - name: The copy in third_party/rav1d is upstream at the commit of UPSTREAM with the listed changes
        run: |
          set -euo pipefail
          mkdir -p out/rav1d
          repository=$(awk '$1 == "repository" { print $2 }' third_party/rav1d/UPSTREAM)
          commit=$(awk '$1 == "commit" { print $2 }' third_party/rav1d/UPSTREAM)
          # The md5 tool below builds the same commit.
          grep -q "rev = \"$commit\"" testing/rav1d_md5/Cargo.toml
          git clone -q --filter=blob:none "$repository" upstream-rav1d
          git -C upstream-rav1d checkout -q "$commit"
          sh third_party/rav1d/upstream_diff.sh upstream-rav1d out/rav1d/upstream.diff | tee out/rav1d/upstream.txt
          {
            echo '## rav1d: the copy against upstream'
            echo
            echo '```'
            cat out/rav1d/upstream.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upstream rav1d decodes every stream to its reference md5
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path testing/rav1d_md5/Cargo.toml
          status=0
          testing/rav1d_md5/target/release/rav1d-md5 --root conformance-streams \
            --manifest conformance-streams/manifest.txt > out/rav1d/md5.txt || status=$?
          {
            echo '## rav1d as it is upstream on the conformance streams'
            echo
            echo '```'
            tail -n 1 out/rav1d/md5.txt
            grep ' FAIL ' out/rav1d/md5.txt | head -n 20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 out/rav1d/md5.txt
          exit "$status"

      - name: Preserve the diff against upstream and the md5 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-rav1d-${{ github.run_id }}
          path: out/rav1d/
          if-no-files-found: warn

  # Phase 2, step 2 (docs/phase2-rav1d.md): the parser of phase 2 against the entropy decoder of libaom.
  # tools/rav1g-parse-check runs both on every stream of the conformance set, each into plain memory in
  # the layouts the GPU stages read, and holds every frame of one against the other's: the mode info
  # records field by field, the grid, the transform block records, the coefficients, the block lists (which
  # the D3D12 host's own function counts for both), the palette blocks and the loop restoration units. No
  # GPU. The same program prints the parse digest of every stream for the parse-digest job, and times the
  # sink on the 4K stream of the set.
  parse-check:
    needs: conformance-streams
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # libclang for bindgen (the bindings of the entropy decoder), nasm for rav1d's assembly. One version
      # of LLVM, as in the rust-cross job: bindgen has to load the libclang whose headers clang gives it
      # (with the libclang of another version the intrinsics headers do not parse).
      - name: Rust toolchain, libclang and nasm
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nasm
          llvm=
          for version in 21 20 19; do
            if sudo apt-get install -y -qq --no-install-recommends clang-$version libclang-$version-dev; then
              llvm=$version
              break
            fi
          done
          [ -n "$llvm" ] || { echo 'no clang with its libclang in the distribution'; exit 1; }
          echo "/usr/lib/llvm-$llvm/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$llvm/lib" >> "$GITHUB_ENV"
          rustc --version
          nasm -v
          "/usr/lib/llvm-$llvm/bin/clang" --version | head -n 1

      - uses: Swatinem/rust-cache@v2
        with:
          key: parse-check

      - name: Build rav1g-parse-check
        run: cargo build --release --locked -p rav1g-parse-check

      - name: Every frame of every stream, rav1d's parse pass and the sink against the entropy decoder of libaom
        run: |
          set -euo pipefail
          mkdir -p out/parse-check
          status=0
          target/release/rav1g-parse-check -root conformance-streams -manifest conformance-streams/manifest.txt \
            > out/parse-check/check.txt || status=$?
          {
            echo '## Parse check: rav1d and the sink against the entropy decoder of libaom'
            echo
            echo '```'
            grep '^PARSE SUMMARY\|^PARSE COVERAGE' out/parse-check/check.txt || true
            grep -A 6 ' DIFFERENT \| ERROR ' out/parse-check/check.txt | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^PARSE SUMMARY\|^PARSE COVERAGE' out/parse-check/check.txt || true
          exit "$status"

      # The same with four threads in rav1d: the tiles of a frame are then parsed side by side.
      - name: The same with four parser threads
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          target/release/rav1g-parse-check -threads 4 -root conformance-streams \
            -manifest conformance-streams/manifest.txt > out/parse-check/check-threads4.txt || status=$?
          {
            echo '## Parse check with four parser threads'
            echo
            echo '```'
            grep '^PARSE SUMMARY' out/parse-check/check-threads4.txt || true
            grep -A 6 ' DIFFERENT \| ERROR ' out/parse-check/check-threads4.txt | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^PARSE SUMMARY' out/parse-check/check-threads4.txt || true
          exit "$status"

      # The switches of the parser (-parseopt, docs/phase2-rav1d.md "Where the time goes"): the two runs
      # above have the two that are on by default (nolfmask, tilethread) and the block lists counted
      # superblock by superblock; the buffers are the same with the two off and the lists counted at the
      # end of a tile, with one thread and with four.
      - name: The same with the other side of every switch of the parser
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          {
            echo '## Parse check with the other side of every switch of the parser (-parseopt none,latelists)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for threads in 1 4; do
            target/release/rav1g-parse-check -threads "$threads" -parseopt none,latelists -root conformance-streams \
              -manifest conformance-streams/manifest.txt > "out/parse-check/check-switches-threads$threads.txt" \
              || status=$?
            {
              grep '^PARSE SUMMARY' "out/parse-check/check-switches-threads$threads.txt" || true
              grep -A 6 ' DIFFERENT \| ERROR ' "out/parse-check/check-switches-threads$threads.txt" | head -n 60 || true
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The wavefront of intra prediction (docs/phase2-rav1d.md, "No clears by the CPU"): the runs above
      # keep it at the edges of the tiles, as the decoder does without a flag. Here the entropy decoder of
      # libaom keeps it in the wavefront grid, which is cleared for every frame, and rav1d at the edges
      # (-wave check): the block lists are equal only if every transform block of every stream gets the
      # same iteration either way, and every entry of the grid that the edges' side writes (the ones the
      # shader reads) has to be the grid's. The edges start as a pattern no iteration has, so an entry
      # that is read without having been written in its frame shows in the lists. With one thread and
      # with four, and once with the wavefront in the grid on both sides (the way of -gpuclear, -cpuclear
      # and -syncclear).
      - name: The wavefront in the grid and at the edges of the tiles gives the same block lists
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          {
            echo '## Parse check of the two ways of keeping the wavefront (-wave check, -wave grid)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for run in 'check 1' 'check 4' 'grid 1'; do
            set -- $run
            target/release/rav1g-parse-check -wave "$1" -threads "$2" -root conformance-streams \
              -manifest conformance-streams/manifest.txt > "out/parse-check/check-wave-$1-threads$2.txt" || status=$?
            {
              grep '^PARSE SUMMARY' "out/parse-check/check-wave-$1-threads$2.txt" || true
              grep -A 6 ' DIFFERENT \| ERROR ' "out/parse-check/check-wave-$1-threads$2.txt" | head -n 60 || true
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Parse digest of every stream on Linux
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          target/release/rav1g-parse-check -digest -root conformance-streams \
            -manifest conformance-streams/manifest.txt > out/parse-check/digest.txt
          grep -c '^PARSEDIGEST ' out/parse-check/digest.txt

      # What the sink costs on the CPU of this runner, and what the switches of the parser change: the two
      # 4K streams and a 1080p stream of the set, with one thread and with four (one tile each, so the
      # three further threads have nothing to parse). "time" is the default with the calls of the sink
      # timed, "latelists,time" the same with the block lists at the end of a tile. Behind them the
      # default switches with the wavefront of intra prediction in its grid (-wave grid) and at the edges
      # of the tiles (the default), for the block lists of the two. A measurement for
      # docs/phase2-rav1d.md, not a gate.
      - name: CPU time of the parse and of the sink
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            echo '## CPU time of the parse and of the sink (this runner)'
            echo
            echo '```'
            for stream in cut/nf-dvbdash-d2-10b-2160p.ivf cut/nf-dvbdash-a1-8b-2160p.ivf cut/nf-chimera-10b-1080p.ivf; do
              for threads in 1 4; do
                for switches in none nolfmask tilethread time latelists,time time latelists,time; do
                  target/release/rav1g-parse-check -time -threads "$threads" -parseopt "$switches" \
                    "conformance-streams/$stream" || true
                done
                for wave in grid edges grid edges; do
                  echo "wavefront: $wave"
                  target/release/rav1g-parse-check -time -threads "$threads" -wave "$wave" \
                    "conformance-streams/$stream" || true
                done
              done
            done
            echo '```'
          } | tee out/parse-check/time.txt >> "$GITHUB_STEP_SUMMARY"
          cat out/parse-check/time.txt

      - name: Preserve the results of the parse check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-parse-check-${{ github.run_id }}
          path: out/parse-check/
          if-no-files-found: warn

  # The parser of phase 2 reads the same from every stream in every build: the parse digests of the MSVC
  # build and of the Linux cross build (rav1g-dec -parsedigest on Windows, four threads) against those of
  # the Linux build of the parse-check job (one thread), whose values are checked there.
  parse-digest:
    needs: [parse-check, rust-conformance, rust-cross-run]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rav1g-parse-check-${{ github.run_id }}
          path: linux

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-parse-digest-msvc-${{ github.run_id }}
          path: msvc

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-parse-digest-xwin-${{ github.run_id }}
          path: xwin

      - name: The parse digests of the three builds are the same
        run: |
          set -euo pipefail
          grep '^PARSEDIGEST ' linux/digest.txt | tr -d '\r' > linux.txt
          streams=$(grep -c . linux.txt)
          status=0
          for build in msvc xwin; do
            grep -a '^PARSEDIGEST ' "$build/digest.txt" | tr -d '\r' > "$build.txt"
            if cmp -s linux.txt "$build.txt"; then
              echo "PASS $build: $streams streams, the same lines as the Linux build"
            else
              echo "FAIL $build: the lines differ from the Linux build"
              diff linux.txt "$build.txt" | head -n 20 || true
              status=1
            fi
          done | tee result.txt
          grep -q '^FAIL' result.txt && status=1
          [ "$streams" -gt 0 ] || { echo 'FAIL: no digest lines of the Linux build'; status=1; }
          {
            echo '## Parse digests: MSVC build and Linux cross build against the Linux build'
            echo
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # What the decoder reports about the colour of a stream (docs/color.md): the colour description of the
  # sequence header and the HDR metadata OBUs, which it passes to the application with the stream info
  # and with every frame. rav1g-dec prints it per stream ("COLOUR" lines), and the lines of three runs of
  # the whole set in the rust-conformance and rust-parser-c jobs (rav1d's parser through the Rust interface
  # and through rav1g.h, and -parser c) are held against two references that are not the decoder: FFmpeg's trace_headers for the
  # syntax elements of the sequence header, ffprobe with libdav1d for the properties and the side data
  # of every output frame. The streams that carry something (BT.709; BT.2020 with HLG; HDR10 with a
  # mastering display and light levels) are named in the script with what they carry.
  colour:
    needs: [conformance-streams, rust-conformance, rust-parser-c]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-conformance-${{ github.run_id }}
          path: rav1g-dec

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-parser-c-${{ github.run_id }}
          path: rav1g-dec-c

      - name: ffmpeg and ffprobe with libdav1d
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffprobe -hide_banner -version | head -n 1
          ffprobe -hide_banner -decoders 2>/dev/null | grep libdav1d

      - name: Colour description and HDR metadata of every stream, rav1g-dec against trace_headers and ffprobe
        run: |
          set -euo pipefail
          python3 testing/conformance/colour_check.py --streams conformance-streams --out out/colour \
            --logs "rav1d's parser=rav1g-dec/conformance/logs" \
            --logs "rav1g.h (-capi)=rav1g-dec/conformance-capi/logs" \
            --logs "the C parser (-parser c)=rav1g-dec-c/conformance-c/logs"

      - name: Preserve what the references say
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-colour-${{ github.run_id }}
          path: out/colour/
          if-no-files-found: warn

  # Host check of how the shaders hand data between the threads of a thread group. A GPU promises
  # only that all threads of a group meet at a group sync; upstream's shaders counted on the 64
  # threads of a group running in lockstep (one wave), which holds on the console and nowhere else.
  # Every shader with group memory, compiled as C++, runs with its thread groups under an adversarial
  # schedule and its group memory watched for races; a plain GroupMemoryBarrier() is rejected; and
  # for every group sync a copy of the shader with that sync turned into a plain barrier must be
  # rejected for a race. (The CDEF, intra and warp checks below run their shaders the same way.)
  sync-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Group memory races, group syncs and plain barriers of all shaders
        run: |
          set -euo pipefail
          sh testing/sync_check/run.sh --mutate | tee sync-check.log
          { echo '## Thread group check'; echo '```'; cat sync-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host proof for CDEF v2: the original and the v2 CDEF shader source, compiled as C++,
  # must write byte-identical frames (random and edge-case input, 8-bit and high bit depth).
  cdef-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare cdef_filter_v2.hlsl with cdef_filter.hlsl
        run: |
          set -euo pipefail
          sh testing/cdef_check/run.sh --mutate | tee cdef-check.log
          { echo '## CDEF bit-exactness check'; echo '```'; tail -n 4 cdef-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the warp prediction shaders (local warp, global motion, GLOBAL_GLOBALMV) against
  # libaom's C code of this tree: the shaders, compiled as C++, and libaom must write byte-identical
  # frames, with and without working double precision in the shaders, also for frames whose reference 0
  # has another size than the frame (reference scaling, spatial layers), and the mutated copies of the
  # shaders must fail, among them the shaders that took the size of reference 0 for every reference.
  warp-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the warp shaders with libaom
        run: |
          set -euo pipefail
          sh testing/warp_check/run.sh --mutate | tee warp-check.log
          { echo '## Warp check'; echo '```'; tail -n 15 warp-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the fast inter prediction shaders (inter_fast.hlsl, inter_compound_fast.hlsl and their
  # _hbd builds; test flag -interfast) against the original shaders and against libaom's C code of this
  # tree: the shaders, compiled as C++, predict generated frames from lists by motion vector class as
  # gen_pred_blocks_fast.hlsl makes them, and the frame must be what inter_main and inter_compound write
  # and what libaom writes, for every block size, class, pair of classes, fraction and filter, 8-bit and
  # 10-bit, at the edges of the frame; seventeen mutated copies must fail.
  inter-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the fast inter shaders with the original shaders and libaom
        run: |
          set -euo pipefail
          sh testing/inter_check/run.sh --mutate | tee inter-check.log
          { echo '## Inter fast path check'; echo '```'; tail -n 24 inter-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the super-resolution shader (upscaling.hlsl) against libaom's normative upscale of
  # this tree, which is the upscaling process of the specification: the shader, compiled as C++,
  # must write the same samples for every denominator, 8-bit and 10-bit, at widths that are and are
  # not multiples of 8, with one and with several tile columns, and six mutated copies must fail.
  superres-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare upscaling.hlsl with libaom
        run: |
          set -euo pipefail
          sh testing/superres_check/run.sh --mutate | tee superres-check.log
          { echo '## Super-resolution check'; echo '```'; cat superres-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host proof for intra v2: the original intra shaders (intra_main + intra_filter, with the
  # wavefront iterations of the original host code) and intra_v2 with its scheduler, compiled as
  # C++, must write byte-identical frames on generated block layouts, 8-bit and 10-bit.
  intra-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare intra_v2.hlsl with intra_main.hlsl and intra_filter.hlsl
        run: |
          set -euo pipefail
          sh testing/intra_check/run.sh --mutate --layouts 400 | tee intra-check.log
          { echo '## Intra bit-exactness check'; echo '```'; cat intra-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Timing summary self-test
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -I libav1 -o perf_stats_test testing/player_common/perf_stats_test.cpp
          ./perf_stats_test
          python3 testing/shader_cache/inter_static.py --self-test

      # The sequence header peek behind aom_codec_peek_stream_info and the player's -fitsize:
      # headers written by hand from the specification's syntax must be read back with their
      # values, cut headers must be reported, and five mutated copies of the peek must fail.
      - name: Sequence header peek check
        run: |
          set -euo pipefail
          sh testing/seq_header_check/run.sh --mutate | tee seq-header-check.log
          { echo '## Sequence header peek check'; echo '```'; cat seq-header-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The comparisons of the Shader Model 6 test (-sm6test): emulated outputs of its shaders must pass,
      # outputs with one word changed must fail.
      - name: Shader Model 6 test comparisons self-test
        run: |
          set -euo pipefail
          sh testing/sm6test/run.sh | tee sm6test-checks.log
          { echo '## Shader Model 6 test comparisons'; echo '```'; tail -n 1 sm6test-checks.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-intra-check-${{ github.run_id }}
          path: intra-check.log
          if-no-files-found: warn
