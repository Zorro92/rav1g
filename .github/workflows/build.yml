name: Build

on:
  push:
    branches: [main, cpp]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      experiments:
        description: >
          Also build the uavsync package and decode the conformance set again with each experiment
          flag, with poisoned buffers (-poisonmi, -poisonbuf) and with the uavsync shaders (about 20
          more minutes)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The av1-xbox-one commit this repository is forked from (recorded in SOURCES.txt).
  UPSTREAM_URL: https://aomedia.googlesource.com/av1-xbox-one
  UPSTREAM_COMMIT: b5c61563b48625c261a8d627cfa928896fd10b13

jobs:
  player:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLATFORM_TOOLSET: v145
      WINDOWS_SDK: 10.0.26100.0
    steps:
      # Byte-exact sources: no newline conversion on the Windows runner.
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Record sources and copy licence notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          git -C src merge-base --is-ancestor $env:UPSTREAM_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The pinned upstream commit is not an ancestor of HEAD' }
          $sources = @(
            "Repository: https://github.com/$env:GITHUB_REPOSITORY",
            "Commit: $env:GITHUB_SHA",
            "Forked from: $env:UPSTREAM_URL at $env:UPSTREAM_COMMIT",
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: Release x64; PlatformToolset=$env:PLATFORM_TOOLSET; Windows SDK=$env:WINDOWS_SDK",
            'Changes since the fork point:'
          )
          $sources += @(git -C src log --format='%h %s' "$env:UPSTREAM_COMMIT..HEAD")
          if ($LASTEXITCODE -ne 0) { throw 'git log failed' }
          $sources | Set-Content out/SOURCES.txt -Encoding utf8
          # Binary redistribution retains the BSD notices and AOM patent license, including libwebm.
          foreach ($license in @('LICENSE.txt', 'libav1/LICENSE', 'libav1/PATENTS',
              'third_party/libwebm/LICENSE.TXT', 'third_party/libwebm/PATENTS.TXT')) {
            $destination = Join-Path out/licenses $license
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item (Join-Path src $license) $destination
          }

      # The shaders: the bytecode header and the listing of every shader from one FXC call per shader, with the
      # FXC, profile and flags of the Release x64 project (cs_5_0, entry main, default optimization, /Od
      # where the project disables it), for the normal build and for the uavsync variant, from a cache by
      # content (.github/actions/shaders, testing/shader_cache/shaders.py). A shader that does not compile
      # stops the run here.
      - name: Shaders
        id: shaders
        uses: ./src/.github/actions/shaders
        with:
          repo: src
          sdk: ${{ env.WINDOWS_SDK }}

      # The shaders of the Shader Model 6 test (player flag -sm6test, docs/test-player.md): DXC shaders of
      # testing/sm6test/shaders, not shaders of the decoder and in none of the steps around this one that
      # are about the decoder's shaders. The player gets their bytecode through /p:Rav1gSm6TestShaders.
      - name: Shader Model 6 test shaders
        id: sm6
        uses: ./src/.github/actions/sm6test-shaders
        with:
          repo: src
          sdk: ${{ env.WINDOWS_SDK }}

      # Codegen evidence for the CDEF and intra rewrites, which cannot be measured without a console: the
      # CDEF and intra listings get a side-by-side count, all shaders a one-line survey.
      # intra_main_opt and intra_main_hbd_opt are the upstream intra_main sources built with optimization
      # (player flag -intraopt), listed next to the /Od builds the project asks for. A bit field
      # instruction whose width is known only at run time stops the run (docs/gpu-av1-decoder.md, "Bit
      # fields of width 0").
      - name: Shader survey, CDEF and intra listings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python src/testing/shader_cache/shaders.py survey --report shader-build/normal/report.json `
            --listings shader-build/normal/asm --out out --sdk $env:WINDOWS_SDK
          if ($LASTEXITCODE -ne 0) { throw 'The shader survey failed' }
          # The static view of the inter prediction shaders (docs/gpu-av1-decoder.md, "Inter prediction
          # breakdown"): the listings next to what a thread of each shader does, which is read from the
          # source. A shader whose listing no longer has the loads the table says stops the run.
          python src/testing/shader_cache/inter_static.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'The self-test of the inter static view failed' }
          python src/testing/shader_cache/inter_static.py --listings shader-build/normal/asm --strict `
            --out out/shader-survey/inter-static.md
          if ($LASTEXITCODE -ne 0) { throw 'An inter shader differs from the table in testing/shader_cache/inter_static.py: update the table and the docs' }
          # All listings, and which key, compile time and header hash each shader of the build has.
          Copy-Item shader-build/normal/asm out/shader-survey/asm -Recurse
          Copy-Item shader-build/normal/report.json out/shader-survey/build.json
          # The Shader Model 6 test shaders of the package: DXC's listings and the report of their build.
          New-Item -ItemType Directory -Force out/sm6test-shaders | Out-Null
          Copy-Item sm6test-build/asm out/sm6test-shaders/asm -Recurse
          Copy-Item sm6test-build/report.json, sm6test-build/report.md out/sm6test-shaders/

      # The listings of both variants are scanned for the pair of instructions that the console's driver
      # compiled wrongly in the 8-bit vertical loop filter: a vector instruction that rewrites components
      # of a register from the same register across components, and before it, in the same run of
      # instructions, an instruction that reads two of those components into one result
      # (docs/gpu-av1-decoder.md, "A paired read before an overlapping in-place write"). A pair that
      # testing/dxbc_scan/allow.txt does not have stops the run; the report with every overlapping
      # in-place write goes into the artifact next to the survey.
      - name: Listings scan, paired read before an overlapping in-place write
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python src/testing/dxbc_scan/scan.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'The listings scan does not find the known pair' }
          python src/testing/dxbc_scan/scan.py --listings shader-build/normal/asm --listings shader-build/uavsync/asm `
            --min-listings 92 --out out/shader-survey/listing-scan.txt
          if ($LASTEXITCODE -ne 0) {
            throw 'A listing has a paired read before an overlapping in-place write: rewrite the HLSL (see the scan output)'
          }

      # MSBuild with the v145 toolset and Windows SDK 10.0.26100.0 (upstream targets v141/17763).
      - uses: microsoft/setup-msbuild@v3

      # Identity name and publisher stay those of the earlier test player builds, so the
      # package family (and its LocalState with streams and md5 references) carries over.
      # Version 0.2.x outranks the 0.1.x packages built before this repository existed.
      - name: Create sideload certificate and stamp package identity
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Bale Development' `
            -KeyUsage DigitalSignature -FriendlyName 'rav1g Test Player Development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-Certificate -Cert $cert -FilePath out/Av1GpuTestPlayer.cer | Out-Null
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Name = 'Av1GpuTestPlayer'
          $manifest.Package.Identity.Publisher = $cert.Subject
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.0"
          $manifest.Package.Properties.DisplayName = 'rav1g Test Player'
          $manifest.Package.Properties.PublisherDisplayName = 'rav1g'
          $manifest.Package.Applications.Application.VisualElements.DisplayName = 'rav1g Test Player'
          $manifest.Package.Applications.Application.VisualElements.Description = 'rav1g D3D12 compute AV1 test player'
          $manifest.Save($path)

      - name: Build signed Release x64 sideload package
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          # /sdl promotes upstream's deprecated GetDesktopDpi call to C4996 even without /WX.
          # _CL_ appends this override after the project's compiler options; no source patch is needed.
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out/msbuild.log'
          # Building the solution supplies SolutionDir to the shader/include paths and builds all three projects.
          # Clear the upstream committed PFX: signing must use only this run's certificate in the store.
          & MSBuild.exe src/av1xbox.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" `
            "/p:Rav1gPrebuiltShaders=${{ steps.shaders.outputs.normal }}" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'Release x64 player build/package failed; see msbuild.log' }
          $packages = @(Get-ChildItem out/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No application sideload package was produced' }
          # The listings describe the shipped shaders: each comes from the FXC call that wrote the header the
          # library was compiled from. MSBuild ran FXC on no shader of the library, and the bytecode of the
          # headers is in the program of the package, byte for byte.
          if (Select-String -Path $buildLog -Pattern 'fxc\.exe.*[\\/]dx[\\/]shaders[\\/]' -Quiet) {
            throw 'MSBuild compiled shaders of the library itself: Rav1gPrebuiltShaders was not in effect'
          }
          python src/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal --note out/cdef-shaders/stats.txt --note out/intra-shaders/stats.txt `
            --note out/shader-survey/survey.md @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package was not built from the shader headers of this run' }
          # -sm6test needs its shaders in the player: the bytecode of each is in the program of the package.
          python src/testing/sm6test/compile.py --verify sm6test-build @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package does not have the Shader Model 6 test shaders of this run' }
          "Variant: reference: the C++ library (libav1) behind rav1g.h, package version 0.2.$env:GITHUB_RUN_NUMBER.0" |
            Add-Content out/SOURCES.txt -Encoding utf8
          @('## rav1g test player', '', 'CI build only; console timings are taken separately.', '',
            "Three packages of the same player and the same identity, to be timed against each other (docs/test-player.md): this one, version 0.2.$env:GITHUB_RUN_NUMBER.0, with the C++ library; 0.2.$env:GITHUB_RUN_NUMBER.2 with the Rust library and the C of MSVC; 0.2.$env:GITHUB_RUN_NUMBER.3 with the Rust library and the C of clang.", '',
            '### Artifact files', '```') +
            @(Get-ChildItem out -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath((Resolve-Path out), $_.FullName) }) +
            @('```') >> $env:GITHUB_STEP_SUMMARY

      # The DLLs the programs of the package import from, against the list of testing/uwp_imports: the
      # API sets of WindowsApp.lib, the runtime of VCLibs, DirectX; no kernel32.dll, no desktop runtime
      # (docs/rust-port.md, "The app container"). The same check follows each of the other packages.
      - name: Imports of the reference package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --quiet uv
          if ($LASTEXITCODE -ne 0) { throw 'uv could not be installed' }
          python src/testing/uwp_imports/check_package.py --out out/imports out/packages
          if ($LASTEXITCODE -ne 0) { throw 'A program of the reference package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt' }

      - name: Preserve package, certificate, dependencies, licenses, shader listings, survey and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-x64-${{ github.run_id }}
          path: out/
          if-no-files-found: warn

      # ---------------------------------------------------------------------------------------------
      # The same player on the Rust library (docs/rust-port.md, step 5): two more packages of the same
      # identity, to be timed on the console against the one above and against each other. They differ
      # in what compiled the C of the entropy decoder, which is where the tile threads spend their time:
      #   revision 2: MSVC with /GL, the objects compiled by the player's link (/LTCG:incremental);
      #   revision 3: clang with link time optimisation, linked with the Rust by lld-link into rav1g.dll.
      # A higher revision installs over a lower one and keeps LocalState.
      # ---------------------------------------------------------------------------------------------

      # Stable Rust, and libclang for bindgen, as in the rust job.
      - name: Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install stable' }
          rustup default stable
          rustc --version
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $llvm 'libclang.dll')) { "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV }
          foreach ($tool in @('clang-cl.exe', 'lld-link.exe', 'llvm-lib.exe')) {
            if (-not (Test-Path (Join-Path $llvm $tool))) { throw "$tool is not in $llvm" }
          }
          & (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: player

      # The library for an app container application (docs/rust-port.md, "The C runtime"): the static
      # library with the interface for C, for the DLL runtime, the C compiled by MSVC with /GL for the app
      # family of the Windows API.
      - name: Rust library for the player, C of MSVC (static library)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.normal }}
        run: |
          $ErrorActionPreference = 'Stop'
          $separator = [char]0x1f
          $env:CARGO_ENCODED_RUSTFLAGS = "-Ctarget-feature=-crt-static${separator}--cfg${separator}windows_slim_errors"
          $env:RAV1G_C_LIB_DIR = Join-Path $env:GITHUB_WORKSPACE 'rust-msvc'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo build --manifest-path src/Cargo.toml --release --locked -p rav1g --lib --features capi,app-container `
            --target-dir target-app-msvc
          if ($LASTEXITCODE -ne 0) { throw 'cargo build of the library failed' }
          Copy-Item target-app-msvc/release/rav1g.lib rust-msvc/
          # Without the import members for desktop DLLs (kernel32.dll, ...) that the windows crates put
          # into the library: link.exe would take the functions of Windows from them.
          python src/testing/uwp_imports/prune_import_members.py --ar (Join-Path $env:ProgramFiles 'LLVM\bin\llvm-ar.exe') rust-msvc/rav1g.lib
          if ($LASTEXITCODE -ne 0) { throw 'The import members could not be taken out of rav1g.lib' }
          Get-ChildItem rust-msvc | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
          "## Rust library for the player, C of MSVC", '', "cargo build: $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min ($(rustc --version))." >> $env:GITHUB_STEP_SUMMARY

      - name: Stamp the package with the Rust library, C of MSVC (same identity, revision 2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.2"
          $manifest.Save($path)

      - name: Build the signed package with the Rust library, C of MSVC
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-rust-msvc | Out-Null
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out-rust-msvc/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out-rust-msvc/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-msvc'
          & MSBuild.exe src/av1xbox.sln /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustLib=$library" `
            "/p:Rav1gPrebuiltShaders=${{ steps.shaders.outputs.normal }}" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'The player with the Rust library (C of MSVC) did not build; see out-rust-msvc/msbuild.log' }
          $packages = @(Get-ChildItem out-rust-msvc/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No sideload package with the Rust library (C of MSVC) was produced' }
          # The Rust library has the shaders of this run: their bytecode is in the program of the package.
          python src/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal --note out-rust-msvc/SHADERS.txt @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package with the Rust library was not built from the shader headers of this run' }
          python src/testing/sm6test/compile.py --verify sm6test-build @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package does not have the Shader Model 6 test shaders of this run' }
          python src/testing/uwp_imports/check_package.py --out out-rust-msvc/imports out-rust-msvc/packages
          if ($LASTEXITCODE -ne 0) { throw 'The program of the package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt' }
          # The certificate, the notices and the record of the sources of the reference package apply.
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'cdef-shaders', 'intra-shaders', 'sm6test-shaders', 'imports') })) {
            Copy-Item $item.FullName out-rust-msvc/ -Recurse
          }
          (Get-Content out-rust-msvc/SOURCES.txt) -notmatch '^Variant: ' | Set-Content out-rust-msvc/SOURCES.txt -Encoding utf8
          "Variant: the Rust library (static, $(rustc --version)); the C of the entropy decoder compiled by MSVC with /GL and by the player's link (/LTCG:incremental); package version 0.2.$env:GITHUB_RUN_NUMBER.2" |
            Add-Content out-rust-msvc/SOURCES.txt -Encoding utf8
          @('## Package with the Rust library, C of MSVC', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.2.", '', '```') +
            @($packages | ForEach-Object { $_.Name }) + @(Get-Content out-rust-msvc/imports/check.txt) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the package with the Rust library, C of MSVC
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-rust-msvc-x64-${{ github.run_id }}
          path: out-rust-msvc/
          if-no-files-found: warn

      # The C compiled by clang-cl with full link time optimisation (the build that is level with the
      # MSBuild library in the tile threads on WARP; docs/rust-port.md, "Tile decode time"). Its objects are
      # LLVM bitcode, which the player's link.exe cannot read; and lld-link, which can, cannot link the
      # player: it reads neither the /GL objects the player is made of nor the options that write the
      # Windows metadata of a C++/CX program (/WINMD; docs/rust-port.md, step 5, part 3). So the library
      # is linked by lld-link into a DLL, rav1g.dll, with the
      # functions of rav1g.h and the few functions of the C that the player's stream readers call, and
      # the player links its import library. WindowsApp.lib is first on that
      # link (LINK, which lld-link reads in front of its arguments), the runtime is the app runtime
      # (the store directory of the toolset).
      - name: Rust library for the player, C of clang (rav1g.dll)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.normal }}
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'vswhere found no Visual Studio' }
          $tools = (Get-Content (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          $store = Join-Path $vs "VC\Tools\MSVC\$tools\lib\x64\store"
          if (-not (Test-Path (Join-Path $store 'vcruntime.lib'))) { throw "no app runtime libraries in $store" }
          $separator = [char]0x1f
          $env:CARGO_ENCODED_RUSTFLAGS = "-Ctarget-feature=-crt-static${separator}--cfg${separator}windows_slim_errors"
          $env:CC_x86_64_pc_windows_msvc = Join-Path $llvm 'clang-cl.exe'
          $env:AR_x86_64_pc_windows_msvc = Join-Path $llvm 'llvm-lib.exe'
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = Join-Path $llvm 'lld-link.exe'
          $env:LINK = 'WindowsApp.lib'
          # What the player's stream readers (testing/common) call of the C.
          $exports = @('aom_codec_av1_dx', 'aom_codec_error', 'aom_codec_error_detail', 'aom_img_alloc', 'aom_img_free',
            'aom_img_plane_height', 'aom_img_plane_width', 'aom_read_obu_header', 'aom_uleb_decode')
          $linkArgs = @('-Clink-arg=/APPCONTAINER', "-Clink-arg=/LIBPATH:$store") + @($exports | ForEach-Object { "-Clink-arg=/EXPORT:$_" })
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo rustc --manifest-path src/Cargo.toml --release --locked -p rav1g --lib --features capi,app-container `
            --crate-type cdylib --target x86_64-pc-windows-msvc --target-dir target-app-clang -- @linkArgs
          if ($LASTEXITCODE -ne 0) { throw 'cargo rustc of rav1g.dll failed' }
          New-Item -ItemType Directory -Force rust-clang | Out-Null
          $built = 'target-app-clang/x86_64-pc-windows-msvc/release'
          Copy-Item "$built/rav1g.dll", "$built/rav1g.dll.lib", "$built/rav1g.pdb" rust-clang/
          Get-ChildItem rust-clang | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
          "## Rust library for the player, C of clang", '', "cargo rustc: $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min ($(rustc --version); $(& (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1))." >> $env:GITHUB_STEP_SUMMARY

      - name: Stamp the package with the Rust library, C of clang (same identity, revision 3)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.3"
          $manifest.Save($path)

      - name: Build the signed package with the Rust library, C of clang
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-rust-clang | Out-Null
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out-rust-clang/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out-rust-clang/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-clang'
          & MSBuild.exe src/av1xbox.sln /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustDll=$library" `
            "/p:Rav1gPrebuiltShaders=${{ steps.shaders.outputs.normal }}" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'The player with the Rust library (C of clang) did not build; see out-rust-clang/msbuild.log' }
          $packages = @(Get-ChildItem out-rust-clang/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No sideload package with the Rust library (C of clang) was produced' }
          python src/testing/sm6test/compile.py --verify sm6test-build @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package does not have the Shader Model 6 test shaders of this run' }
          # The programs of the package: the player and rav1g.dll, which has to be in it.
          python src/testing/uwp_imports/check_package.py --out out-rust-clang/imports --need rav1g.dll --also rav1g.dll out-rust-clang/packages
          if ($LASTEXITCODE -ne 0) { throw 'A program of the package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt, or rav1g.dll is not in the package' }
          # The Rust library has the shaders of this run: their bytecode is in the rav1g.dll of the package.
          python src/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal --note out-rust-clang/SHADERS.txt out-rust-clang/imports/unpacked/rav1g.dll
          if ($LASTEXITCODE -ne 0) { throw 'The rav1g.dll of the package was not built from the shader headers of this run' }
          Remove-Item out-rust-clang/imports/unpacked -Recurse -Force
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'cdef-shaders', 'intra-shaders', 'sm6test-shaders', 'imports') })) {
            Copy-Item $item.FullName out-rust-clang/ -Recurse
          }
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          (Get-Content out-rust-clang/SOURCES.txt) -notmatch '^Variant: ' | Set-Content out-rust-clang/SOURCES.txt -Encoding utf8
          "Variant: the Rust library (rav1g.dll, $(rustc --version)); the C of the entropy decoder compiled by $(& (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1) with full link time optimisation, linked by lld-link; package version 0.2.$env:GITHUB_RUN_NUMBER.3" |
            Add-Content out-rust-clang/SOURCES.txt -Encoding utf8
          Copy-Item rust-clang/rav1g.pdb out-rust-clang/
          @('## Package with the Rust library, C of clang', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.3.", '', '```') +
            @($packages | ForEach-Object { $_.Name }) + @(Get-Content out-rust-clang/imports/check.txt) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the package with the Rust library, C of clang
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-rust-clang-x64-${{ github.run_id }}
          path: out-rust-clang/
          if-no-files-found: warn

      # The uavsync package: the same sources, with every group sync of the shaders compiled as a sync
      # of all memory (AllMemoryBarrierWithGroupSync; /p:Rav1gUavSync=1 in libav1.vcxproj, and the
      # shader headers of the uavsync variant from the Shaders step). An
      # experiment for a device on which a frame buffer store of one thread is not seen by another
      # thread of the group behind a sync of the group memory alone (docs/test-player.md,
      # "Experiments"). Same identity as the normal package and revision 1 instead of 0: it installs
      # over the normal package of this run and keeps its LocalState, and the normal package of a
      # later run installs over it.
      - name: Stamp the uavsync package (same identity, revision 1)
        if: ${{ inputs.experiments }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.1"
          $manifest.Save($path)

      - name: Build the signed uavsync package (all-memory group syncs)
        if: ${{ inputs.experiments }}
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-uavsync | Out-Null
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out-uavsync/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out-uavsync/msbuild.log'
          & MSBuild.exe src/av1xbox.sln /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" /p:Rav1gUavSync=1 `
            "/p:Rav1gPrebuiltShaders=${{ steps.shaders.outputs.uavsync }}" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'uavsync player build/package failed; see out-uavsync/msbuild.log' }
          $packages = @(Get-ChildItem out-uavsync/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No uavsync sideload package was produced' }
          # The package has the shaders of the uavsync build (the action has checked that they are not
          # those of the normal build), and MSBuild compiled none of them.
          if (Select-String -Path $buildLog -Pattern 'fxc\.exe.*[\\/]dx[\\/]shaders[\\/]' -Quiet) {
            throw 'MSBuild compiled shaders of the library itself: Rav1gPrebuiltShaders was not in effect'
          }
          python src/testing/shader_cache/shaders.py verify --report shader-build/uavsync/report.json `
            --root shader-build/uavsync --note out-uavsync/SHADERS.txt @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The uavsync package was not built from the uavsync shader headers of this run' }
          # The certificate, the notices and the record of the sources of the normal package apply.
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'cdef-shaders', 'intra-shaders') })) {
            Copy-Item $item.FullName out-uavsync/ -Recurse
          }
          "Variant: uavsync (shaders compiled with GroupMemoryBarrierWithGroupSync=AllMemoryBarrierWithGroupSync), package version 0.2.$env:GITHUB_RUN_NUMBER.1" |
            Add-Content out-uavsync/SOURCES.txt -Encoding utf8
          @('## uavsync package', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.1: installs over 0.2.$env:GITHUB_RUN_NUMBER.0.", '', '```') +
            @($packages | ForEach-Object { $_.Name }) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the uavsync package
        if: ${{ always() && inputs.experiments }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-uavsync-x64-${{ github.run_id }}
          path: out-uavsync/
          if-no-files-found: warn

  # The streams of the conformance run: AOM's decoder test vectors with AOM's md5 files, cuts of
  # Netflix Open Content and streams encoded here with SVT-AV1, both with md5 references from dav1d
  # (testing/conformance/streams.txt, prepare_streams.sh). The streams are media: they are kept in
  # the Actions cache, keyed by the list and the scripts that make them, and never in the repository
  # or in an artifact. The artifact of this job has the md5 references and the task list only.
  conformance-streams:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # warp_decoder compiles the library's sources itself; its list must be the library project's.
      - name: Source list of the desktop decoder matches libav1.vcxproj
        run: python3 testing/warp_decoder/sync_sources.py --check

      - name: Cache key
        id: key
        run: echo "key=conformance-streams-v1-${{ hashFiles('testing/conformance/streams.txt', 'testing/conformance/prepare_streams.sh', 'testing/md5ref/make_md5_ref.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Streams from the cache
        id: streams
        uses: actions/cache@v6
        with:
          path: conformance-streams
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: Fetch and make the streams and their md5 references
        if: steps.streams.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          sh testing/conformance/prepare_streams.sh conformance-streams 2>&1 | grep -v '^Svt\[info\]' | tee prepare.log

      - name: Collect the md5 references (no media)
        run: |
          set -euo pipefail
          mkdir conformance-md5
          cp conformance-streams/manifest.txt conformance-streams/SOURCES.txt conformance-md5/
          (cd conformance-streams && find . -name '*.md5' | while read -r f; do
            mkdir -p "../conformance-md5/$(dirname "$f")" && cp "$f" "../conformance-md5/$f"; done)
          {
            echo '## Conformance streams'
            echo
            echo "- $(grep -c . conformance-streams/manifest.txt) streams, $(du -sh conformance-streams | cut -f1) (cache \`${{ steps.key.outputs.key }}\`, hit: ${{ steps.streams.outputs.cache-hit == 'true' }})"
            echo '```'
            cat conformance-streams/SOURCES.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the md5 references and the task list
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-conformance-md5-${{ github.run_id }}
          path: conformance-md5/
          if-no-files-found: error

  # Conformance run: warp_decoder (testing/warp_decoder), the decoder as a desktop console program,
  # decodes every stream on the D3D12 WARP software adapter of the runner and compares the md5 of
  # every output frame with the reference. testing/conformance/expected.txt lists the streams that
  # fail today; the job fails on a failure that is not listed, on a failure of another kind than
  # listed, on a crash or timeout that is not listed, and when a listed stream passes.
  conformance:
    needs: conformance-streams
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PLATFORM_TOOLSET: v145
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@v3

      # The shader headers of the normal build and of the uavsync variant, from the cache the player job
      # uses: the same keys, so the same bytecode as in the packages.
      - name: Shaders
        id: shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      # The shaders of the Shader Model 6 test (-sm6test), as in the player job.
      - name: Shader Model 6 test shaders
        id: sm6
        uses: ./.github/actions/sm6test-shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Build warp_decoder (desktop, Release x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out/msbuild.log'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          & MSBuild.exe testing/warp_decoder/warp_decoder.vcxproj /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            "/p:Rav1gPrebuiltShaders=${{ steps.shaders.outputs.normal }}" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'warp_decoder build failed; see msbuild.log' }
          $bin = 'testing/warp_decoder/bin/x64/Release'
          if (-not (Test-Path "$bin/warp_decoder.exe")) { throw 'warp_decoder.exe was not produced' }
          # Built from the headers of the Shaders step: MSBuild ran FXC on no shader, and their bytecode
          # is in the program.
          if (Select-String -Path $buildLog -Pattern 'fxc\.exe.*[\\/]dx[\\/]shaders[\\/]' -Quiet) {
            throw 'MSBuild compiled the shaders itself: Rav1gPrebuiltShaders was not in effect'
          }
          python testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal "$bin/warp_decoder.exe"
          if ($LASTEXITCODE -ne 0) { throw 'warp_decoder was not built from the shader headers of this run' }
          python testing/sm6test/compile.py --verify sm6test-build "$bin/warp_decoder.exe"
          if ($LASTEXITCODE -ne 0) { throw 'warp_decoder does not have the Shader Model 6 test shaders of this run' }
          New-Item -ItemType Directory -Force out/warp_decoder | Out-Null
          Get-ChildItem $bin -File | Where-Object { $_.Extension -in @('.exe', '.pdb', '.map') } |
            Copy-Item -Destination out/warp_decoder/
          # Binary redistribution retains the BSD notices and AOM patent license, including libwebm.
          foreach ($license in @('LICENSE.txt', 'libav1/LICENSE', 'libav1/PATENTS',
              'third_party/libwebm/LICENSE.TXT', 'third_party/libwebm/PATENTS.TXT')) {
            $destination = Join-Path out/warp_decoder/licenses $license
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $license $destination
          }
          "Commit: $env:GITHUB_SHA", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: Release x64; PlatformToolset=$env:PLATFORM_TOOLSET; Windows SDK=$env:WINDOWS_SDK" |
            Set-Content out/warp_decoder/SOURCES.txt -Encoding utf8
          "## warp_decoder", '', "Built in $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min.", '' >> $env:GITHUB_STEP_SUMMARY

      # Shader Model 6 test (docs/test-player.md): what WARP reports about itself (CAPS lines) and the test
      # shaders run on it (SM6TEST lines), for reference next to the console's. What WARP does with a shader
      # is a result and never fails the job: a pipeline state it refuses (PSO FAILED) and values that differ
      # (FAIL, with a warning on the run). The job fails when the test itself breaks: the program ends with
      # an error, a test has no result line, the report is missing.
      - name: Shader Model 6 test on WARP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/sm6test | Out-Null
          & out/warp_decoder/warp_decoder.exe -sm6test > out/sm6test/warp.log
          $code = $LASTEXITCODE
          $lines = @(Get-Content out/sm6test/warp.log)
          $shown = @($lines | Where-Object { $_ -match '^(ADAPTER|CAPS|SM6TEST) ' })
          @('## Shader Model 6 test on WARP', '', '```') + $shown + @('```', '') >> $env:GITHUB_STEP_SUMMARY
          $shown | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "warp_decoder -sm6test: exit code $code (2: the test could not run its shaders; see the SM6TEST lines)" }
          $expected = @((Get-Content sm6test-build/report.json -Raw | ConvertFrom-Json).shaders).Count
          $results = @($lines | Where-Object { $_ -match '^SM6TEST \S+: (PASS|FAIL|PSO FAILED|NOT BUILT)' })
          if ($results.Count -ne $expected) { throw "$($results.Count) result lines for $expected test shaders" }
          if (-not @($lines | Where-Object { $_ -match '^SM6TEST summary: ' }).Count) { throw 'No SM6TEST summary line' }
          if (@($lines | Where-Object { $_ -match '^CAPS ' }).Count -lt 15) { throw 'The capability report is not complete' }
          foreach ($needed in @('^CAPS shader model: ', '^CAPS options1: ', '^CAPS options4: ', '^CAPS wave size: ')) {
            if (-not @($lines | Where-Object { $_ -match $needed }).Count) { throw "No line $needed in the capability report" }
          }
          $failed = @($results | Where-Object { $_ -match '^SM6TEST \S+: FAIL' })
          foreach ($line in $failed) { Write-Host "::warning title=Shader Model 6 test on WARP::$line" }

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The decoder code of the test player (testing/player_common), run as the player runs it: its task
      # file, its decoder creation with a device and no queue, its output pool, its md5 check, through
      # rav1g.h on the C++ library (rav1g_libav1.cpp), which is what the reference package of the player
      # job has. The player itself is a UWP app and does not run here; warp_decoder -playersmoke is the
      # part of it that uses the decoder. Every task has to end with "MD5 is OK", the log must have no
      # error line, and the launch has to end.
      - name: The test player's decoder code through rav1g.h on WARP (warp_decoder -playersmoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force conformance-streams/args, out/player-smoke | Out-Null
          $tasks = @(
            '-i /aom/av1-1-b8-01-size-66x66.ivf -md5_frame_check -nopresent -frate -1',
            '-i /aom/av1-1-b10-00-quantizer-00.ivf -md5_frame_check -nopresent -frate -1 -t 4 -slots 3',
            '-i /aom/av1-1-b8-03-sizeup.mkv -md5_frame_check -nopresent -frate -1 -t 4 -r -lowmem',
            '-i /aom/av1-1-b8-22-svc-L2T1.ivf -md5_frame_check -nopresent -frate -1 -gputime -asyncclear')
          $tasks | Set-Content conformance-streams/args/args_av1.txt -Encoding ascii
          & out/warp_decoder/warp_decoder.exe -playersmoke (Resolve-Path conformance-streams).Path > out/player-smoke/player.log
          $code = $LASTEXITCODE
          Remove-Item conformance-streams/args -Recurse -Force
          $lines = @(Get-Content out/player-smoke/player.log)
          $lines | Where-Object { $_ -match 'LIBRARY |MD5 |ERROR|PLAYERSMOKE|Frame slots|Bye' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "warp_decoder -playersmoke: exit code $code (2: the player did not end its launch)" }
          if (-not @($lines | Where-Object { $_ -match 'LIBRARY libav1' }).Count) { throw 'No LIBRARY line of the C++ library in the player log' }
          $errors = @($lines | Where-Object { $_ -match ':ERROR:|:FATAL:' })
          if ($errors.Count) { throw "$($errors.Count) error lines in the player log; the first: $($errors[0])" }
          $ok = @($lines | Where-Object { $_ -match 'MD5 is OK' }).Count
          if ($ok -ne $tasks.Count) { throw "$ok of $($tasks.Count) tasks of the player ended with 'MD5 is OK'" }
          "## Test player decoder code through rav1g.h on WARP", '', "$ok of $($tasks.Count) tasks: MD5 is OK; the launch ended.", '' >> $env:GITHUB_STEP_SUMMARY

      - name: Decode every stream on WARP and compare with expected.txt
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --out out/conformance --threads 4
          if ($LASTEXITCODE -ne 0) { throw "conformance run: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # Order check (testing/conformance/order_check.py; docs/gpu-av1-decoder.md, "Padding of the mode info
      # record"): what a decoder writes must not depend on what the process decoded before. The sequences that
      # showed such a dependence, each in one decoder process and in this order, every stream against its
      # reference: an 8-bit quantizer vector and then the first 10-bit one, the ten 8-bit ones and then the
      # 10-bit one (-t 1 and -t 4), svc-L2T1 and then svc-L2T1-2. No stream is decoded again alone: that is
      # what kept the dependence out of sight. Only a sequence that lost the D3D12 device runs again, whole.
      - name: Order check, streams one after the other in one process
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/order_check.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --out out/order-check
          if ($LASTEXITCODE -ne 0) { throw "order check: exit code $LASTEXITCODE (1: a stream is wrong behind other streams, 2: the check could not be done)" }

      # The same dependence without waiting for the memory of an earlier decoder: with -poisonmi the decoder
      # fills the mode info pool with the byte 0xA5 when it creates it (dx/av1_perf.h, av1_set_poison_buffers),
      # so a shader that reads bytes of a record that the entropy decoder never wrote (padding of the C
      # struct, a field the block's kind does not have) gives another output at once. The output has to be
      # the same: a part of the set, about half a minute (ten quantizer vectors of each bit depth, the other
      # vectors, one cut), has to give the results of expected.txt.
      - name: Conformance of the vectors with a poisoned mode info pool (-poisonmi)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --out out/conformance-poisonmi --threads 4 "--tool-args=-poisonmi" "--title=part of the set with -poisonmi" `
            "--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -poisonmi: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # -poisonbuf, the same for every buffer the CPU writes for the shaders, and for the constants of the
      # stages in every frame: their memory is reused from frame to frame, so the decoder fills each record
      # with 0xA5 when it hands it out, right before the stage writes it (ComputeCommandBuffer::Alloc). A
      # field that a stage does not write and a shader reads then has no plausible value left from an
      # earlier frame. That was the case of loop restoration, whose shader computed an address from the unit
      # fields of a plane without restoration and loaded from it, which could remove the device
      # (docs/gpu-av1-decoder.md, "Unwritten fields of a constant record"). The same part of the set as with
      # -poisonmi has to give the results of expected.txt; the whole set, also with -interfast and with
      # -intrav2, is decoded with it when the workflow is started with the experiments input.
      - name: Conformance of the vectors with poisoned buffers and constants (-poisonbuf)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --out out/conformance-poisonbuf --threads 4 "--tool-args=-poisonbuf" "--title=part of the set with -poisonbuf" `
            "--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -poisonbuf: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The fast inter path (-interfast; docs/gpu-av1-decoder.md, "Inter prediction: breakdown and fast
      # paths"): the blocks with one reference and the averaged compound blocks are listed by the fraction
      # of their motion vectors and predicted by inter_fast.hlsl and inter_compound_fast.hlsl. The output
      # has to be the same, so the whole set is decoded once more with the flag and has to give the
      # results of expected.txt. This pass is the gate of the feature and runs on every push.
      - name: Conformance with -interfast
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --out out/conformance-interfast --threads 4 "--tool-args=-interfast" "--title=with -interfast"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -interfast: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The inter breakdown of the timing run (-gputimedetail, -gputimeisolate; docs/test-player.md, "Inter
      # prediction breakdown") as a smoke test: a 10-bit stream and one with scaled references, each decoded
      # with -gputime, -gputimedetail and -gputimeisolate against its reference. WARP's times say nothing;
      # checked are the output, that the breakdown is there, that the dispatches the recording counts and
      # the blocks the tile threads count agree on every frame, and that the numbers are plausible.
      - name: Timing run with the inter breakdown on WARP (smoke test)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/gputime_smoke.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --out out/gputime-smoke --threads 4 --stream nf-chimera-10b-1080p.ivf:16 --stream syn-resize-10b-1080p.ivf:24:scaled `
            --stream nf-chimera-8b-270p.ivf:40
          if ($LASTEXITCODE -ne 0) { throw "inter breakdown smoke test: exit code $LASTEXITCODE (1: a check failed, 2: a run could not be done)" }

      # Stage dumps (testing/conformance/dump_tasks.txt): the buffers behind every GPU stage of a few
      # frames, as WARP wrote them, to compare with the dumps of another device (the test player's
      # -dumpstages) with testing/stage_dump/stage_dump.py. Dumps of the vectors and of the streams
      # encoded here; of the cuts of published streams only digests (hashes), never samples.
      - name: Stage dumps of the frames in dump_tasks.txt
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/stage_dump/ci_dumps.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps --threads 4
          if ($LASTEXITCODE -ne 0) { throw "stage dumps: exit code $LASTEXITCODE" }

      # The MEMORY lines of the decoder (testing/conformance/memory_lines.py): what a decoder of a few
      # configurations holds, its budget line and the steps of its release, for the comparison with the
      # lines of rav1g-dec in the rust-equal job.
      - name: MEMORY log lines of a few decoder configurations
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/memory_lines.py run --tool out/warp_decoder/warp_decoder.exe `
            --streams conformance-streams --out out/memory-lines
          if ($LASTEXITCODE -ne 0) { throw "memory lines: exit code $LASTEXITCODE" }

      - name: Preserve the stage dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-stage-dumps-${{ github.run_id }}
          path: out/stage-dumps/
          if-no-files-found: warn

      # The experiments (docs/test-player.md, "Experiments"): on a device that follows D3D each of them
      # leaves the output as it is, so the whole set is decoded again with each flag and has to give the
      # results of expected.txt, and once more with a decoder whose shaders are those of the uavsync
      # package. They answered their question (none changed the console's output), so they run only
      # when the workflow is started by hand with the experiments input.
      - name: Conformance with each experiment flag
        if: ${{ !cancelled() && inputs.experiments }}
        shell: pwsh
        run: |
          $runs = @(@{ name = 'lfhsplit1'; args = '-lfhsplit 1' }, @{ name = 'lfhsplit2'; args = '-lfhsplit 2' },
            @{ name = 'intraedgefix'; args = '-intraedgefix' },
            # Not experiments for a device: the whole set with the mode info pool poisoned, and with every
            # buffer and the constants poisoned, also on the fast inter path and with the second intra
            # scheduler (the steps with -poisonmi and -poisonbuf above decode a part of the set on every push).
            @{ name = 'poisonmi-all'; args = '-poisonmi' },
            @{ name = 'poisonbuf-all'; args = '-poisonbuf' },
            @{ name = 'poisonbuf-interfast'; args = '-poisonbuf -interfast' },
            @{ name = 'poisonbuf-intrav2'; args = '-poisonbuf -intrav2' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" "--title=with $($run.args)"
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "conformance with an experiment flag: $($failed -join '; ')" }

      - name: Build warp_decoder with the shaders of the uavsync package
        if: ${{ !cancelled() && inputs.experiments }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out/msbuild-uavsync.log'
          & MSBuild.exe testing/warp_decoder/warp_decoder.vcxproj /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" /p:Rav1gUavSync=1 `
            "/p:Rav1gPrebuiltShaders=${{ steps.shaders.outputs.uavsync }}" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'warp_decoder uavsync build failed; see msbuild-uavsync.log' }
          New-Item -ItemType Directory -Force out/warp_decoder_uavsync | Out-Null
          Copy-Item testing/warp_decoder/bin/x64/Release/warp_decoder.exe out/warp_decoder_uavsync/
          if (Select-String -Path $buildLog -Pattern 'fxc\.exe.*[\\/]dx[\\/]shaders[\\/]' -Quiet) {
            throw 'MSBuild compiled the shaders itself: Rav1gPrebuiltShaders was not in effect'
          }
          python testing/shader_cache/shaders.py verify --report shader-build/uavsync/report.json `
            --root shader-build/uavsync out/warp_decoder_uavsync/warp_decoder.exe
          if ($LASTEXITCODE -ne 0) { throw 'The uavsync warp_decoder was not built from the uavsync shader headers of this run' }

      - name: Conformance with the uavsync shaders
        if: ${{ !cancelled() && inputs.experiments }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/warp_decoder_uavsync/warp_decoder.exe --streams conformance-streams `
            --out out/conformance-uavsync --threads 4 "--title=uavsync shaders (all-memory group syncs)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance-uavsync/lists/run001.log -Pattern '^SHADERS uavsync' -Quiet)) {
            throw 'The decoder of this run does not report the uavsync shaders'
          }
          if ($code -ne 0) { throw "conformance with the uavsync shaders: exit code $code" }

      - name: Preserve the results, the per-stream logs and md5 files, and the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-conformance-${{ github.run_id }}
          path: |
            out/conformance/
            out/conformance-*/
            out/order-check/
            out/gputime-smoke/
            out/memory-lines/
            out/sm6test/
            out/player-smoke/
            out/msbuild.log
            out/msbuild-uavsync.log
          if-no-files-found: warn

      - name: Preserve warp_decoder.exe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-warp-decoder-x64-${{ github.run_id }}
          path: out/warp_decoder/
          if-no-files-found: warn

  # The Rust port (docs/rust-port.md). Step 1: the Cargo workspace builds the C entropy decoder and the C++
  # host with cc (crates/rav1g-sys) from the shader headers of the Shaders step, and rav1g-dec
  # (tools/rav1g-dec) takes the place of warp_decoder. This job builds it with MSVC, decodes the conformance
  # set with it on WARP against the same references and expected.txt, and runs the timing smoke test and the
  # stage dumps with it; the rust-equal job then compares its md5 per frame with warp_decoder's.
  rust:
    needs: conformance-streams
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same cache and keys as the player and conformance jobs: the same bytecode.
      - name: Shaders
        id: shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Shader Model 6 test shaders
        id: sm6
        uses: ./.github/actions/sm6test-shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      # Stable Rust (the minimum supported version is the latest stable), and libclang for bindgen.
      - name: Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install stable' }
          rustup default stable
          rustc --version
          cargo --version
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path (Join-Path $llvm 'libclang.dll')) { "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV }

      - uses: Swatinem/rust-cache@v2

      - name: Build rav1g-dec (cargo, MSVC, release)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.normal }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/rav1g-dec | Out-Null
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          $built = [math]::Round($clock.Elapsed.TotalMinutes, 1)
          if (-not (Test-Path target/release/rav1g-dec.exe)) { throw 'rav1g-dec.exe was not produced' }
          # Built from the headers of the Shaders step: their bytecode is in the program, byte for byte.
          python testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal target/release/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'rav1g-dec was not built from the shader headers of this run' }
          python testing/sm6test/compile.py --verify sm6test-build target/release/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'rav1g-dec does not have the Shader Model 6 test shaders of this run' }
          Copy-Item target/release/rav1g-dec.exe, target/release/rav1g_dec.pdb -Destination out/rav1g-dec/
          # Binary redistribution retains the BSD notices and AOM patent license, including libwebm.
          foreach ($license in @('LICENSE.txt', 'libav1/LICENSE', 'libav1/PATENTS',
              'third_party/libwebm/LICENSE.TXT', 'third_party/libwebm/PATENTS.TXT')) {
            $destination = Join-Path out/rav1g-dec/licenses $license
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $license $destination
          }
          "Commit: $env:GITHUB_SHA", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: cargo build --release, $(rustc --version), MSVC" |
            Set-Content out/rav1g-dec/SOURCES.txt -Encoding utf8
          "## rav1g-dec", '', "cargo build --release: $built min ($(rustc --version)).", '' >> $env:GITHUB_STEP_SUMMARY

      # The unit tests of the workspace (the md5 of rav1g-dec, its argument parser) and the layout tests of
      # the bindings (crates/rav1g-sys/src/layout_tests.rs): the size and alignment of every struct that
      # Rust shares with the C interface, the entropy decoder or the shaders, and the offset and size of
      # each of its fields, as the bindings have them against what the C compiler of this build says; and
      # MB_MODE_INFO of blockd.h against the struct the shaders read it with (dx/shaders/mode_info.h).
      - name: Tests (cargo test)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.normal }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          cargo test --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }

      # The Shader Model 6 test through rav1g-dec, as the conformance job runs it through warp_decoder: the
      # program ends without an error and every test shader has a result line.
      - name: Shader Model 6 test on WARP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/sm6test | Out-Null
          & out/rav1g-dec/rav1g-dec.exe -sm6test > out/sm6test/rav1g-dec.log
          $code = $LASTEXITCODE
          $lines = @(Get-Content out/sm6test/rav1g-dec.log)
          $lines | Where-Object { $_ -match '^(ADAPTER|SM6TEST) ' } | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "rav1g-dec -sm6test: exit code $code" }
          $expected = @((Get-Content sm6test-build/report.json -Raw | ConvertFrom-Json).shaders).Count
          $results = @($lines | Where-Object { $_ -match '^SM6TEST \S+: (PASS|FAIL|PSO FAILED|NOT BUILT)' })
          if ($results.Count -ne $expected) { throw "$($results.Count) result lines for $expected test shaders" }
          if (@($lines | Where-Object { $_ -match '^CAPS ' }).Count -lt 15) { throw 'The capability report is not complete' }

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The gate of step 1: every stream of the set, against its reference and expected.txt.
      - name: Decode every stream on WARP with rav1g-dec and compare with expected.txt
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance --threads 4 "--title=rav1g-dec (cargo, MSVC)"
          if ($LASTEXITCODE -ne 0) { throw "conformance run with rav1g-dec: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The interface for C (docs/rust-port.md, step 5): the whole set once more with -capi, which uses
      # the decoder through the functions of rav1g.h (the device, the settings, the output callbacks, the
      # frames), as the UWP test player and every application that is not Rust does.
      - name: Decode every stream on WARP through rav1g.h (rav1g-dec -capi)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-capi --threads 4 "--tool-args=-capi" "--title=rav1g-dec through rav1g.h (-capi)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance-capi/lists/run001.log -Pattern '^INTERFACE .*rav1g\.h' -Quiet)) {
            throw 'The decoder of this run does not report the interface for C'
          }
          if ($code -ne 0) { throw "conformance run with rav1g-dec -capi: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # The order check and the part of the set with -poisonmi, as the conformance job runs them with
      # warp_decoder: streams one after the other in one process without a repeat alone, and the decoder
      # with the mode info pool filled with 0xA5 at creation.
      - name: Order check with rav1g-dec
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/order_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/order-check "--title=rav1g-dec (cargo, MSVC)"
          if ($LASTEXITCODE -ne 0) { throw "order check with rav1g-dec: exit code $LASTEXITCODE (1: a stream is wrong behind other streams, 2: the check could not be done)" }

      - name: Conformance of the vectors with a poisoned mode info pool (-poisonmi) with rav1g-dec
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-poisonmi --threads 4 "--tool-args=-poisonmi" "--title=rav1g-dec, part of the set with -poisonmi" `
            "--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -poisonmi with rav1g-dec: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The same part of the set with -poisonbuf, as the conformance job runs it with warp_decoder: every
      # buffer the CPU writes filled with 0xA5 at creation, and the constants of every stage again in every
      # frame before the stage writes them.
      - name: Conformance of the vectors with poisoned buffers and constants (-poisonbuf) with rav1g-dec
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-poisonbuf --threads 4 "--tool-args=-poisonbuf" "--title=rav1g-dec, part of the set with -poisonbuf" `
            "--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -poisonbuf with rav1g-dec: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # With the experiments input: the whole set with rav1g-dec on the fast inter path, with -poisonbuf,
      # and with both (the conformance job decodes the same with warp_decoder).
      - name: Conformance of the whole set with -interfast and with -poisonbuf with rav1g-dec
        if: ${{ !cancelled() && inputs.experiments }}
        shell: pwsh
        run: |
          $runs = @(@{ name = 'interfast'; args = '-interfast' }, @{ name = 'poisonbuf-all'; args = '-poisonbuf' },
            @{ name = 'poisonbuf-interfast'; args = '-poisonbuf -interfast' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" "--title=rav1g-dec with $($run.args)"
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "conformance with rav1g-dec: $($failed -join '; ')" }

      - name: Timing run with the inter breakdown on WARP with rav1g-dec (smoke test)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/gputime_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/gputime-smoke --threads 4 --stream nf-chimera-10b-1080p.ivf:16 --stream syn-resize-10b-1080p.ivf:24:scaled `
            --stream nf-chimera-8b-270p.ivf:40
          if ($LASTEXITCODE -ne 0) { throw "inter breakdown smoke test with rav1g-dec: exit code $LASTEXITCODE (1: a check failed, 2: a run could not be done)" }

      - name: Stage dumps of the frames in dump_tasks.txt with rav1g-dec
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps --threads 4
          if ($LASTEXITCODE -ne 0) { throw "stage dumps with rav1g-dec: exit code $LASTEXITCODE" }

      - name: MEMORY log lines of a few decoder configurations with rav1g-dec
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/memory_lines.py run --tool out/rav1g-dec/rav1g-dec.exe `
            --streams conformance-streams --out out/memory-lines
          if ($LASTEXITCODE -ne 0) { throw "memory lines with rav1g-dec: exit code $LASTEXITCODE" }

      - name: Preserve the stage dumps of rav1g-dec
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-stage-dumps-${{ github.run_id }}
          path: out/stage-dumps/
          if-no-files-found: warn

      - name: Preserve the results, the per-stream logs and md5 files of rav1g-dec
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-conformance-${{ github.run_id }}
          path: |
            out/conformance/
            out/conformance-*/
            out/order-check/
            out/gputime-smoke/
            out/memory-lines/
            out/sm6test/
          if-no-files-found: warn

      - name: Preserve rav1g-dec.exe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec/
          if-no-files-found: warn

  # Equality with the C++ reference (docs/rust-port.md, "Testing"): rav1g-dec and warp_decoder, built in
  # this run from the same sources and shader headers, must write the same md5 for every output frame of
  # every stream of the set, and the same buffers behind every GPU stage of the dumped frames.
  rust-equal:
    needs: [conformance, rust]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-conformance-${{ github.run_id }}
          path: warp-decoder

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-conformance-${{ github.run_id }}
          path: rav1g-dec

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-stage-dumps-${{ github.run_id }}
          path: warp-decoder-dumps

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-stage-dumps-${{ github.run_id }}
          path: rav1g-dec-dumps

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-conformance-md5-${{ github.run_id }}
          path: conformance-md5

      - name: md5 per frame and stage dumps, rav1g-dec against warp_decoder
        run: |
          set -euo pipefail
          python3 testing/conformance/compare_md5.py --reference warp-decoder/conformance --candidate rav1g-dec/conformance \
            --manifest conformance-md5/manifest.txt --reference-dumps warp-decoder-dumps --candidate-dumps rav1g-dec-dumps

      # The decoder creation, the buffer plan and the release are Rust in rav1g-dec: the same buffers of
      # the same sizes, and the same text about them.
      - name: MEMORY log lines, rav1g-dec against warp_decoder
        run: |
          python3 testing/conformance/memory_lines.py compare --reference warp-decoder/memory-lines \
            --candidate rav1g-dec/memory-lines

  # The shader headers of the normal build for the Linux build below, which has no FXC: the headers and
  # the report of the Shaders step, as an artifact.
  shader-headers:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shaders
        id: shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Preserve the shader headers of the normal build
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-shader-headers-${{ github.run_id }}
          path: |
            shader-build/normal/dx/shaders/h/
            shader-build/normal/report.json
          if-no-files-found: error

  # Linux-native build (docs/rust-port.md, "Requirements"): the workspace for x86_64-pc-windows-msvc on a
  # Linux runner with cargo xwin, which is clang-cl and lld-link with the Windows SDK and C runtime that xwin
  # fetches; no wine, no MSVC. The C entropy decoder and the C++ host are compiled by cc the same way. The
  # shaders are the FXC headers of the shader-headers job.
  rust-cross:
    needs: shader-headers
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CARGO_XWIN_VERSION: 0.23.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-shader-headers-${{ github.run_id }}
          path: shader-headers

      # clang-cl, lld-link, llvm-lib and libclang (bindgen). The C++ standard library of the MSVC runtime
      # that xwin fetches wants Clang 19 or newer.
      - name: Rust toolchain, LLVM and cargo-xwin
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          sudo apt-get update -qq
          llvm=
          for version in 21 20 19; do
            if sudo apt-get install -y -qq --no-install-recommends clang-$version lld-$version llvm-$version libclang-$version-dev; then
              llvm=$version
              break
            fi
          done
          if [ -z "$llvm" ]; then
            # The distribution has none: the packages of apt.llvm.org.
            llvm=20
            curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
            sudo bash llvm.sh $llvm
            rm llvm.sh
            sudo apt-get install -y -qq --no-install-recommends clang-$llvm lld-$llvm llvm-$llvm libclang-$llvm-dev
          fi
          echo "/usr/lib/llvm-$llvm/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$llvm/lib" >> "$GITHUB_ENV"
          pipx install "cargo-xwin==$CARGO_XWIN_VERSION"
          rustc --version
          "/usr/lib/llvm-$llvm/bin/clang-cl" --version | head -n 1
          "/usr/lib/llvm-$llvm/bin/lld-link" --version | head -n 1

      # The Windows SDK and the MSVC C runtime (headers and import libraries), about 1.2 GB unpacked.
      - name: xwin cache (Windows SDK and C runtime)
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ env.CARGO_XWIN_VERSION }}-v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: xwin

      - name: Build the workspace for x86_64-pc-windows-msvc (cargo xwin, release)
        env:
          RAV1G_SHADER_DIR: ${{ github.workspace }}/shader-headers
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo xwin build --release --locked --target x86_64-pc-windows-msvc
          exe=target/x86_64-pc-windows-msvc/release/rav1g-dec.exe
          test -f "$exe"
          # Built from the headers of this run: their bytecode is in the program, byte for byte.
          python3 testing/shader_cache/shaders.py verify --report shader-headers/report.json --root shader-headers "$exe"
          mkdir -p out/rav1g-dec-xwin
          cp "$exe" target/x86_64-pc-windows-msvc/release/rav1g_dec.pdb out/rav1g-dec-xwin/
          for license in LICENSE.txt libav1/LICENSE libav1/PATENTS third_party/libwebm/LICENSE.TXT third_party/libwebm/PATENTS.TXT; do
            mkdir -p "out/rav1g-dec-xwin/licenses/$(dirname "$license")"
            cp "$license" "out/rav1g-dec-xwin/licenses/$license"
          done
          {
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Build: cargo xwin build --release --target x86_64-pc-windows-msvc on Linux, $(rustc --version), $(clang-cl --version | head -n 1)"
          } > out/rav1g-dec-xwin/SOURCES.txt
          {
            echo '## rav1g-dec, built on Linux'
            echo
            echo "cargo xwin build --release: $(( $(date +%s) - start )) s ($(clang-cl --version | head -n 1)); $(stat -c %s "$exe") bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      # rav1g.h, the interface for C, is written from crates/rav1g/src/capi.rs by cbindgen
      # (tools/rav1g-header) and kept in the tree: the file there has to be what the source gives.
      - name: rav1g.h is what crates/rav1g/src/capi.rs gives
        run: cargo run --release --locked -p rav1g-header -- --check

      # The library as an application in an app container links it (docs/rust-port.md, "The app
      # container"): the static library with the interface for C, the C compiled for the app family of the
      # Windows API, both for the DLL runtime. It is linked here into a DLL that has every function of
      # rav1g.h, WindowsApp.lib first, and the DLLs that program imports from are held against the list
      # of the test player (testing/uwp_imports): no kernel32.dll, and of ntdll.dll two functions. The
      # player job does the same with the programs of its packages.
      - name: Library for an app container application, and the DLLs it imports from
        env:
          RAV1G_SHADER_DIR: ${{ github.workspace }}/shader-headers
        run: |
          set -euo pipefail
          separator=$(printf '\037')
          CARGO_ENCODED_RUSTFLAGS="-Ctarget-feature=-crt-static${separator}--cfg${separator}windows_slim_errors" \
            RAV1G_C_LIB_DIR="$PWD/out/app-container" \
            cargo xwin build --release --locked -p rav1g --lib --features capi,app-container \
            --target x86_64-pc-windows-msvc --target-dir target/app-container
          cp target/app-container/x86_64-pc-windows-msvc/release/rav1g.lib out/app-container/
          sh testing/uwp_imports/link_probe.sh out/app-container/rav1g.lib out/app-container \
            "$HOME/.cache/cargo-xwin/xwin" out/app-container-probe
          pipx install uv
          uv run --with pefile==2024.8.26 python testing/uwp_imports/check_imports.py \
            --allow testing/uwp_imports/player-dlls-allow.txt --also vcruntime140.dll \
            --report out/app-container-probe/imports.tsv out/app-container-probe/probe.dll | tee out/app-container-probe/check.txt
          {
            echo '## Library for an app container application (Linux build)'
            echo
            echo '```'
            cat out/app-container-probe/check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the imports of the app container probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-app-container-probe-${{ github.run_id }}
          path: |
            out/app-container-probe/imports.tsv
            out/app-container-probe/check.txt
          if-no-files-found: warn

      - name: Preserve rav1g-dec.exe of the Linux build
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-x64-xwin-${{ github.run_id }}
          path: out/rav1g-dec-xwin/
          if-no-files-found: error

  # The program of the Linux build is a Windows program like the other: it decodes the conformance set on
  # WARP against the same references and expected.txt.
  rust-cross-run:
    needs: [rust-cross, conformance-streams]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-xwin-${{ github.run_id }}
          path: rav1g-dec-xwin

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Decode every stream on WARP with the rav1g-dec of the Linux build
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance --threads 4 "--title=rav1g-dec built on Linux (cargo xwin, clang-cl)"
          if ($LASTEXITCODE -ne 0) { throw "conformance run with the rav1g-dec of the Linux build: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      - name: Preserve the results, the per-stream logs and md5 files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-xwin-conformance-${{ github.run_id }}
          path: out/conformance/
          if-no-files-found: warn

  # Host check of how the shaders hand data between the threads of a thread group. A GPU promises
  # only that all threads of a group meet at a group sync; upstream's shaders counted on the 64
  # threads of a group running in lockstep (one wave), which holds on the console and nowhere else.
  # Every shader with group memory, compiled as C++, runs with its thread groups under an adversarial
  # schedule and its group memory watched for races; a plain GroupMemoryBarrier() is rejected; and
  # for every group sync a copy of the shader with that sync turned into a plain barrier must be
  # rejected for a race. (The CDEF, intra and warp checks below run their shaders the same way.)
  sync-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Group memory races, group syncs and plain barriers of all shaders
        run: |
          set -euo pipefail
          sh testing/sync_check/run.sh --mutate | tee sync-check.log
          { echo '## Thread group check'; echo '```'; cat sync-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host proof for CDEF v2: the original and the v2 CDEF shader source, compiled as C++,
  # must write byte-identical frames (random and edge-case input, 8-bit and high bit depth).
  cdef-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare cdef_filter_v2.hlsl with cdef_filter.hlsl
        run: |
          set -euo pipefail
          sh testing/cdef_check/run.sh --mutate | tee cdef-check.log
          { echo '## CDEF bit-exactness check'; echo '```'; tail -n 4 cdef-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the warp prediction shaders (local warp, global motion, GLOBAL_GLOBALMV) against
  # libaom's C code of this tree: the shaders, compiled as C++, and libaom must write byte-identical
  # frames, with and without working double precision in the shaders, also for frames whose reference 0
  # has another size than the frame (reference scaling, spatial layers), and the mutated copies of the
  # shaders must fail, among them the shaders that took the size of reference 0 for every reference.
  warp-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the warp shaders with libaom
        run: |
          set -euo pipefail
          sh testing/warp_check/run.sh --mutate | tee warp-check.log
          { echo '## Warp check'; echo '```'; tail -n 15 warp-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the fast inter prediction shaders (inter_fast.hlsl, inter_compound_fast.hlsl and their
  # _hbd builds; test flag -interfast) against the original shaders and against libaom's C code of this
  # tree: the shaders, compiled as C++, predict generated frames from lists by motion vector class as
  # gen_pred_blocks_fast.hlsl makes them, and the frame must be what inter_main and inter_compound write
  # and what libaom writes, for every block size, class, pair of classes, fraction and filter, 8-bit and
  # 10-bit, at the edges of the frame; seventeen mutated copies must fail.
  inter-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the fast inter shaders with the original shaders and libaom
        run: |
          set -euo pipefail
          sh testing/inter_check/run.sh --mutate | tee inter-check.log
          { echo '## Inter fast path check'; echo '```'; tail -n 24 inter-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the super-resolution shader (upscaling.hlsl) against libaom's normative upscale of
  # this tree, which is the upscaling process of the specification: the shader, compiled as C++,
  # must write the same samples for every denominator, 8-bit and 10-bit, at widths that are and are
  # not multiples of 8, with one and with several tile columns, and six mutated copies must fail.
  superres-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare upscaling.hlsl with libaom
        run: |
          set -euo pipefail
          sh testing/superres_check/run.sh --mutate | tee superres-check.log
          { echo '## Super-resolution check'; echo '```'; cat superres-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host proof for intra v2: the original intra shaders (intra_main + intra_filter, with the
  # wavefront iterations of the original host code) and intra_v2 with its scheduler, compiled as
  # C++, must write byte-identical frames on generated block layouts, 8-bit and 10-bit.
  intra-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare intra_v2.hlsl with intra_main.hlsl and intra_filter.hlsl
        run: |
          set -euo pipefail
          sh testing/intra_check/run.sh --mutate --layouts 400 | tee intra-check.log
          { echo '## Intra bit-exactness check'; echo '```'; cat intra-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Timing summary self-test
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -I libav1 -o perf_stats_test testing/player_common/perf_stats_test.cpp
          ./perf_stats_test
          python3 testing/shader_cache/inter_static.py --self-test

      # The sequence header peek behind aom_codec_peek_stream_info and the player's -fitsize:
      # headers written by hand from the specification's syntax must be read back with their
      # values, cut headers must be reported, and five mutated copies of the peek must fail.
      - name: Sequence header peek check
        run: |
          set -euo pipefail
          sh testing/seq_header_check/run.sh --mutate | tee seq-header-check.log
          { echo '## Sequence header peek check'; echo '```'; cat seq-header-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The comparisons of the Shader Model 6 test (-sm6test): emulated outputs of its shaders must pass,
      # outputs with one word changed must fail.
      - name: Shader Model 6 test comparisons self-test
        run: |
          set -euo pipefail
          sh testing/sm6test/run.sh | tee sm6test-checks.log
          { echo '## Shader Model 6 test comparisons'; echo '```'; tail -n 1 sm6test-checks.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-intra-check-${{ github.run_id }}
          path: intra-check.log
          if-no-files-found: warn
