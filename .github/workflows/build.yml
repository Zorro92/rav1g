name: Build

on:
  push:
    branches: [main, cpp]
    # A tag v<version of the workspace> runs the release checks before publishing rav1g.dll.
    tags: ['v*']
    # Changes that cannot change a build, a test or a package: the docs, and the files only git and
    # GitHub read (the licence files are not here: the packages carry them).
    # .gitattributes holds linguist attributes only; one with eol or filter settings would change
    # checkouts and has to leave this list.
    paths-ignore: ['**.md', 'docs/**', '.gitattributes', '.gitignore']
  workflow_dispatch:
    inputs:
      experiments:
        description: >
          Also build the uavsync package and decode the conformance set again with each experiment
          flag, with poisoned buffers (-poisonmi, -poisonbuf) and with the uavsync shaders (the job
          rust-experiments, about 20 minutes)
        type: boolean
        default: false
      frames_matrix:
        description: >
          Also decode the conformance set with every combination of 1 to 4 frames in parse and up to 8
          parser threads, twice each (the job frames-matrix, four jobs of about 40 minutes side by side;
          docs/phase2-rav1d.md, "Frames in parallel")
        type: boolean
        default: false
      argon:
        description: Run the Argon Streams AV1 Profile 0 conformance suite on WARP
        type: boolean
        default: false
      argon_switches:
        description: Comma-separated decoder switches to test in extra Argon passes (one flag per pass)
        type: string
        default: ''
  # Weekly runs also exercise the extended frame/thread matrix.
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

# A push that a newer push to the same branch has overtaken is cancelled: only the newest commit's run
# is worth running. A tag (a release), a dispatch and the weekly run each have a group of their
# own, so nothing cancels them or makes them wait.
concurrency:
  group: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && format('{0}-{1}', github.workflow, github.ref) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

env:
  # The av1-xbox-one commit this repository is forked from (recorded in SOURCES.txt).
  UPSTREAM_URL: https://aomedia.googlesource.com/av1-xbox-one
  UPSTREAM_COMMIT: b5c61563b48625c261a8d627cfa928896fd10b13
  # The equality reference (docs/rust-port.md, "Equality reference"): the commit of branch cpp whose
  # warp_decoder the rust-equal job holds rav1g-dec against. Bumped on purpose, with the docs, when a
  # change that both decoders have (a shader, the C of the parser) lands on both branches.
  CPP_REFERENCE_COMMIT: 19ad47b905e73de93dfe3c20cea0f45442a71b2b

jobs:
  player:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLATFORM_TOOLSET: v145
      WINDOWS_SDK: 10.0.26100.0
    steps:
      # Byte-exact sources: no newline conversion on the Windows runner.
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Record sources and copy licence notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          git -C src merge-base --is-ancestor $env:UPSTREAM_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The pinned upstream commit is not an ancestor of HEAD' }
          $sources = @(
            "Repository: https://github.com/$env:GITHUB_REPOSITORY",
            "Commit: $env:GITHUB_SHA",
            "Forked from: $env:UPSTREAM_URL at $env:UPSTREAM_COMMIT",
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: Release x64; PlatformToolset=$env:PLATFORM_TOOLSET; Windows SDK=$env:WINDOWS_SDK",
            'Changes since the fork point:'
          )
          $sources += @(git -C src log --format='%h %s' "$env:UPSTREAM_COMMIT..HEAD")
          if ($LASTEXITCODE -ne 0) { throw 'git log failed' }
          $sources | Set-Content out/SOURCES.txt -Encoding utf8
          # Binary redistribution retains the BSD notices and AOM patent license, including libwebm and
          # rav1d (the library has rav1d's parse pass, third_party/rav1d), and the MIT and Apache-2.0
          # notices of the crates the library links (third_party/rust-crates/NOTICES.txt, which the
          # rust-cross job holds against Cargo.lock).
          foreach ($license in @('LICENSE.txt', 'libav1/LICENSE', 'libav1/PATENTS',
              'third_party/libwebm/LICENSE.TXT', 'third_party/libwebm/PATENTS.TXT',
              'third_party/rav1d/COPYING', 'third_party/rav1d/doc/PATENTS',
              'third_party/rust-crates/NOTICES.txt')) {
            $destination = Join-Path out/licenses $license
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item (Join-Path src $license) $destination
          }

      # The signed DXIL of the decoder, with matching compiler listings.
      - name: Shaders
        id: shaders
        uses: ./src/.github/actions/shaders
        with:
          repo: src
          sdk: ${{ env.WINDOWS_SDK }}

      # The shaders of the Shader Model 6 test (player flag -sm6test, docs/test-player.md): DXC shaders of
      # testing/sm6test/shaders, not shaders of the decoder and in none of the steps around this one that
      # are about the decoder's shaders. The player gets their bytecode through /p:Rav1gSm6TestShaders.
      - name: Shader Model 6 test shaders
        id: sm6
        uses: ./src/.github/actions/sm6test-shaders
        with:
          repo: src
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Preserve the shader listings and compiler reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/shader-survey, out/sm6test-shaders | Out-Null
          Copy-Item shader-build/normal/asm out/shader-survey/asm -Recurse
          Copy-Item shader-build/normal/report.json out/shader-survey/build.json
          Copy-Item sm6test-build/asm out/sm6test-shaders/asm -Recurse
          Copy-Item sm6test-build/report.json, sm6test-build/report.md out/sm6test-shaders/

      # MSBuild with the v145 toolset and Windows SDK 10.0.26100.0 (upstream targets v141/17763).
      - uses: microsoft/setup-msbuild@v3

      # Identity name and publisher stay those of the earlier test player builds, so the
      # package family (and its LocalState with streams and md5 references) carries over.
      # Version 0.2.x outranks the 0.1.x packages built before this repository existed.
      - name: Create sideload certificate and stamp package identity
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Bale Development' `
            -KeyUsage DigitalSignature -FriendlyName 'rav1g Test Player Development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(1) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-Certificate -Cert $cert -FilePath out/Av1GpuTestPlayer.cer | Out-Null
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Name = 'Av1GpuTestPlayer'
          $manifest.Package.Identity.Publisher = $cert.Subject
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.0"
          $manifest.Package.Properties.DisplayName = 'rav1g Test Player'
          $manifest.Package.Properties.PublisherDisplayName = 'rav1g'
          $manifest.Package.Applications.Application.VisualElements.DisplayName = 'rav1g Test Player'
          $manifest.Package.Applications.Application.VisualElements.Description = 'rav1g D3D12 compute AV1 test player'
          $manifest.Save($path)

      # ---------------------------------------------------------------------------------------------
      # The player is C++ (testing/uwp_dx12_player, testing/uwp_common) on the functions of rav1g.h; the
      # decoder behind them is the Rust library of the Cargo workspace (docs/rust-port.md). Two packages
      # of the same identity per run. They differed in what compiled the C of the entropy decoder, which
      # is where the tile threads spent their time; since step 6 of docs/phase2-rav1d.md the library has
      # none of that C (its parser is rav1d's parse pass), and since its shader table became Rust it has
      # no C at all (docs/rust-port.md, "No C in the library"). What is left of the difference is how
      # the library is linked (docs/test-player.md):
      #   revision 0, the default: linked by lld-link into rav1g.dll, which is in the package next to
      #               the program;
      #   revision 2: a static library, linked into the program by the player's link
      #               (/LTCG:incremental).
      # Revision 1 is the opt-in uavsync package. Revision 3 is the default package
      # with the hevcPlayback capability in its manifest, for the memory the system gives such an app
      # (made from the default package, behind it). Revision 4 is the shader-pick package, with the
      # alternate DXC -Od bytecode for compiler diagnostics. A higher revision installs over a lower
      # one and keeps LocalState.
      # ---------------------------------------------------------------------------------------------

      # Stable Rust, as in the rust job, and the LLVM of the runner for the link of the default package.
      - name: Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install stable' }
          rustup default stable
          rustc --version
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          foreach ($tool in @('clang-cl.exe', 'lld-link.exe', 'llvm-lib.exe')) {
            if (-not (Test-Path (Join-Path $llvm $tool))) { throw "$tool is not in $llvm" }
          }
          & (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1

      # nasm: the Rust library has rav1d's parse pass, whose entropy decoder is assembly
      # (third_party/rav1d, docs/phase2-rav1d.md).
      - name: nasm
        uses: ./src/.github/actions/nasm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: player

      # The library as a DLL of its own, linked by lld-link. It became the default package when the
      # library had C that clang-cl compiled with full link time optimisation (LLVM bitcode, which the
      # player's link.exe cannot read; lld-link cannot link the player, whose objects are /GL and whose
      # link writes the Windows metadata of a C++/CX program: docs/rust-port.md, step 5, part 3). The
      # library has no C any more; the package stays as it is, rav1g.dll with the functions of rav1g.h,
      # and the player links its import library. WindowsApp.lib is first on that link, the runtime is
      # the app runtime (the store directory of the toolset): testing/uwp_dx12_player/build_rav1g_dll.ps1.
      - name: Rust library for the default package, linked by lld-link (rav1g.dll)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          & src/testing/uwp_dx12_player/build_rav1g_dll.ps1 -Shaders '${{ steps.shaders.outputs.dir }}' -Features 'capi,app-container' `
            -TargetDir target-app-clang -Out rust-clang
          "## Rust library for the default package, linked by lld-link", '', "cargo rustc: $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min ($(rustc --version); $(& (Join-Path $llvm 'lld-link.exe') --version | Select-Object -First 1))." >> $env:GITHUB_STEP_SUMMARY

      # What that rav1g.dll is built from, by language (the bar of the README): the source files this build
      # recorded (the dependency files of rustc, what the build scripts named to cargo, the shader sources
      # of the report), counted by testing/language_bar/language_bar.py. The job language-bar publishes
      # the two files for a push to main.
      - name: Languages of rav1g.dll
        # A measurement for the README: it never fails the packages of this job.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python src/testing/language_bar/language_bar.py --release-dir target-app-clang/x86_64-pc-windows-msvc/release `
            --shader-report shader-build/normal/report.json --out language-bar
          if ($LASTEXITCODE -ne 0) { throw 'The languages of rav1g.dll could not be measured' }

      - name: Preserve the languages of rav1g.dll
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-languages-${{ github.run_id }}
          path: |
            language-bar/languages.json
            language-bar/languages.svg
          if-no-files-found: error

      - name: Build the signed default package (Release x64, rav1g.dll linked by lld-link)
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          # /sdl promotes upstream's deprecated GetDesktopDpi call to C4996 even without /WX.
          # _CL_ appends this override after the project's compiler options; no source patch is needed.
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-clang'
          # Building the solution supplies SolutionDir to the include paths and builds both projects.
          # Clear the upstream committed PFX: signing must use only this run's certificate in the store.
          & MSBuild.exe src/av1xbox.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustDll=$library" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'Release x64 player build/package failed; see msbuild.log' }
          $packages = @(Get-ChildItem out/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No application sideload package was produced' }
          # -sm6test needs its shaders in the player: the bytecode of each is in the program of the package.
          python src/testing/sm6test/compile.py --verify sm6test-build @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package does not have the Shader Model 6 test shaders of this run' }
          # The DLLs the programs of the package (the player and rav1g.dll, which has to be in it) import
          # from, against the list of testing/uwp_imports: the API sets of WindowsApp.lib, the runtime of
          # VCLibs, DirectX; no kernel32.dll, no desktop runtime (docs/rust-port.md, "The app container").
          python -m pip install --quiet uv
          if ($LASTEXITCODE -ne 0) { throw 'uv could not be installed' }
          python src/testing/uwp_imports/check_package.py --out out/imports --need rav1g.dll --also rav1g.dll out/packages
          if ($LASTEXITCODE -ne 0) { throw 'A program of the package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt, or rav1g.dll is not in the package' }
          # Verify that the packaged DLL embeds the DXIL described by the compiler listings.
          python src/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal --note out/SHADERS.txt out/imports/unpacked/rav1g.dll
          if ($LASTEXITCODE -ne 0) { throw 'The rav1g.dll of the package was not built from the shader bytecode of this run' }
          Remove-Item out/imports/unpacked -Recurse -Force
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          $set = (Get-Content shader-build/normal/shader_set.txt -Raw).Trim()
          "Variant: default: the Rust library (rav1g.dll, $(rustc --version)), linked by $(& (Join-Path $llvm 'lld-link.exe') --version | Select-Object -First 1); no C (the parser is rav1d's parse pass, the shader table is Rust); shaders: $set; package version 0.2.$env:GITHUB_RUN_NUMBER.0" |
            Add-Content out/SOURCES.txt -Encoding utf8
          Copy-Item rust-clang/rav1g.pdb out/
          @('## rav1g test player', '', 'CI build only; console timings are taken separately.', '',
            "Two packages of the same player and the same identity (docs/test-player.md): this one, version 0.2.$env:GITHUB_RUN_NUMBER.0, the default, with the Rust library as rav1g.dll, linked by lld-link. Shaders: $set. 0.2.$env:GITHUB_RUN_NUMBER.2 with the Rust library linked statically by the player's link.", '',
            '```') + @($packages | ForEach-Object { $_.Name }) + @(Get-Content out/imports/check.txt) + @('```', '',
            '### Artifact files', '```') +
            @(Get-ChildItem out -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath((Resolve-Path out), $_.FullName) }) +
            @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve package, certificate, dependencies, licenses, shader listings, survey and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-x64-${{ github.run_id }}
          path: out/
          if-no-files-found: warn

      # The library of the default package by itself, as an application loads it (docs/integration.md):
      # rav1g.dll with its import library and its symbols. The job release publishes it for a tag.
      - name: Preserve rav1g.dll of the default package
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dll-x64-${{ github.run_id }}
          path: |
            rust-clang/rav1g.dll
            rust-clang/rav1g.dll.lib
            rust-clang/rav1g.pdb
          if-no-files-found: error

      # The hevcPlayback package: the default package of this run with one more line in its manifest,
      # <rescap:Capability Name="hevcPlayback"/>, the restricted capability of Microsoft's "4K video
      # playback for UWP apps on Xbox". An app that declares it gets more memory from the console than
      # the 1 GiB of the default package, in two pools; which pool the decoder's D3D12 buffers go to is
      # measured with this package and the default one, and the player's MEMORY pools line
      # (docs/test-player.md, "The two memory pools"). The default packages do not declare it, so that
      # the budget tests keep the 1 GiB case.
      # Not a build: the default package is unpacked, the manifest gets the capability and revision 3,
      # and MakeAppx and SignTool of the Windows SDK pack and sign it with the certificate of this run.
      # So the programs are those of the default package byte for byte, which
      # testing/uwp_package/capability_variant.py checks, as it checks that the default package does not
      # declare the capability. Same identity; revision 3 installs over the other packages of this run
      # and keeps LocalState, and the default package of a later run installs over it.
      # Here, behind the default package and in front of the other builds: their Rebuild of the solution
      # deletes the default package under out/packages.
      - name: Build the signed hevcPlayback package (the default package with the capability, revision 3)
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin\$env:WINDOWS_SDK\x64"
          $makeappx = Join-Path $sdkBin 'makeappx.exe'
          $signtool = Join-Path $sdkBin 'signtool.exe'
          foreach ($tool in @($makeappx, $signtool)) {
            if (-not (Test-Path $tool)) { throw "$tool of Windows SDK $env:WINDOWS_SDK not found" }
          }
          python src/testing/uwp_package/capability_variant.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'The self-test of capability_variant.py failed' }
          $found = @(Get-ChildItem out/packages -Recurse -File | Where-Object {
            $_.Extension -eq '.msix' -and $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if ($found.Count -ne 1) { throw "$($found.Count) default packages under out/packages, expected one" }
          $default = $found[0]
          $from = "_0.2.$env:GITHUB_RUN_NUMBER.0_"
          $to = "_0.2.$env:GITHUB_RUN_NUMBER.3_"
          if (-not $default.Name.Contains($from)) { throw "The default package $($default.Name) does not have the version of this run in its name" }
          # The directory of the default package without the package itself: the certificate, the
          # dependencies (VCLibs) and the install scripts, with the new version in their names.
          $directory = Join-Path $env:GITHUB_WORKSPACE "out-hevcplayback/packages/$($default.Directory.Name.Replace($from, $to))"
          New-Item -ItemType Directory -Force $directory | Out-Null
          foreach ($item in @(Get-ChildItem $default.Directory.FullName | Where-Object { $_.Extension -notin @('.msix', '.appxsym', '.msixsym') })) {
            Copy-Item $item.FullName (Join-Path $directory $item.Name.Replace($from, $to)) -Recurse
          }
          $unpacked = Join-Path $env:GITHUB_WORKSPACE 'hevcplayback-unpacked'
          $log = Join-Path $env:GITHUB_WORKSPACE 'out-hevcplayback/makeappx.log'
          & $makeappx unpack /p $default.FullName /d $unpacked /o | Out-File $log -Encoding utf8
          if ($LASTEXITCODE -ne 0) { Get-Content $log | Select-Object -Last 30; throw 'MakeAppx could not unpack the default package' }
          # What the packaging and the signing wrote into the default package: written anew for this one.
          foreach ($name in @('AppxBlockMap.xml', 'AppxSignature.p7x', '[Content_Types].xml', 'AppxMetadata\CodeIntegrity.cat')) {
            $file = Join-Path $unpacked $name
            if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
          }
          $metadata = Join-Path $unpacked 'AppxMetadata'
          if ((Test-Path -LiteralPath $metadata) -and -not @(Get-ChildItem -LiteralPath $metadata -Force).Count) {
            Remove-Item -LiteralPath $metadata -Force
          }
          python src/testing/uwp_package/capability_variant.py manifest --revision 3 --restricted hevcPlayback (Join-Path $unpacked 'AppxManifest.xml')
          if ($LASTEXITCODE -ne 0) { throw 'The manifest of the default package could not be given the capability' }
          $package = Join-Path $directory $default.Name.Replace($from, $to)
          & $makeappx pack /d $unpacked /p $package /o | Out-File $log -Encoding utf8 -Append
          if ($LASTEXITCODE -ne 0) { Get-Content $log | Select-Object -Last 30; throw 'MakeAppx could not pack the hevcPlayback package' }
          & $signtool sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT $package
          if ($LASTEXITCODE -ne 0) { throw 'SignTool could not sign the hevcPlayback package' }
          Remove-Item -LiteralPath $unpacked -Recurse -Force
          # The package is the default package with the capability and revision 3, and nothing else; and
          # the default package does not have the capability.
          python src/testing/uwp_package/capability_variant.py check --revision 3 --restricted hevcPlayback `
            --base out/packages --variant out-hevcplayback/packages --note out-hevcplayback/VARIANT.txt
          if ($LASTEXITCODE -ne 0) { throw 'The hevcPlayback package is not the default package with the capability and revision 3 alone, or the default package declares the capability' }
          python src/testing/uwp_imports/check_package.py --out out-hevcplayback/imports --need rav1g.dll --also rav1g.dll out-hevcplayback/packages
          if ($LASTEXITCODE -ne 0) { throw 'A program of the hevcPlayback package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt, or rav1g.dll is not in the package' }
          Remove-Item out-hevcplayback/imports/unpacked -Recurse -Force
          # The certificate, the notices and the record of the sources of the default package apply.
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'sm6test-shaders', 'imports', 'rav1g.pdb', 'SHADERS.txt') })) {
            Copy-Item $item.FullName out-hevcplayback/ -Recurse
          }
          (Get-Content out-hevcplayback/SOURCES.txt) -notmatch '^Variant: ' | Set-Content out-hevcplayback/SOURCES.txt -Encoding utf8
          "Variant: hevcPlayback: the default package of this run (0.2.$env:GITHUB_RUN_NUMBER.0, its programs byte for byte: VARIANT.txt) with the restricted capability hevcPlayback in its manifest; package version 0.2.$env:GITHUB_RUN_NUMBER.3. rav1g.pdb is in the artifact of the default package" |
            Add-Content out-hevcplayback/SOURCES.txt -Encoding utf8
          @('## hevcPlayback package', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.3: the default package with the restricted capability hevcPlayback; installs over the other packages of this run.", '', '```',
            (Split-Path $package -Leaf)) + @(Get-Content out-hevcplayback/VARIANT.txt) + @(Get-Content out-hevcplayback/imports/check.txt) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the hevcPlayback package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-hevcplayback-x64-${{ github.run_id }}
          path: out-hevcplayback/
          if-no-files-found: warn

      # The alternative package (docs/rust-port.md, "The C runtime"): the static library with the interface
      # for C, for the DLL runtime, linked into the program by the player's link. (It had the C of the
      # library compiled by MSVC with /GL; the library has no C any more.)
      - name: Rust library for the alternative package, linked by the player (static library)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $separator = [char]0x1f
          $env:CARGO_ENCODED_RUSTFLAGS = "-Ctarget-feature=-crt-static${separator}--cfg${separator}windows_slim_errors"
          New-Item -ItemType Directory -Force rust-msvc | Out-Null
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo build --manifest-path src/Cargo.toml --release --locked -p rav1g --lib --features capi,app-container `
            --target-dir target-app-msvc
          if ($LASTEXITCODE -ne 0) { throw 'cargo build of the library failed' }
          Copy-Item target-app-msvc/release/rav1g.lib rust-msvc/
          # Without the import members for desktop DLLs (kernel32.dll, ...) that the windows crates put
          # into the library: link.exe would take the functions of Windows from them.
          python src/testing/uwp_imports/prune_import_members.py --ar (Join-Path $env:ProgramFiles 'LLVM\bin\llvm-ar.exe') rust-msvc/rav1g.lib
          if ($LASTEXITCODE -ne 0) { throw 'The import members could not be taken out of rav1g.lib' }
          Get-ChildItem rust-msvc | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
          "## Rust library for the alternative package, static library", '', "cargo build: $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min ($(rustc --version))." >> $env:GITHUB_STEP_SUMMARY

      - name: Stamp the alternative package, static library (same identity, revision 2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.2"
          $manifest.Save($path)

      - name: Build the signed alternative package (rav1g.lib, linked by the player)
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-msvc | Out-Null
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out-msvc/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out-msvc/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-msvc'
          & MSBuild.exe src/av1xbox.sln /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustLib=$library" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'The player with the static Rust library did not build; see out-msvc/msbuild.log' }
          $packages = @(Get-ChildItem out-msvc/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No sideload package with the static Rust library was produced' }
          # The Rust library has the shaders of this run: their bytecode is in the program of the package.
          python src/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal --note out-msvc/SHADERS.txt @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package with the static Rust library was not built from the shader bytecode of this run' }
          python src/testing/sm6test/compile.py --verify sm6test-build @($packages | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'The package does not have the Shader Model 6 test shaders of this run' }
          python src/testing/uwp_imports/check_package.py --out out-msvc/imports out-msvc/packages
          if ($LASTEXITCODE -ne 0) { throw 'The program of the package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt' }
          Remove-Item out-msvc/imports/unpacked -Recurse -Force
          # The certificate, the notices and the record of the sources of the default package apply.
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'sm6test-shaders', 'imports', 'rav1g.pdb', 'SHADERS.txt') })) {
            Copy-Item $item.FullName out-msvc/ -Recurse
          }
          (Get-Content out-msvc/SOURCES.txt) -notmatch '^Variant: ' | Set-Content out-msvc/SOURCES.txt -Encoding utf8
          "Variant: alternative: the Rust library (static, $(rustc --version)), linked by the player's link (/LTCG:incremental); no C (the parser is rav1d's parse pass, the shader table is Rust); package version 0.2.$env:GITHUB_RUN_NUMBER.2" |
            Add-Content out-msvc/SOURCES.txt -Encoding utf8
          @('## Alternative package: static Rust library, linked by the player', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.2: installs over 0.2.$env:GITHUB_RUN_NUMBER.0.", '', '```') +
            @($packages | ForEach-Object { $_.Name }) + @(Get-Content out-msvc/imports/check.txt) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the alternative package (static library)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-msvc-x64-${{ github.run_id }}
          path: out-msvc/
          if-no-files-found: warn

      # The uavsync package: the default package with every group sync of the shaders compiled as a sync
      # of all memory (AllMemoryBarrierWithGroupSync): rav1g.dll built from the shader bytecode of the
      # uavsync variant of the Shaders step, with the uavsync feature of the crates, which makes the
      # library say which shaders it has. An experiment for a device on which a frame buffer store of one
      # thread is not seen by another thread of the group behind a sync of the group memory alone
      # (docs/test-player.md, "Experiments"). Same identity as the default package and revision 1 instead
      # of 0: it installs over the default package of this run and keeps its LocalState, and the default
      # package of a later run installs over it.
      - name: DXC shaders with all-memory group syncs
        if: ${{ inputs.experiments }}
        id: uavsync-shaders
        uses: ./src/.github/actions/shaders
        with:
          repo: src
          sdk: ${{ env.WINDOWS_SDK }}
          variant: uavsync

      - name: Rust library for the uavsync package (rav1g.dll with the uavsync shaders)
        if: ${{ inputs.experiments }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & src/testing/uwp_dx12_player/build_rav1g_dll.ps1 -Shaders '${{ steps.uavsync-shaders.outputs.dir }}' -Features 'capi,app-container,uavsync' `
            -TargetDir target-app-uavsync -Out rust-uavsync

      - name: Stamp the uavsync package (same identity, revision 1)
        if: ${{ inputs.experiments }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.1"
          $manifest.Save($path)

      - name: Build the signed uavsync package (all-memory group syncs)
        if: ${{ inputs.experiments }}
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-uavsync | Out-Null
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out-uavsync/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out-uavsync/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-uavsync'
          & MSBuild.exe src/av1xbox.sln /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustDll=$library" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'uavsync player build/package failed; see out-uavsync/msbuild.log' }
          $packages = @(Get-ChildItem out-uavsync/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No uavsync sideload package was produced' }
          python src/testing/uwp_imports/check_package.py --out out-uavsync/imports --need rav1g.dll --also rav1g.dll out-uavsync/packages
          if ($LASTEXITCODE -ne 0) { throw 'A program of the uavsync package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt, or rav1g.dll is not in the package' }
          if ((Get-FileHash shader-build/normal/dx/shaders/dxil/loopfilter_hor.dxil).Hash -eq
              (Get-FileHash shader-build/uavsync/dx/shaders/dxil/loopfilter_hor.dxil).Hash) {
            throw 'The uavsync build did not change the group barrier bytecode'
          }
          # Verify the uavsync bytecode in the packaged DLL.
          python src/testing/shader_cache/shaders.py verify --report shader-build/uavsync/report.json `
            --root shader-build/uavsync --note out-uavsync/SHADERS.txt out-uavsync/imports/unpacked/rav1g.dll
          if ($LASTEXITCODE -ne 0) { throw 'The rav1g.dll of the uavsync package was not built from the uavsync shader bytecode of this run' }
          Remove-Item out-uavsync/imports/unpacked -Recurse -Force
          # The certificate, the notices and the record of the sources of the default package apply.
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'sm6test-shaders', 'imports', 'rav1g.pdb', 'SHADERS.txt') })) {
            Copy-Item $item.FullName out-uavsync/ -Recurse
          }
          (Get-Content out-uavsync/SOURCES.txt) -notmatch '^Variant: ' | Set-Content out-uavsync/SOURCES.txt -Encoding utf8
          "Variant: uavsync: the default build (rav1g.dll, linked by lld-link) with the shaders compiled with GroupMemoryBarrierWithGroupSync=AllMemoryBarrierWithGroupSync; package version 0.2.$env:GITHUB_RUN_NUMBER.1" |
            Add-Content out-uavsync/SOURCES.txt -Encoding utf8
          Copy-Item rust-uavsync/rav1g.pdb out-uavsync/
          @('## uavsync package', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.1: installs over 0.2.$env:GITHUB_RUN_NUMBER.0.", '', '```') +
            @($packages | ForEach-Object { $_.Name }) + @(Get-Content out-uavsync/imports/check.txt) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the uavsync package
        if: ${{ always() && inputs.experiments }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-uavsync-x64-${{ github.run_id }}
          path: out-uavsync/
          if-no-files-found: warn

      # Revision 4 keeps the existing package identity and artifact name for compiler diagnostics.
      # It embeds the alternate DXC -Od bytecode alongside the default DXIL.
      - name: Shader-pick bytecodes
        id: pick-shaders
        uses: ./src/.github/actions/shaders
        with:
          repo: src
          sdk: ${{ env.WINDOWS_SDK }}
          variant: shader-pick

      - name: Rust library for the shader-pick package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & src/testing/uwp_dx12_player/build_rav1g_dll.ps1 -Shaders '${{ steps.pick-shaders.outputs.dir }}' -Features 'capi,app-container,shader-pick' `
            -TargetDir target-app-clang -Out rust-dxc

      - name: Stamp the shader-pick package (same identity, revision 4)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path src/testing/uwp_dx12_player/Package.appxmanifest
          [xml]$manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = "0.2.$env:GITHUB_RUN_NUMBER.4"
          $manifest.Save($path)

      - name: Build the signed shader-pick package
        shell: pwsh
        env:
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          _CL_: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out-dxc | Out-Null
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'out-dxc/packages/'
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out-dxc/msbuild.log'
          $library = Join-Path $env:GITHUB_WORKSPACE 'rust-dxc'
          & MSBuild.exe src/av1xbox.sln /t:Rebuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 /p:TreatWarningAsError=false `
            /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxPackageExtension=.msix "/p:AppxPackageDir=$packageDirectory" `
            /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile= `
            "/p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT" "/p:Rav1gRustDll=$library" `
            "/p:Rav1gSm6TestShaders=${{ steps.sm6.outputs.dir }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'Shader-pick player build/package failed; see out-dxc/msbuild.log' }
          $packages = @(Get-ChildItem out-dxc/packages -Recurse -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.appx', '.appxbundle') -and
            $_.FullName -notmatch '[\\/]Dependencies[\\/]'
          })
          if (-not $packages.Count) { throw 'No shader-pick sideload package was produced' }
          python src/testing/uwp_imports/check_package.py --out out-dxc/imports --need rav1g.dll --also rav1g.dll out-dxc/packages
          if ($LASTEXITCODE -ne 0) { throw 'A program of the shader-pick package imports from a DLL that is not in testing/uwp_imports/player-dlls-allow.txt, or rav1g.dll is not in the package' }
          # Verify both bytecode sets in the packaged DLL.
          python src/testing/shader_cache/shaders.py verify --report shader-build/shader-pick/report.json `
            --root shader-build/shader-pick --note out-dxc/SHADERS.txt out-dxc/imports/unpacked/rav1g.dll
          if ($LASTEXITCODE -ne 0) { throw 'The rav1g.dll of the shader-pick package was not built from the DXC shader bytecode of this run' }
          $set = (Get-Content shader-build/shader-pick/shader_set.txt -Raw).Trim()
          Remove-Item out-dxc/imports/unpacked -Recurse -Force
          # The certificate, the notices and the record of the sources of the default package apply.
          foreach ($item in @(Get-ChildItem out | Where-Object { $_.Name -notin @('packages', 'msbuild.log', 'shader-survey',
              'sm6test-shaders', 'imports', 'rav1g.pdb', 'SHADERS.txt') })) {
            Copy-Item $item.FullName out-dxc/ -Recurse
          }
          # Listings and compiler report for both sets.
          New-Item -ItemType Directory -Force out-dxc/dxc-shaders | Out-Null
          Copy-Item shader-build/shader-pick/asm out-dxc/dxc-shaders/asm -Recurse
          Copy-Item shader-build/shader-pick/report.json out-dxc/dxc-shaders/build.json
          Copy-Item shader-build/shader-pick/shader_sets.txt out-dxc/dxc-shaders/
          $report = Get-Content shader-build/shader-pick/report.json -Raw | ConvertFrom-Json
          (Get-Content out-dxc/SOURCES.txt) -notmatch '^Variant: ' | Set-Content out-dxc/SOURCES.txt -Encoding utf8
          "Variant: shader-pick: the default build (rav1g.dll, linked by lld-link) with an alternate DXC -Od shader set. Package version 0.2.$env:GITHUB_RUN_NUMBER.4.",
            "The task flag -shaderpick od=<list>,dxc=<list> selects bytecode per shader (docs/test-player.md, 'Shader pick'). The default set is dxc." |
            Add-Content out-dxc/SOURCES.txt -Encoding utf8
          Get-Content shader-build/shader-pick/shader_sets.txt | ForEach-Object { "  $_" } | Add-Content out-dxc/SOURCES.txt -Encoding utf8
          Copy-Item rust-dxc/rav1g.pdb out-dxc/
          @('## Shader-pick package', '', "Version 0.2.$env:GITHUB_RUN_NUMBER.4: installs over the other packages of this run. Shaders: $set, ``dxc $($report.arguments)``.", '', '```') +
            @($packages | ForEach-Object { $_.Name }) + @(Get-Content out-dxc/imports/check.txt) + @('```') >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the shader-pick package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-testplayer-dxc-x64-${{ github.run_id }}
          path: out-dxc/
          if-no-files-found: warn

  # The streams of the conformance run: AOM's decoder test vectors with AOM's md5 files, cuts of
  # Netflix Open Content and streams encoded here with SVT-AV1, both with md5 references from dav1d
  # (testing/conformance/streams.txt, prepare_streams.sh). The streams are media: they are kept in
  # the Actions cache, keyed by the list and the scripts that make them, and never in the repository
  # or in an artifact. The artifact of this job has the md5 references and the task list only.
  conformance-streams:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
      shader_pick: ${{ steps.coverage.outputs.shader_pick }}
      parser_switches: ${{ steps.coverage.outputs.parser_switches }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Diff the whole push, including pushes with multiple commits. If the old commit is
      # unavailable (e.g. a new branch or a force push), run both sets of checks.
      - name: Select special-case checks
        id: coverage
        env:
          BEFORE: ${{ github.event.before }}
          RUN_ALL_PATH_CHECKS: ${{ github.event_name != 'push' || github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          base=
          if [[ "$RUN_ALL_PATH_CHECKS" != true && "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" =~ [1-9a-f] ]]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE"; then
              base=$BEFORE
            fi
          fi
          changed() {
            if [[ -n "$base" ]] && git diff --quiet "$base" "$GITHUB_SHA" -- "$@"; then
              echo false
            else
              echo true
            fi
          }
          shared=(
            .github/workflows/build.yml Cargo.toml Cargo.lock crates/rav1g/Cargo.toml
            crates/rav1g/src/capi.rs crates/rav1g/src/switches.rs crates/rav1g/include/rav1g.h
            tools/rav1g-dec/Cargo.toml tools/rav1g-dec/src/{args,library,main}.rs
            testing/player_common/{cmd_parser,decoder_creator}.cpp
            testing/conformance/{run.py,player_smoke.py,streams.txt,expected.txt}
          )
          shader_pick=$(changed "${shared[@]}" .github/actions/shaders libav1/dx/shaders \
            crates/rav1g-sys/{Cargo.toml,build.rs,shaders.txt,src/lib.rs,src/shaders.rs} crates/rav1g/src/device.rs \
            crates/rav1g/src/host/{compute,frame,shader_pick}.rs testing/shader_cache)
          parser_switches=$(changed "${shared[@]}" crates/rav1g-parse third_party/rav1d \
            tools/rav1g-parse-check tools/rav1g-dec/src/run.rs testing/stage_dump \
            testing/conformance/{cut_tile_check.py,dump_tasks.txt} crates/rav1g/src/decoder.rs \
            crates/rav1g/src/host/rav1d_host.rs crates/rav1g/src/host/rav1d_frames.rs \
            crates/rav1g/src/host/blocks.rs crates/rav1g/src/host/completion.rs \
            crates/rav1g/src/host/create.rs crates/rav1g/src/host/frame.rs crates/rav1g/src/host/types.rs \
            crates/rav1g/src/host/pool.rs crates/rav1g/src/host/grid_check.rs crates/rav1g/src/host/gpu_pred_lists.rs)
          {
            echo "shader_pick=$shader_pick"
            echo "parser_switches=$parser_switches"
          } >> "$GITHUB_OUTPUT"

      - name: Cache key
        id: key
        run: echo "key=conformance-streams-v1-${{ hashFiles('testing/conformance/streams.txt', 'testing/conformance/prepare_streams.sh', 'testing/md5ref/make_md5_ref.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Streams from the cache
        id: streams
        uses: actions/cache@v6
        with:
          path: conformance-streams
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: Fetch and make the streams and their md5 references
        if: steps.streams.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          sh testing/conformance/prepare_streams.sh conformance-streams 2>&1 | grep -v '^Svt\[info\]' | tee prepare.log

      - name: Collect the md5 references (no media)
        run: |
          set -euo pipefail
          mkdir conformance-md5
          cp conformance-streams/manifest.txt conformance-streams/SOURCES.txt conformance-md5/
          (cd conformance-streams && find . -name '*.md5' | while read -r f; do
            mkdir -p "../conformance-md5/$(dirname "$f")" && cp "$f" "../conformance-md5/$f"; done)
          {
            echo '## Conformance streams'
            echo
            echo "- $(grep -c . conformance-streams/manifest.txt) streams, $(du -sh conformance-streams | cut -f1) (cache \`${{ steps.key.outputs.key }}\`, hit: ${{ steps.streams.outputs.cache-hit == 'true' }})"
            echo '```'
            cat conformance-streams/SOURCES.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the md5 references and the task list
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-conformance-md5-${{ github.run_id }}
          path: conformance-md5/
          if-no-files-found: error

  # The equality reference (docs/rust-port.md, "Equality reference"): warp_decoder, the desktop program of
  # the C++ decoder, built from branch cpp at the commit CPP_REFERENCE_COMMIT names, with the shaders of
  # that commit. It decodes the conformance set, writes the stage dumps and the MEMORY lines with the
  # scripts, the streams and the task lists of this commit, and the rust-equal job holds what rav1g-dec
  # wrote against it. The C++ decoder itself is tested by the workflow of its own branch; here it is only
  # the second implementation the Rust decoder has to agree with. rust-equal holds the shared
  # shaders equal with explicit exceptions for the readers of the packed mode info record.
  cpp-reference:
    needs: conformance-streams
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLATFORM_TOOLSET: v145
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the C++ decoder (branch cpp at the pinned commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CPP_REFERENCE_COMMIT }}
          path: cpp-reference
          persist-credentials: false

      - uses: microsoft/setup-msbuild@v3

      # Build the pinned C++ decoder with its own FXC shader action.
      - name: Shaders of the C++ decoder
        id: shaders
        uses: ./cpp-reference/.github/actions/shaders
        with:
          repo: cpp-reference
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Build warp_decoder of the C++ decoder (desktop, Release x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          $commit = git -C cpp-reference rev-parse HEAD
          if ($commit -ne $env:CPP_REFERENCE_COMMIT) { throw "cpp-reference is at $commit, not at $env:CPP_REFERENCE_COMMIT" }
          $buildLog = Join-Path $env:GITHUB_WORKSPACE 'out/msbuild.log'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          & MSBuild.exe cpp-reference/testing/warp_decoder/warp_decoder.vcxproj /m /v:minimal /p:Configuration=Release /p:Platform=x64 `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET" "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK" `
            "/p:Rav1gPrebuiltShaders=${{ steps.shaders.outputs.normal }}" `
            /fl "/flp:logfile=$buildLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'warp_decoder build failed; see msbuild.log' }
          $bin = 'cpp-reference/testing/warp_decoder/bin/x64/Release'
          if (-not (Test-Path "$bin/warp_decoder.exe")) { throw 'warp_decoder.exe was not produced' }
          # Built from the headers of the Shaders step: MSBuild ran FXC on no shader, and their bytecode
          # is in the program.
          if (Select-String -Path $buildLog -Pattern 'fxc\.exe.*[\\/]dx[\\/]shaders[\\/]' -Quiet) {
            throw 'MSBuild compiled the shaders itself: Rav1gPrebuiltShaders was not in effect'
          }
          python cpp-reference/testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal "$bin/warp_decoder.exe"
          if ($LASTEXITCODE -ne 0) { throw 'warp_decoder was not built from the shader headers of the pinned commit' }
          New-Item -ItemType Directory -Force out/warp_decoder, out/shaders | Out-Null
          Copy-Item "$bin/warp_decoder.exe" out/warp_decoder/
          # Record which shaders the reference used.
          Copy-Item shader-build/normal/report.json out/shaders/report.json
          "Commit: $commit (branch cpp of https://github.com/$env:GITHUB_REPOSITORY)",
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: Release x64; PlatformToolset=$env:PLATFORM_TOOLSET; Windows SDK=$env:WINDOWS_SDK" |
            Set-Content out/SOURCES.txt -Encoding utf8
          "## Equality reference: warp_decoder of the C++ decoder", '',
            "Branch cpp at ``$commit``: $(git -C cpp-reference log -1 --format=%s). Built in $([math]::Round($clock.Elapsed.TotalMinutes, 1)) min.", '' >> $env:GITHUB_STEP_SUMMARY

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # Every stream of the set, for the md5 of every output frame. The C++ decoder has to give the results
      # of expected.txt as well: a reference that is wrong itself is no reference.
      - name: Decode every stream on WARP with the C++ decoder
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --out out/conformance --threads 4 "--title=warp_decoder of branch cpp (the equality reference)"
          if ($LASTEXITCODE -ne 0) { throw "conformance run of the reference: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # Stage dumps (testing/conformance/dump_tasks.txt): the buffers behind every GPU stage of a few
      # frames, as the C++ decoder's shaders wrote them on WARP. Dumps of the vectors and of the streams
      # encoded here; of the cuts of published streams only digests (hashes), never samples.
      - name: Stage dumps of the frames in dump_tasks.txt with the C++ decoder
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/stage_dump/ci_dumps.py --tool out/warp_decoder/warp_decoder.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps --threads 4
          if ($LASTEXITCODE -ne 0) { throw "stage dumps of the reference: exit code $LASTEXITCODE" }

      # The MEMORY lines of the decoder (testing/conformance/memory_lines.py): what a decoder of a few
      # configurations holds, its budget line and the steps of its release.
      - name: MEMORY log lines of a few decoder configurations with the C++ decoder
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/memory_lines.py run --tool out/warp_decoder/warp_decoder.exe `
            --streams conformance-streams --out out/memory-lines
          if ($LASTEXITCODE -ne 0) { throw "memory lines of the reference: exit code $LASTEXITCODE" }

      - name: Preserve the stage dumps of the reference
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-cpp-reference-stage-dumps-${{ github.run_id }}
          path: out/stage-dumps/
          if-no-files-found: warn

      - name: Preserve the results, the per-stream logs and md5 files, the MEMORY lines and the build log of the reference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-cpp-reference-${{ github.run_id }}
          path: |
            out/conformance/
            out/memory-lines/
            out/shaders/
            out/SOURCES.txt
            out/msbuild.log
          if-no-files-found: warn

  # The decoder as a desktop console program (docs/rust-port.md): the Cargo workspace builds the Rust library
  # (its parser is rav1d's parse pass; crates/rav1g-sys embeds the shader table from the DXC bytecode of
  # the Shaders step, and no C of libaom) and rav1g-dec (tools/rav1g-dec) with MSVC. This job builds the program once, runs the unit tests
  # and the Shader Model 6 test, and keeps the program as an artifact. The jobs behind it take the program
  # from there and run side by side, each on its own runner, every check on the D3D12 WARP software adapter
  # (docs/warp-decoder.md, "The jobs of a push"):
  #   rust-conformance  the set through the Rust interface and through rav1g.h, the test player's decoder
  #                     code, the parse digest, decode errors, the order check, the memory check, the timing
  #                     smoke test, the stage dumps and the MEMORY lines;
  #   rust-switches     the other side of the decoder's switches: the poisoned buffers, the fast inter
  #                     path, the clears on the decode thread, the switches of rav1d's parse;
  #   rust-sinkgrid     the mode info grid written by the parse;
  #   rust-clears       the clears of a pipeline slot: who clears what without a flag (nobody), and the
  #                     ways that clear the wavefront grid, by the GPU and by the completion thread;
  #   rust-dumps-equal  the stage dumps they wrote, held against each other;
  #   rust-experiments  only when the workflow is started for it.
  # The rust-equal job then holds the md5 per frame and the stage dumps of rust-conformance against those
  # of the C++ decoder (cpp-reference), whose parser is the entropy decoder of libaom: the decoder has
  # none of that C any more (docs/phase2-rav1d.md, step 6), and the C++ decoder at its pin is where it
  # is still held against it.
  rust:
    needs: conformance-streams
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same cache and keys as the player job: the same bytecode.
      - name: Shaders
        id: shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Shader Model 6 test shaders
        id: sm6
        uses: ./.github/actions/sm6test-shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      # Stable Rust (the minimum supported version is the latest stable).
      - name: Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install stable' }
          rustup default stable
          rustc --version
          cargo --version

      # nasm, for the assembly of rav1d's parse pass (third_party/rav1d).
      - name: nasm
        uses: ./.github/actions/nasm

      - uses: Swatinem/rust-cache@v2

      - name: Build rav1g-dec (cargo, MSVC, release)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.dir }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/rav1g-dec | Out-Null
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          $built = [math]::Round($clock.Elapsed.TotalMinutes, 1)
          if (-not (Test-Path target/release/rav1g-dec.exe)) { throw 'rav1g-dec.exe was not produced' }
          # Built from the bytecode of the Shaders step: it is in the program, byte for byte.
          python testing/shader_cache/shaders.py verify --report shader-build/normal/report.json `
            --root shader-build/normal target/release/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'rav1g-dec was not built from the shader bytecode of this run' }
          python testing/sm6test/compile.py --verify sm6test-build target/release/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'rav1g-dec does not have the Shader Model 6 test shaders of this run' }
          Copy-Item target/release/rav1g-dec.exe, target/release/rav1g_dec.pdb -Destination out/rav1g-dec/
          # Binary redistribution retains the BSD notices and AOM patent license, including libwebm and
          # rav1d (the library has rav1d's parse pass, third_party/rav1d), and the MIT and Apache-2.0
          # notices of the crates the library links (third_party/rust-crates/NOTICES.txt, which the
          # rust-cross job holds against Cargo.lock).
          foreach ($license in @('LICENSE.txt', 'libav1/LICENSE', 'libav1/PATENTS',
              'third_party/libwebm/LICENSE.TXT', 'third_party/libwebm/PATENTS.TXT',
              'third_party/rav1d/COPYING', 'third_party/rav1d/doc/PATENTS',
              'third_party/rust-crates/NOTICES.txt')) {
            $destination = Join-Path out/rav1g-dec/licenses $license
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item $license $destination
          }
          "Commit: $env:GITHUB_SHA", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: cargo build --release, $(rustc --version), MSVC" |
            Set-Content out/rav1g-dec/SOURCES.txt -Encoding utf8
          "## rav1g-dec", '', "cargo build --release: $built min ($(rustc --version)).", '' >> $env:GITHUB_STEP_SUMMARY

      # The unit tests of the workspace (the md5 of rav1g-dec, its argument parser) and the layout tests of
      # the records (crates/rav1g-sys/src/layout_tests.rs): MB_MODE_INFO of crates/rav1g-sys/src/records.rs
      # against the struct the shaders read it with (dx/shaders/mode_info.h). The sizes and offsets of the
      # records themselves are constant assertions there: a build that has them wrong does not compile.
      - name: Tests (cargo test)
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.dir }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          cargo test --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }

      # Shader Model 6 test (docs/test-player.md): what WARP reports about itself (CAPS lines) and the test
      # shaders run on it (SM6TEST lines), for reference next to the console's. What WARP does with a shader
      # is a result and never fails the job: a pipeline state it refuses (PSO FAILED) and values that differ
      # (FAIL, with a warning on the run). The job fails when the test itself breaks: the program ends with
      # an error, a test has no result line, the report is missing.
      - name: Shader Model 6 test on WARP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/sm6test | Out-Null
          & out/rav1g-dec/rav1g-dec.exe -sm6test > out/sm6test/warp.log
          $code = $LASTEXITCODE
          $lines = @(Get-Content out/sm6test/warp.log)
          $shown = @($lines | Where-Object { $_ -match '^(ADAPTER|CAPS|SM6TEST) ' })
          @('## Shader Model 6 test on WARP', '', '```') + $shown + @('```', '') >> $env:GITHUB_STEP_SUMMARY
          $shown | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "rav1g-dec -sm6test: exit code $code (2: the test could not run its shaders; see the SM6TEST lines)" }
          $expected = @((Get-Content sm6test-build/report.json -Raw | ConvertFrom-Json).shaders).Count
          $results = @($lines | Where-Object { $_ -match '^SM6TEST \S+: (PASS|FAIL|PSO FAILED|NOT BUILT)' })
          if ($results.Count -ne $expected) { throw "$($results.Count) result lines for $expected test shaders" }
          if (-not @($lines | Where-Object { $_ -match '^SM6TEST summary: ' }).Count) { throw 'No SM6TEST summary line' }
          if (@($lines | Where-Object { $_ -match '^CAPS ' }).Count -lt 15) { throw 'The capability report is not complete' }
          foreach ($needed in @('^CAPS shader model: ', '^CAPS options1: ', '^CAPS options4: ', '^CAPS wave size: ')) {
            if (-not @($lines | Where-Object { $_ -match $needed }).Count) { throw "No line $needed in the capability report" }
          }
          $failed = @($results | Where-Object { $_ -match '^SM6TEST \S+: FAIL' })
          foreach ($line in $failed) { Write-Host "::warning title=Shader Model 6 test on WARP::$line" }

      # rav1g-dec with the shaders of the uavsync package, for the rust-experiments job: the uavsync feature
      # of the crates and the shader bytecode of that variant.
      - name: DXC shaders with all-memory group syncs
        if: ${{ inputs.experiments }}
        id: uavsync-shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}
          variant: uavsync

      - name: Build rav1g-dec with the shaders of the uavsync package
        if: ${{ inputs.experiments }}
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.uavsync-shaders.outputs.dir }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p rav1g-dec --features uavsync --target-dir target-uavsync
          if ($LASTEXITCODE -ne 0) { throw 'cargo build of rav1g-dec with the uavsync shaders failed' }
          New-Item -ItemType Directory -Force out/rav1g-dec-uavsync | Out-Null
          Copy-Item target-uavsync/release/rav1g-dec.exe out/rav1g-dec-uavsync/
          python testing/shader_cache/shaders.py verify --report shader-build/uavsync/report.json `
            --root shader-build/uavsync out/rav1g-dec-uavsync/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'The uavsync rav1g-dec was not built from the uavsync shader bytecode of this run' }

      - name: Preserve the log of the Shader Model 6 test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-sm6test-${{ github.run_id }}
          path: out/sm6test/
          if-no-files-found: warn

      - name: Preserve rav1g-dec.exe with the shaders of the uavsync package
        if: ${{ inputs.experiments }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-uavsync-x64-${{ github.run_id }}
          path: out/rav1g-dec-uavsync/
          if-no-files-found: error

      # The program every job behind this one runs.
      - name: Preserve rav1g-dec.exe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec/
          if-no-files-found: warn

  # Conformance run of the decoder: rav1g-dec of the rust job decodes every stream of the set on the D3D12
  # WARP software adapter of the runner and compares the md5 of every output frame with the reference.
  # testing/conformance/expected.txt lists the streams that fail today; a pass fails on a failure that is
  # not listed, on a failure of another kind than listed, on a crash or timeout that is not listed, and
  # when a listed stream passes. Then the checks that need no second parser and no switch: the set through
  # rav1g.h, the test player's decoder code, the parse digest, decode errors, the order check, the memory
  # check, the timing smoke test, the stage dumps and the MEMORY lines.
  rust-conformance:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [conformance, lifecycle]
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The decoder code of the test player (testing/player_common), run as the player runs it: its task
      # file, its decoder creation with a device and no queue, its output pool, its md5 check, through
      # rav1g.h on the Rust library: the files and the functions the packages of the player job have. The
      # player itself is a UWP app and does not run here; rav1g-dec -playersmoke is the part of it that
      # uses the decoder (testing/conformance/player_smoke.py). Every task has to end with "MD5 is OK", the
      # log must name the Rust library and have no error line, and the launch has to end, also without a
      # task file.
      - name: The test player's decoder code through rav1g.h on the Rust library (rav1g-dec -playersmoke)
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/player_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke "--title=the Rust library (cargo, MSVC)"
          if ($LASTEXITCODE -ne 0) { throw "the player's decoder code on the Rust library: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      # Every stream of the set, against its reference and expected.txt. The decoder of a task that names
      # no parser reads its stream with the parse pass of rav1d and the two switches that are on by
      # default (docs/phase2-rav1d.md): this run and every check below that names no parser are checks of
      # that parser, and the run has to say so. It also has to say that the clears of a pipeline slot are
      # nowhere, the default: the wavefront of intra prediction is kept at the edges of the tiles (the
      # rust-clears job has the runs with -gpuclear, -cpuclear and -syncclear).
      - name: Decode every stream on WARP with rav1g-dec and compare with expected.txt
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance --threads 4 "--title=rav1g-dec (cargo, MSVC)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance/lists/run001.log -Pattern '^PARSER .*the parse pass of rav1d.*switches nolfmask,tilethread,gpucdef,gpugrid \(' -Quiet)) {
            throw 'The decoder of this run does not report the parse pass of rav1d with its default switches'
          }
          if (-not (Select-String -Path out/conformance/lists/run001.log -Pattern '^SHADERS normal build \(DXC .+ cs_6_0\)' -Quiet)) {
            throw 'The default decoder did not report DXC cs_6_0 shaders'
          }
          if (-not (Select-String -Path out/conformance/lists/run001.log -Pattern ', clears none needed, ' -Quiet)) {
            throw 'The decoder of this run does not report that no clears are needed'
          }
          if ($code -ne 0) { throw "conformance run with rav1g-dec: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # The parser of phase 2 in this build (docs/phase2-rav1d.md): rav1d's parse pass on every stream,
      # with four threads, and what it read folded into a number per stream. The parse-digest job holds
      # the lines against those of the Linux build (parse-check).
      - name: Parse digest of every stream, rav1d's parse pass in rav1g-dec (-parsedigest)
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/parse-digest | Out-Null
          $tool = Resolve-Path out/rav1g-dec/rav1g-dec.exe
          Push-Location conformance-streams
          & $tool -parsedigest -t 4 -list manifest.txt > ../out/parse-digest/digest.txt
          $code = $LASTEXITCODE
          Pop-Location
          $lines = @(Select-String -Path out/parse-digest/digest.txt -Pattern '^PARSEDIGEST ').Count
          "## Parse digest, rav1g-dec (cargo, MSVC)", '', "$lines streams, exit code $code." >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { Get-Content out/parse-digest/digest.txt | Select-Object -Last 20; throw "rav1g-dec -parsedigest: exit code $code" }

      - name: Preserve the parse digests of the MSVC build
        if: ${{ always() && matrix.suite == 'conformance' }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-parse-digest-msvc-${{ github.run_id }}
          path: out/parse-digest/
          if-no-files-found: warn

      # The interface for C (docs/rust-port.md, step 5): the whole set once more with -capi, which uses
      # the decoder through the functions of rav1g.h (the device, the settings, the output callbacks, the
      # frames), as the UWP test player and every application that is not Rust does.
      - name: Decode every stream on WARP through rav1g.h (rav1g-dec -capi)
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-capi --threads 4 "--tool-args=-capi" "--title=rav1g-dec through rav1g.h (-capi)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance-capi/lists/run001.log -Pattern '^INTERFACE .*rav1g\.h' -Quiet)) {
            throw 'The decoder of this run does not report the interface for C'
          }
          if ($code -ne 0) { throw "conformance run with rav1g-dec -capi: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # A decode error in the middle of a stream (testing/conformance/cut_tile_check.py): the tile data of
      # one temporal unit of two streams of the set cut short (one tile, eight tiles), which fails behind
      # the frame's setup and before its submission. The task ends with the error, with the frames before
      # it right, and the stream behind it in the same process decodes right; with -continue_on_error the
      # same decoder is given the rest of the stream, and the frames from the next key frame on are those
      # of the reference; no device is lost. Through the Rust interface, through rav1g.h, and with the
      # decoder code of the test player (-playersmoke), whose task ends with the error and whose stream
      # behind it decodes right, and which goes on with -continue_on_error as the program does.
      - name: Decode error in a cut stream, rav1g-dec
        if: ${{ !cancelled() && matrix.suite == 'lifecycle' }}
        shell: pwsh
        run: |
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { throw "decode error check with rav1g-dec: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-capi" `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { throw "decode error check with rav1g-dec -capi: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }
          python testing/conformance/cut_tile_check.py --player-smoke out/rav1g-dec/rav1g-dec.exe `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { throw "decode error check with the player's decoder code: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      # Order check (testing/conformance/order_check.py; docs/gpu-av1-decoder.md, "Padding of the mode info
      # record"): what a decoder writes must not depend on what the process decoded before. The sequences that
      # showed such a dependence, each in one decoder process and in this order, every stream against its
      # reference: an 8-bit quantizer vector and then the first 10-bit one, the ten 8-bit ones and then the
      # 10-bit one (-t 1 and -t 4), svc-L2T1 and then svc-L2T1-2. No stream is decoded again alone: that is
      # what kept the dependence out of sight. Only a sequence that lost the D3D12 device runs again, whole.
      - name: Order check, streams one after the other in one process
        if: ${{ !cancelled() && matrix.suite == 'lifecycle' }}
        shell: pwsh
        run: |
          python testing/conformance/order_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/order-check "--title=rav1g-dec (cargo, MSVC)"
          if ($LASTEXITCODE -ne 0) { throw "order check with rav1g-dec: exit code $LASTEXITCODE (1: a stream is wrong behind other streams, 2: the check could not be done)" }

      # Memory check (testing/conformance/memory_check.py; docs/warp-decoder.md, "Memory check"): what the
      # console showed twice and no run here could: a destroyed decoder that leaves memory behind, and a
      # budget guard that loses its credit when a creation is refused. One process creates, uses and
      # releases decoders of several configurations eight times over (the largest stream, a decoder of the
      # 4K 10-bit size, three slots, -lowmem, a creation the guard must refuse, a smaller one it must
      # accept); the video memory of the adapter after every release must be what it was before the first
      # decoder, and the private bytes of the process must stop growing once the process is warm. Then
      # the player's decoder code with a modelled app memory limit: a refused creation, and behind it a
      # smaller decoder that is accepted only with the credit of the decoder released before.
      - name: Memory check, decoders one after the other in one process
        if: ${{ !cancelled() && matrix.suite == 'lifecycle' }}
        shell: pwsh
        run: |
          python testing/conformance/memory_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check "--title=rav1g-dec (cargo, MSVC)"
          if ($LASTEXITCODE -ne 0) { throw "memory check with rav1g-dec: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      # The inter breakdown of the timing run (-gputimedetail, -gputimeisolate; docs/test-player.md, "Inter
      # prediction breakdown") as a smoke test: a 10-bit stream and one with scaled references, each decoded
      # with -gputime, -gputimedetail and -gputimeisolate against its reference. WARP's times say nothing;
      # checked are the output, that the breakdown is there, that the dispatches the recording counts and
      # the blocks the tile threads count agree on every frame, and that the numbers are plausible.
      - name: Timing run with the inter breakdown on WARP with rav1g-dec (smoke test)
        if: ${{ !cancelled() && matrix.suite == 'lifecycle' }}
        shell: pwsh
        run: |
          python testing/conformance/gputime_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/gputime-smoke --threads 4 --stream nf-chimera-10b-1080p.ivf:16 --stream syn-resize-10b-1080p.ivf:24:scaled `
            --stream nf-chimera-8b-270p.ivf:40
          if ($LASTEXITCODE -ne 0) { throw "inter breakdown smoke test with rav1g-dec: exit code $LASTEXITCODE (1: a check failed, 2: a run could not be done)" }

      # Stage dumps (testing/conformance/dump_tasks.txt): the buffers behind every GPU stage of a few
      # frames, as WARP wrote them, to compare with the dumps of another device (the test player's
      # -dumpstages) with testing/stage_dump/stage_dump.py, in the rust-dumps-equal job with the dumps of
      # the other switches of the parser, and in the rust-equal job with those of the C++ decoder. Dumps of the vectors and of the streams
      # encoded here; of the cuts of published streams only digests (hashes), never samples.
      - name: Stage dumps of the frames in dump_tasks.txt with rav1g-dec
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps --threads 4
          if ($LASTEXITCODE -ne 0) { throw "stage dumps with rav1g-dec: exit code $LASTEXITCODE" }

      # The MEMORY lines of the decoder (testing/conformance/memory_lines.py): what a decoder of a few
      # configurations holds, its budget line and the steps of its release, for the comparison with the
      # lines of the C++ decoder in the rust-equal job.
      - name: MEMORY log lines of a few decoder configurations with rav1g-dec
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/memory_lines.py run --tool out/rav1g-dec/rav1g-dec.exe `
            --streams conformance-streams --out out/memory-lines
          if ($LASTEXITCODE -ne 0) { throw "memory lines with rav1g-dec: exit code $LASTEXITCODE" }

      - name: Preserve the stage dumps of rav1g-dec
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-stage-dumps-${{ github.run_id }}
          path: out/stage-dumps/
          if-no-files-found: warn

      - name: Preserve the results, the per-stream logs and md5 files of rav1g-dec
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            out/conformance/
            out/conformance-capi/
            out/order-check/
            out/memory-check/
            out/gputime-smoke/
            out/memory-lines/
            out/player-smoke/
            out/cut-tile/
          if-no-files-found: warn

  # The semi-planar output (docs/output.md): an output image is one NV12 texture (8-bit frames) or one
  # P010 texture (10-bit frames) that the output pass of the decoder writes, for an application whose
  # video path wants that texture. rav1g-dec reads every texture back and hashes the samples as the
  # planes are hashed (the 10 bits out of the high bits of 16, U and V taken apart), so the references
  # and expected.txt are those of every other run: the image is another, the frames are not. It also
  # holds what an image has besides: the low six bits of a 10-bit sample are zero, the column and the row
  # behind an odd size repeat the last ones, the chroma plane of a monochrome frame has the middle value;
  # and, of every frame of every run of rav1g-dec, that the output fence has the value of the frame and
  # that the values grow.
  rust-output:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: [direct, copy-buffer]
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # Textures that shaders may write: the direct path, where the device has it. The log says for every
      # decoder what the device does with the two formats and which path its frames took; the summary
      # has the count of each, and a run in which no frame took the direct path says so in a warning
      # (the direct path is then not checked by this job).
      - name: Every stream into NV12 and P010 textures the output pass writes (-output p010)
        if: ${{ !cancelled() && matrix.case == 'direct' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/output-p010 --threads 4 "--tool-args=-v -output p010" "--title=rav1g-dec -output p010 (textures shaders may write)"
          $code = $LASTEXITCODE
          $log = 'out/output-p010/lists/run001.log'
          $support = @(Select-String -Path $log -Pattern 'OUTPUT semi-planar: ' | Select-Object -First 1 | ForEach-Object { $_.Line })
          $direct = @(Select-String -Path $log -Pattern 'OUTPUT (NV12|P010) direct').Count
          $staged = @(Select-String -Path $log -Pattern 'OUTPUT (NV12|P010) staged').Count
          "- The device: ``$support``", "- Decoders whose frames took the direct path: $direct; the staged path: $staged" >> $env:GITHUB_STEP_SUMMARY
          if ($direct -eq 0) { Write-Output "::warning::rust-output: no frame took the direct path on this device ($support)" }
          if ($code -ne 0) { throw "conformance run with -output p010: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # Textures that shaders may not write, which the decoder fills by one copy a plane, through the
      # interface for C; the output fence is created shareable and opened through a shared handle, and
      # the opened fence has to have the value of every frame too.
      - name: Every stream into NV12 and P010 textures by copies, through rav1g.h, with a shared fence (-capi -output p010-copy -sharedfence)
        if: ${{ !cancelled() && matrix.case == 'copy-buffer' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/output-p010-copy --threads 4 "--tool-args=-v -capi -output p010-copy -sharedfence" "--title=rav1g-dec -capi -output p010-copy -sharedfence"
          $code = $LASTEXITCODE
          $log = 'out/output-p010-copy/lists/run001.log'
          if (-not (Select-String -Path $log -Pattern 'OUTPUT (NV12|P010) staged: .*one copy a plane into the texture' -Quiet)) {
            throw 'No decoder of this run reports the staged path into a texture'
          }
          if (Select-String -Path $log -Pattern 'OUTPUT (NV12|P010) direct' -Quiet) {
            throw 'A decoder of this run wrote a texture that shaders may not write'
          }
          if (-not (Select-String -Path $log -Pattern '^FENCE .*opened through a shared handle' -Quiet)) {
            throw 'No task of this run opened the output fence through a shared handle'
          }
          if ($code -ne 0) { throw "conformance run with -capi -output p010-copy -sharedfence: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # The two planes in a buffer, for an application that reads them on the CPU.
      - name: Every stream as NV12 and P010 in a buffer (-output p010-buffer)
        if: ${{ !cancelled() && matrix.case == 'copy-buffer' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/output-p010-buffer --threads 4 "--tool-args=-output p010-buffer" "--title=rav1g-dec -output p010-buffer"
          if ($LASTEXITCODE -ne 0) { throw "conformance run with -output p010-buffer: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The display pass prototype (-displaypass, docs/stage-fusion.md): the display-size P010 images of a
      # PQ stream and an SDR stream against the float32 model of the pass, from the frames of a plain run.
      - name: The display pass prototype against its model (-displaypass)
        if: ${{ !cancelled() && matrix.case == 'direct' }}
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check numpy
          python testing/display_pass/check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/display-pass
          if ($LASTEXITCODE -ne 0) { throw "display pass check: exit code $LASTEXITCODE" }

      # The test player's decoder code with the semi-planar output: its tasks with -output p010 (the
      # textures and the readback of the player), and with -interop, which is what an application with a
      # D3D11 video path does: the textures are created by a D3D11 device with a shared handle and opened
      # in D3D12, and the D3D11 context waits for every frame on the decoder's shared fence and reads it
      # from its own texture. A device that cannot share between the two says at which step, and the
      # check reports that instead of failing: it is a finding about the device.
      - name: The test player's decoder code with -output p010 (rav1g-dec -playersmoke)
        if: ${{ !cancelled() && matrix.case == 'copy-buffer' }}
        shell: pwsh
        run: |
          python testing/conformance/player_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-p010 --semi-planar p010 "--title=the Rust library, -output p010"
          if ($LASTEXITCODE -ne 0) { throw "the player's decoder code with -output p010: exit code $LASTEXITCODE" }

      - name: The test player's decoder code with D3D11 textures and the shared fence (rav1g-dec -playersmoke, -interop)
        if: ${{ !cancelled() && matrix.case == 'copy-buffer' }}
        shell: pwsh
        run: |
          python testing/conformance/player_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-interop --semi-planar interop "--title=the Rust library, -interop"
          if ($LASTEXITCODE -ne 0) { throw "the player's decoder code with -interop: exit code $LASTEXITCODE" }

      # What the output pass costs by the kind of the images, on a 10-bit 1080p stream and on streams
      # with film grain (docs/output.md has the table).
      - name: The output pass in the timing run, by the kind of the output images
        if: ${{ !cancelled() && matrix.case == 'copy-buffer' }}
        shell: pwsh
        run: |
          python testing/conformance/output_cost.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/output-cost --stream svt/syn-tiles-10b-1080p.ivf --stream aom/av1-1-b10-23-film_grain-50.ivf `
            --stream aom/av1-1-b8-23-film_grain-50.ivf
          if ($LASTEXITCODE -ne 0) { throw "output_cost.py: exit code $LASTEXITCODE" }

      # The direct path under the debug layer with GPU-based validation, which holds the states of the
      # texture, the views of its planes and what the shaders store through them: three small streams.
      # The messages are printed and kept; the run has to decode the streams as the references say.
      - name: The direct path under GPU-based validation (-gpuvalidation -output p010)
        if: ${{ !cancelled() && matrix.case == 'direct' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/output-validation --threads 4 --no-repeat --only "size-66x66|b10-23-film_grain-50|b8-23-film_grain-50" `
            "--tool-args=-v -debuglayer -gpuvalidation -output p010" "--title=rav1g-dec -output p010 under GPU-based validation"
          $code = $LASTEXITCODE
          $messages = @(Select-String -Path out/output-validation/lists/run001.log -Pattern '^DEBUGLAYER ')
          "- Lines of the debug layer: $($messages.Count)" >> $env:GITHUB_STEP_SUMMARY
          $messages | Select-Object -First 40 | ForEach-Object { $_.Line }
          if ($code -ne 0) { throw "conformance run with -gpuvalidation -output p010: exit code $code" }

      - name: Preserve the results and the logs of the semi-planar output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-output-${{ matrix.case }}-${{ github.run_id }}
          path: |
            out/output-p010/
            out/output-p010-copy/
            out/output-p010-buffer/
            out/player-smoke-p010/
            out/player-smoke-interop/
            out/output-cost/
            out/output-validation/
          if-no-files-found: warn

  # The other side of the decoder's switches, each with the parser and the other switches of the default:
  # the poisoned mode info pool and the poisoned buffers (a part of the set), the fast inter path and the
  # clears of a pipeline slot on the decode thread, and the GPU/CPU grid comparison.
  # Parser option flips run separately when selected by the coverage check.
  rust-switches:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [poisoned, interfast, syncclear, gridcheck, intrasingleedgelegacy, intralistslegacy, parselistslegacy, steptime]
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The dependence of the order check (rust-conformance: what a decoder writes must not depend on what
      # the process decoded before) without waiting for the memory of an earlier decoder: with -poisonmi the decoder
      # fills the mode info pool with the byte 0xA5 when it creates it, so a shader that reads bytes of a
      # record that the entropy decoder never wrote (padding of the C struct, a field the block's kind does
      # not have) gives another output at once. The output has to be the same: a part of the set, about half
      # a minute (ten quantizer vectors of each bit depth, the other vectors, one cut), has to give the
      # results of expected.txt.
      - name: Conformance of the vectors with a poisoned mode info pool (-poisonmi)
        if: ${{ !cancelled() && matrix.case == 'poisoned' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-poisonmi --threads 4 "--tool-args=-poisonmi" "--title=rav1g-dec, part of the set with -poisonmi" `
            "--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -poisonmi with rav1g-dec: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # -poisonbuf, the same for every buffer the CPU writes for the shaders, and for the constants of the
      # stages in every frame: their memory is reused from frame to frame, so the decoder fills each record
      # with 0xA5 when it hands it out, right before the stage writes it. A field that a stage does not write
      # and a shader reads then has no plausible value left from an earlier frame. That was the case of loop
      # restoration, whose shader computed an address from the unit fields of a plane without restoration
      # and loaded from it, which could remove the device (docs/gpu-av1-decoder.md, "Unwritten fields of a
      # constant record"). The same part of the set as with -poisonmi has to give the results of
      # expected.txt. With the experiments input rust-experiments also tests the whole set with -poisonbuf
      # alone and alongside -interfast or -intrav2.
      - name: Conformance of the vectors with poisoned buffers and constants (-poisonbuf)
        if: ${{ !cancelled() && matrix.case == 'poisoned' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-poisonbuf --threads 4 "--tool-args=-poisonbuf" "--title=rav1g-dec, part of the set with -poisonbuf" `
            "--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -poisonbuf with rav1g-dec: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The fast inter path (-interfast; docs/gpu-av1-decoder.md, "Inter prediction: breakdown and fast
      # paths"): the blocks with one reference and the averaged compound blocks are listed by the fraction
      # of their motion vectors and predicted by inter_fast.hlsl and inter_compound_fast.hlsl. The output
      # has to be the same, so the whole set is decoded once more with the flag and has to give the
      # results of expected.txt. This pass is the gate of the feature and runs on every push.
      - name: Conformance with -interfast
        if: ${{ !cancelled() && matrix.case == 'interfast' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-interfast --threads 4 "--tool-args=-interfast" "--title=rav1g-dec with -interfast"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -interfast: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }

      # The clears of a pipeline slot on the decode thread (-syncclear), the path of the first packages:
      # the whole set once more. The other ways of the clears are in the rust-clears job, which also
      # holds this one to what it clears on two streams.
      - name: Conformance with the clears on the decode thread (-syncclear)
        if: ${{ !cancelled() && matrix.case == 'syncclear' }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-syncclear --threads 4 "--tool-args=-syncclear" "--title=rav1g-dec with -syncclear"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -syncclear: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }
          if (-not (Select-String -Path out/conformance-syncclear/lists/run001.log -Pattern 'clears decode thread \(-syncclear\)' -Quiet)) {
            $failed += 'the decoder of the run with -syncclear does not report the clears on the decode thread'
          }
          if ($failed.Count) { throw "with -syncclear: $($failed -join '; ')" }

      # -parseopt gridcheck (grid_check.rs, mi_grid_build.hlsl): a pass of the GPU builds the mode info grid
      # of every frame from its records into a second grid, which the decoder holds against the grid the
      # parse wrote, unit by unit, when the frame is done; the first step of the grid built by the GPU
      # (docs/phase2-rav1d.md, "The block lists on the GPU: a design", step C). The whole set with the
      # check: its frames against the references, and in the log of every stream the decoder's GRIDCHECK
      # line with no unit that differs.
      - name: The mode info grid built by the GPU against the parse's (-parseopt gridcheck)
        if: ${{ !cancelled() && matrix.case == 'gridcheck' }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-gridcheck --threads 4 "--tool-args=-parseopt nolfmask,tilethread,gpucdef,gridcheck" "--title=rav1g-dec (cargo, MSVC) with -parseopt gridcheck"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -parseopt gridcheck: exit code $LASTEXITCODE" }
          $lines = @(Get-ChildItem out/conformance-gridcheck/logs -Filter *.log | Select-String -Pattern '^GRIDCHECK ')
          $differ = @($lines | Where-Object { $_.Line -notmatch ' 0 differ$' })
          $frames = 0
          foreach ($line in $lines) { if ($line.Line -match ': (\d+) frames,') { $frames += [int]$Matches[1] } }
          Write-Output "GRIDCHECK: $($lines.Count) lines, $frames frames checked, $($differ.Count) with units that differ"
          foreach ($line in $differ) { Write-Output "::error::$($line.Filename): $($line.Line)" }
          if ($differ.Count) { $failed += "$($differ.Count) streams have units whose entries differ" }
          if ($lines.Count -lt 200 -or $frames -lt 500) { $failed += "only $($lines.Count) GRIDCHECK lines and $frames frames checked" }
          if ($failed.Count) { throw "the grid built by the GPU: $($failed -join '; ')" }

      - name: Conformance with a legacy intra or parser switch
        if: ${{ !cancelled() && (startsWith(matrix.case, 'intra') || matrix.case == 'parselistslegacy') }}
        shell: pwsh
        env:
          INTRA_SWITCH: ${{ matrix.case }}
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out "out/conformance-${env:INTRA_SWITCH}" --threads 4 "--tool-args=-${env:INTRA_SWITCH}" `
            "--title=rav1g-dec with -${env:INTRA_SWITCH}"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -${env:INTRA_SWITCH}: exit code $LASTEXITCODE" }

      # -intrastepmin 0 (step_time.rs, docs/test-player.md "Intra step timing"): a timestamp behind every intra
      # wavefront step of every frame with intra. The whole set with it: the frames against the references
      # (the switch changes no output), STEPTIME lines in the logs that testing/steptime/steptime.py reads,
      # and the cost of the switch on WARP: the 4K stream with and without it (-gputime, the intra stage).
      - name: Conformance with the intra step timing (-intrastepmin 0)
        if: ${{ !cancelled() && matrix.case == 'steptime' }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-steptime --threads 4 "--tool-args=-intrastepmin 0" "--title=rav1g-dec with -intrastepmin 0"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -intrastepmin 0: exit code $LASTEXITCODE" }
          $logs = @(Get-ChildItem out/conformance-steptime/lists -Filter *.log | ForEach-Object { $_.FullName })
          $frames = @(Select-String -Path $logs -Pattern '^STEPTIME frame ').Count
          $steps = @(Select-String -Path $logs -Pattern '^STEPTIME step ').Count
          Write-Output "STEPTIME: $frames frames timed, $steps steps"
          if ($frames -lt 100 -or $steps -lt 1000) { $failed += "only $frames frames and $steps steps timed" }
          python testing/steptime/steptime.py fit @logs
          if ($LASTEXITCODE -ne 0) { $failed += "steptime.py fit: exit code $LASTEXITCODE" }
          $tool = (Resolve-Path out/rav1g-dec/rav1g-dec.exe).Path
          $logDir = New-Item -Force -ItemType Directory out/conformance-steptime/cost
          Push-Location conformance-streams
          try {
            $task = Select-String -Path manifest.txt -Pattern '-name nf-dvbdash-d2-10b-2160p\.ivf ' | Select-Object -First 1
            $inputPath = [regex]::Match($task.Line, '(?:^|\s)-i\s+(\S+)').Groups[1].Value
            foreach ($round in 1..2) {
              foreach ($mode in @('off', 'on')) {
                $extra = if ($mode -eq 'on') { @('-intrastepmin', '0') } else { @() }
                $out = Join-Path $logDir.FullName "$mode-$round.log"
                & $tool -i $inputPath -limit 24 -gputime @extra > $out
                if ($LASTEXITCODE -ne 0) { $failed += "the 4K stream with the step timing $mode" }
                $intra = Select-String -Path $out -Pattern '^GPUTIME gpu intra ' | Select-Object -First 1
                $result = Select-String -Path $out -Pattern '^RESULT ' | Select-Object -First 1
                Write-Output "step timing $mode, round ${round}: $($intra.Line)"
                Write-Output "  $($result.Line)"
              }
            }
          } finally {
            Pop-Location
          }
          if ($failed.Count) { throw "with -intrastepmin 0: $($failed -join '; ')" }

      - name: Preserve the results, per-stream logs and md5 files of the switch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-switches-${{ matrix.case }}-${{ github.run_id }}
          path: out/conformance-*/
          if-no-files-found: warn


  rust-parser-switches:
    needs: [conformance-streams, rust]
    if: needs.conformance-streams.outputs.parser_switches == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The switches of rav1d's parse (-parseopt, docs/phase2-rav1d.md "Where the time goes"): ways of doing
      # the same parse. Here the other side of each: the two that are on by default off, which is rav1d's
      # parse as upstream schedules it, the block lists of a tile counted at its end and not superblock by
      # superblock (latelists), and the calls of the sink timed. Of the three that are on by default the
      # third is gpucdef, the two lists CDEF reads written by a pass of the GPU (cdef_lists.hlsl): with
      # it off the thread that records writes them, as before. The whole set against its references and
      # expected.txt, the stage dumps, the decoder code of the test player with its -parseopt flag, and the
      # decode errors in cut streams (a tile that is handed from thread to thread ends as one that keeps
      # its thread). The rust-dumps-equal job holds the stage dumps against those of the default switches
      # byte for byte.
      - name: The other side of every switch of the parser (-parseopt none,latelists)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = @()
          $switches = '-parseopt none,latelists,time'
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-switches-rav1d --threads 4 "--tool-args=$switches" "--title=rav1g-dec (cargo, MSVC) with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with ${switches}: exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out/conformance-switches-rav1d/lists/run001.log -Pattern '^PARSER .*switches none,time,latelists \(' -Quiet)) {
            $failed += 'the decoder of the run does not report the switches of the parser'
          }
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps-switches-rav1d --threads 4 "--tool-args=$switches"
          if ($LASTEXITCODE -ne 0) { $failed += "stage dumps with ${switches}: exit code $LASTEXITCODE" }
          python testing/conformance/player_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-switches-rav1d "--player-args=$switches" "--title=the Rust library (cargo, MSVC), the player with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "the player's decoder code with ${switches}: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-parseopt none,latelists" `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { $failed += "decode error check with -parseopt none,latelists: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "the switches of the parser: $($failed -join '; ')" }

      - name: Preserve the results and stage dumps of the parser switches
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-parser-switches-${{ github.run_id }}
          path: |
            out/*-rav1d/
            out/cut-tile/
          if-no-files-found: warn

  # Exercise the sink-written grid separately from the default GPU grid. rust-dumps-equal
  # compares the grids, records and prediction lists from the two paths.
  rust-sinkgrid:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The whole set against its references and expected.txt, the stage dumps, the decoder code of the
      # test player with its -parseopt flag, and the decode errors in cut streams.
      - name: The mode info grid written by the parse
        shell: pwsh
        run: |
          $failed = @()
          $switches = '-parseopt nolfmask,tilethread,gpucdef'
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-sinkgrid --threads 4 "--tool-args=$switches" "--title=rav1g-dec (cargo, MSVC) with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with ${switches}: exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out/conformance-sinkgrid/lists/run001.log -Pattern '^PARSER .*switches nolfmask,tilethread,gpucdef \(' -Quiet)) {
            $failed += 'the decoder of the run does not report the switches of the parser'
          }
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps-sinkgrid --threads 4 "--tool-args=$switches"
          if ($LASTEXITCODE -ne 0) { $failed += "stage dumps with ${switches}: exit code $LASTEXITCODE" }
          python testing/conformance/player_smoke.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-sinkgrid "--player-args=$switches" "--title=the Rust library (cargo, MSVC), the player with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "the player's decoder code with ${switches}: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=$switches" `
            --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { $failed += "decode error check with ${switches}: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "the sink-written grid: $($failed -join '; ')" }

      # Clear the grid on poisoned buffers by command list, and by the decode thread at setup.
      - name: The sink-written grid cleared for every frame
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $part = '--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)'
          $runs = @(@{ name = 'sinkgrid-gpuclear-poisonbuf'; args = '-gpuclear -poisonbuf -parseopt nolfmask,tilethread,gpucdef,cleargrid -slots 3 -t 4' },
            @{ name = 'sinkgrid-syncclear'; args = '-syncclear -parseopt nolfmask,tilethread,gpucdef,cleargrid' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" `
              "--title=rav1g-dec, part of the set with $($run.args)" $part
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "the sink-written grid, cleared: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs, the md5 files and the stage dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-sinkgrid-${{ github.run_id }}
          path: |
            out/conformance-*/
            out/stage-dumps-sinkgrid/
            out/player-smoke-sinkgrid/
            out/cut-tile/
          if-no-files-found: warn

  # GPU prediction lists. Compare frame hashes across the whole set and dump the stage buffers.
  rust-gpublists:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [standard, fast]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: GPU lists with the ${{ matrix.mode }} inter path
        shell: pwsh
        env:
          INTER_MODE: ${{ matrix.mode }}
        run: |
          $tool = 'out/rav1g-dec/rav1g-dec.exe'
          $extra = if ($env:INTER_MODE -eq 'fast') { ' -interfast' } else { '' }
          $switches = "-parseopt gpublists$extra"
          python testing/conformance/run.py --tool $tool --streams conformance-streams `
            --out "out/conformance-gpublists-$env:INTER_MODE" --threads 4 "--tool-args=$switches" "--title=rav1g-dec with $switches"
          if ($LASTEXITCODE -ne 0) { throw "conformance with $switches" }
          if (-not (Select-String -Path "out/conformance-gpublists-$env:INTER_MODE/lists/run001.log" -Pattern '^PARSER .*switches .*gpublists \(' -Quiet)) {
            throw "the decoder did not report gpublists"
          }
          python testing/stage_dump/ci_dumps.py --tool $tool --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out "out/dumps-gpublists-$env:INTER_MODE" --threads 4 "--tool-args=$switches"
          if ($LASTEXITCODE -ne 0) { throw "stage dumps with $switches" }

      - name: Stage dumps with CPU fast inter lists
        if: ${{ !cancelled() && matrix.mode == 'fast' }}
        shell: pwsh
        run: |
          $tool = 'out/rav1g-dec/rav1g-dec.exe'
          python testing/stage_dump/ci_dumps.py --tool $tool --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/dumps-cpulists-fast --threads 4 "--tool-args=-interfast"
          if ($LASTEXITCODE -ne 0) { throw 'stage dumps of the CPU fast lists' }

      - name: GPU lists in the player and with intra V2
        if: ${{ !cancelled() && matrix.mode == 'standard' }}
        shell: pwsh
        run: |
          $tool = 'out/rav1g-dec/rav1g-dec.exe'
          python testing/conformance/player_smoke.py --tool $tool --streams conformance-streams `
            --out out/player-smoke-gpublists "--player-args=-parseopt gpublists" "--title=the player with gpublists"
          if ($LASTEXITCODE -ne 0) { throw 'the player with gpublists' }
          python testing/conformance/run.py --tool $tool --streams conformance-streams `
            --out out/conformance-gpublists-intrav2 --threads 4 "--only=^(syn-resize|av1-1-b8-01-size-66x66)" `
            "--tool-args=-intrav2 -parseopt nolfmask,tilethread,gpucdef,gpublists" `
            "--title=rav1g-dec with GPU prediction lists, intra V2 and the sink-written grid"
          if ($LASTEXITCODE -ne 0) { throw 'gpublists with intra V2 and the sink-written grid' }

      - name: Compare 4K memory use and stage timings on WARP
        if: ${{ !cancelled() && matrix.mode == 'standard' }}
        shell: pwsh
        run: |
          $tool = (Resolve-Path out/rav1g-dec/rav1g-dec.exe).Path
          $logDir = New-Item -Force -ItemType Directory out/gpublists-time
          Push-Location conformance-streams
          try {
            $task = Select-String -Path manifest.txt -Pattern '-name nf-dvbdash-d2-10b-2160p\.ivf ' | Select-Object -First 1
            if (-not $task) { throw 'missing 4K task' }
            $inputPath = [regex]::Match($task.Line, '(?:^|\s)-i\s+(\S+)').Groups[1].Value
            if (-not $inputPath) { throw 'missing 4K input' }
            foreach ($mode in @('time', 'time,gpublists')) {
              & $tool -i $inputPath -limit 16 -t 2 -v -memstats -gputime -parseopt $mode | Tee-Object -FilePath (Join-Path $logDir.FullName "$mode.log")
              if ($LASTEXITCODE -ne 0) { throw "timing run with $mode" }
            }
            foreach ($stage in @('pred_count', 'pred_scan')) {
              if (-not (Select-String -Path (Join-Path $logDir.FullName 'time,gpublists.log') -Pattern "^GPUTIME gpu $stage +[1-9]" -Quiet)) {
                throw "no GPU timestamps for $stage"
              }
            }
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rav1g-dec-gpublists-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            out/conformance-gpublists-*/
            out/dumps-*/
            out/gpublists-time/
            out/player-smoke-gpublists/
          if-no-files-found: error

  # The clears of a pipeline slot (docs/test-player.md, "Pipeline slots and clears"; docs/phase2-rav1d.md,
  # "No clears by the CPU"). Without a flag, which is every other run of the workflow, a frame keeps the
  # wavefront of intra prediction at the edges of its tiles and no thread clears a grid of the slot for
  # it. Here the ways that keep the wavefront in the slot's grid and clear it for every frame, which stay
  # as switches: by the GPU at the end of the frame's command list (-gpuclear), by the completion thread
  # (-cpuclear, the default up to package 0.2.144), by the decode thread (-syncclear, the default up to
  # 0.2.139; its run of the whole set is in rust-switches). The output has to be the same with each.
  rust-clears:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [gpuclear, cpuclear]
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # Who clears what, from the timing run (testing/conformance/clears_check.py): the 2160p stream and
      # the stream with eight tiles, each decoded in every way, also with the mode info grid cleared for
      # every frame (-parseopt cleargrid). Without a flag the completion thread and the GPU
      # clear nothing and the decode and tile threads the counters of the tiles' block lists; with
      # -gpuclear the command list of every frame clears, and no thread; with -cpuclear the completion
      # thread clears the same bytes; with -syncclear the decode thread.
      - name: Who clears the grids of a slot, and how much
        if: ${{ !cancelled() && matrix.case == 'cpuclear' }}
        shell: pwsh
        run: |
          python testing/conformance/clears_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/clears-check --threads 4 --stream nf-dvbdash-d2-10b-2160p.ivf --stream syn-tiles-10b-1080p.ivf:24
          if ($LASTEXITCODE -ne 0) { throw "the clears of a slot: exit code $LASTEXITCODE (1: a check failed, 2: a run could not be done)" }

      # The clears by the GPU: the whole set has to give the results of expected.txt, and the memory check
      # has to hold (the grids of such a decoder are buffers the GPU may write; they are released like the
      # others).
      - name: Conformance and memory check with the clears of the GPU (-gpuclear)
        if: ${{ !cancelled() && matrix.case == 'gpuclear' }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-gpuclear --threads 4 "--tool-args=-gpuclear" "--title=rav1g-dec with -gpuclear"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -gpuclear: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }
          if (-not (Select-String -Path out/conformance-gpuclear/lists/run001.log -Pattern 'clears GPU \(-gpuclear\)' -Quiet)) {
            $failed += 'the decoder of the run with -gpuclear does not report the clears of the GPU'
          }
          python testing/conformance/memory_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check-gpuclear "--tool-args=-gpuclear" "--title=rav1g-dec (cargo, MSVC) with -gpuclear"
          if ($LASTEXITCODE -ne 0) { $failed += "memory check with -gpuclear: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "with -gpuclear: $($failed -join '; ')" }

      # The clears on the completion thread, with the wavefront in the grid: the default of the packages
      # up to 0.2.144. The whole set, and the stage dumps, which the rust-dumps-equal job holds against
      # those of the default byte for byte: the block lists of the two ways of keeping the wavefront
      # have to be the same lists.
      - name: Conformance and stage dumps with the clears on the completion thread (-cpuclear)
        if: ${{ !cancelled() && matrix.case == 'cpuclear' }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-cpuclear --threads 4 "--tool-args=-cpuclear" "--title=rav1g-dec with -cpuclear"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -cpuclear: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }
          if (-not (Select-String -Path out/conformance-cpuclear/lists/run001.log -Pattern 'clears completion thread \(-cpuclear\)' -Quiet)) {
            $failed += 'the decoder of the run with -cpuclear does not report the clears on the completion thread'
          }
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps-cpuclear --threads 4 "--tool-args=-cpuclear"
          if ($LASTEXITCODE -ne 0) { $failed += "stage dumps with -cpuclear: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "with -cpuclear: $($failed -join '; ')" }

      # The clears of the GPU where both grids are cleared: with the parse made to clear the mode info
      # grid for every frame (-parseopt cleargrid) on poisoned buffers, three slots and four threads.
      # With -poisonbuf the grids start as
      # 0xA5 bytes, so an entry that neither the CPU nor the clear of the GPU has written shows in the
      # output. The part of the set of the poisoned runs.
      - name: The clears of the GPU of both grids, with poisoned buffers
        if: ${{ !cancelled() && matrix.case == 'gpuclear' }}
        shell: pwsh
        run: |
          $part = '--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)'
          $runs = @(@{ name = 'gpuclear-poisonbuf'; args = '-gpuclear -poisonbuf -parseopt cleargrid -slots 3 -t 4' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" `
              "--title=rav1g-dec, part of the set with $($run.args)" $part
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "the clears of the GPU: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs, the md5 files and the stage dumps of the clears
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-clears-${{ matrix.case }}-${{ github.run_id }}
          path: |
            out/clears-check/
            out/conformance-*/
            out/memory-check-gpuclear/
            out/stage-dumps-cpuclear/
          if-no-files-found: warn

  # Frames in parallel (docs/phase2-rav1d.md, step 4): a decoder with more than one frame in parse
  # (-parseframes). Its frames are values: they are parsed side by side on the parser's threads and
  # recorded and submitted in decode order by a thread of the decoder. The frames have to be those of one
  # frame in parse, to the byte, whatever the threads do; the order of the threads is what differs from
  # run to run, so the set runs in several combinations here and in the job below, and in all of them,
  # twice, in the weekly or manually selected frames-matrix job.
  rust-frames:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [setup, conformance, late-buffer, dumps-memory]
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # What a decoder is created with, the budget guard, a parse that waits for memory, a panic in the
      # parse, and the time of the parse with one and with two frames in parse
      # (testing/conformance/frames_check.py): the 2160p stream, where the library's defaults are two
      # threads and two frames in parse, and the 1080p stream with eight tiles. The budget guard with fixed
      # budgets: a decoder that would not leave the headroom (128 MiB) is created with fewer slots and
      # frames in parse and decodes, a fourth slot in the budget of the default gets three (the case of
      # the console in 1 GiB), and nothing is refused for the headroom. The pools (docs/phase2-rav1d.md, step
      # 5): with -parseopt poolwait a frame finds a pool empty behind its first piece while an older frame
      # holds one, so its tiles wait in the middle of their parse for the GPU, with one, two and four
      # frames in parse, and the frames are right; the lossless stream fills the pools of its size by
      # itself.
      - name: What is created, the budget guard, a parse that waits for memory, a panic in the parse, timing
        if: ${{ !cancelled() && matrix.case == 'setup' }}
        shell: pwsh
        run: |
          python testing/conformance/frames_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/frames-check --large nf-dvbdash-d2-10b-2160p.ivf --small syn-tiles-10b-1080p.ivf `
            --dense av1-1-b8-00-quantizer-00.ivf
          if ($LASTEXITCODE -ne 0) { throw "frames in parallel: exit code $LASTEXITCODE (1: a check failed, 2: a run could not be done)" }

      # The whole set with two frames in parse on two threads, which is what the library gives a 4K
      # stream by default: the results of expected.txt.
      - name: Conformance with two frames in parse (-parseframes 2 -t 2)
        if: ${{ !cancelled() && matrix.case == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-frames2 --threads 2 "--tool-args=-parseframes 2 -slots 3" "--title=rav1g-dec with -parseframes 2 -t 2"
          if ($LASTEXITCODE -ne 0) { throw "conformance with -parseframes 2: exit code $LASTEXITCODE (1: not as expected.txt says, 2: the run could not be done)" }
          if (-not (Select-String -Path out/conformance-frames2/lists/run001.log -Pattern 'frames in parse 2 \(asked 2\), slots 3' -Quiet)) {
            throw 'the decoders of the run with -parseframes 2 do not say that they have two frames in parse and three slots'
          }

      # A decode error with frames in parse (testing/conformance/cut_tile_check.py --frames-in-parse): the
      # error comes back from a later call or from the drain; the frames before the damage and from the
      # next key frame on are right, a frame that depends on a failed one fails, nothing hangs, no device
      # is lost. With two and with three frames in parse, also through rav1g.h.
      - name: Decode error in the middle of a stream with frames in parse
        if: ${{ !cancelled() && matrix.case == 'conformance' }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe --frames-in-parse 2 `
            --streams conformance-streams --out out/cut-tile-frames
          if ($LASTEXITCODE -ne 0) { $failed += "two frames in parse: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe --frames-in-parse 3 `
            --streams conformance-streams --out out/cut-tile-frames
          if ($LASTEXITCODE -ne 0) { $failed += "three frames in parse: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-capi" --frames-in-parse 2 `
            --streams conformance-streams --out out/cut-tile-frames
          if ($LASTEXITCODE -ne 0) { $failed += "two frames in parse through rav1g.h: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "decode error check with frames in parse: $($failed -join '; ') (1: a check failed, 2: the check could not be done)" }

      # The frame buffer bound at the recording (docs/memory.md, candidate 5; -lowmemparts with 32): a
      # frame in parse has no frame buffer, takes it when it is recorded and counts its references then,
      # and the pool has 10 buffers whatever the slots. The whole set with two frames in parse on three
      # slots and with three on four: the results of expected.txt, and the decoders say what they are.
      # Then the decode error in the middle of a stream, where a frame that fails never takes a buffer
      # and the frames that refer to it are not recorded. The part goes with the shared back buffer
      # (33): without it a decoder is what it is without the part.
      - name: Conformance and decode errors with the frame buffer bound at the recording (-lowmemparts 33)
        if: ${{ !cancelled() && matrix.case == 'late-buffer' }}
        shell: pwsh
        run: |
          $failed = @()
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-latefb --threads 2 "--tool-args=-v -parseframes 2 -slots 3 -lowmemparts 33 -memstats" `
            "--title=rav1g-dec with -parseframes 2 -t 2 -lowmemparts 33"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -parseframes 2 -lowmemparts 33: exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out/conformance-latefb/lists/run001.log -Pattern 'slots 3, frame buffers 10 \+ 2 back buffers' -Quiet) -or
              -not (Select-String -Path out/conformance-latefb/lists/run001.log -Pattern 'low memory 33 \(.*frame buffers bound at the recording\)' -Quiet) -or
              -not (Select-String -Path out/conformance-latefb/lists/run001.log -Pattern 'MEMSTATS frame buffers: 10 in the pool .* when a frame takes its buffer at its recording' -Quiet)) {
            $failed += 'the decoders of the run with -lowmemparts 33 do not say that they have three slots, 10 frame buffers and bind them at the recording'
          }
          python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-latefb-frames3 --threads 4 "--tool-args=-v -parseframes 3 -lowmemparts 33" `
            "--title=rav1g-dec with -parseframes 3 -t 4 -lowmemparts 33"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with -parseframes 3 -lowmemparts 33: exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out/conformance-latefb-frames3/lists/run001.log -Pattern 'slots 4, frame buffers 10 \+ 2 back buffers' -Quiet)) {
            $failed += 'the decoders of the run with -parseframes 3 -lowmemparts 33 do not say that they have four slots and 10 frame buffers'
          }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-lowmemparts 33" --frames-in-parse 2 `
            --streams conformance-streams --out out/cut-tile-frames
          if ($LASTEXITCODE -ne 0) { $failed += "decode error, two frames in parse, -lowmemparts 33: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-lowmemparts 33" --frames-in-parse 3 `
            --streams conformance-streams --out out/cut-tile-frames
          if ($LASTEXITCODE -ne 0) { $failed += "decode error, three frames in parse, -lowmemparts 33: exit code $LASTEXITCODE" }
          python testing/conformance/cut_tile_check.py --tool out/rav1g-dec/rav1g-dec.exe "--tool-args=-capi -lowmemparts 33" --frames-in-parse 2 `
            --streams conformance-streams --out out/cut-tile-frames
          if ($LASTEXITCODE -ne 0) { $failed += "decode error through rav1g.h, two frames in parse, -lowmemparts 33: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "frame buffer bound at the recording: $($failed -join '; ')" }

      # The stage dumps with two frames in parse, which the rust-dumps-equal job holds against those
      # of one frame in parse byte for byte: every list the stages read and every frame buffer behind
      # every stage.
      - name: Stage dumps with two frames in parse
        if: ${{ !cancelled() && matrix.case == 'dumps-memory' }}
        shell: pwsh
        run: |
          python testing/stage_dump/ci_dumps.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --tasks testing/conformance/dump_tasks.txt --out out/stage-dumps-frames2 --threads 4 "--tool-args=-parseframes 2"
          if ($LASTEXITCODE -ne 0) { throw "stage dumps with -parseframes 2: exit code $LASTEXITCODE" }

      # The memory check with two frames in parse: what the decoder takes comes back, also the thread that
      # submits the frames and the copies of the frames' headers, and the budget guard decides as it does
      # with one (a decoder that does not fit with three slots is tried with two).
      - name: Memory check with two frames in parse
        if: ${{ !cancelled() && matrix.case == 'dumps-memory' }}
        shell: pwsh
        run: |
          python testing/conformance/memory_check.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check-frames2 "--tool-args=-parseframes 2 -t 2" "--title=rav1g-dec (cargo, MSVC) with -parseframes 2 -t 2"
          if ($LASTEXITCODE -ne 0) { throw "memory check with -parseframes 2: exit code $LASTEXITCODE" }

      - name: Preserve the results, the per-stream logs, the md5 files and the stage dumps of frames in parallel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-frames-${{ matrix.case }}-${{ github.run_id }}
          path: |
            out/frames-check/
            out/conformance-frames2/
            out/conformance-latefb/
            out/conformance-latefb-frames3/
            out/cut-tile-frames/
            out/stage-dumps-frames2/
            out/memory-check-frames2/
          if-no-files-found: warn

  # More combinations of frames in parse and threads, next to the job above: three frames on four
  # threads, four on eight, two on three with four slots (two frames on the GPU), and the whole set with
  # the test switch of the pools (-parseopt poolwait: a frame finds a pool empty behind its first piece
  # while an older frame holds one, and waits), with the library's frames in parse and with two.
  rust-frames-threads:
    needs: [conformance-streams, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [parallel, poolwait]
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Conformance with alternate parser thread and frame counts
        shell: pwsh
        env:
          FRAME_CASE: ${{ matrix.case }}
        run: |
          $runs = if ($env:FRAME_CASE -eq 'parallel') {
            @{ name = 'frames3-t4'; threads = 4; args = '-parseframes 3'; says = 'frames in parse 3 \(asked 3\), slots 4' }
            @{ name = 'frames4-t8'; threads = 8; args = '-parseframes 4'; says = 'frames in parse 4 \(asked 4\), slots 4' }
            @{ name = 'frames2-t3-slots4'; threads = 3; args = '-parseframes 2 -slots 4'; says = 'frames in parse 2 \(asked 2\), slots 4' }
          } else {
            @{ name = 'poolwait-t4'; threads = 4; args = '-parseopt poolwait'; says = 'frames in parse 1 \(asked 0\), slots 2' }
            @{ name = 'poolwait-frames2-t2'; threads = 2; args = '-parseframes 2 -slots 3 -parseopt poolwait'; says = 'frames in parse 2 \(asked 2\), slots 3' }
          }
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads $run.threads "--tool-args=$($run.args)" `
              "--title=rav1g-dec with $($run.args) -t $($run.threads)"
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args) -t $($run.threads): exit code $LASTEXITCODE" }
            if (-not (Select-String -Path "out/conformance-$($run.name)/lists/run001.log" -Pattern $run.says -Quiet)) {
              $failed += "$($run.args) -t $($run.threads): the decoders of the run do not say what they were to have"
            }
          }
          if ($failed.Count) { throw "conformance with frames in parse: $($failed -join '; ') (1: not as expected.txt says, 2: the run could not be done)" }

      - name: Preserve the results and the per-stream logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-frames-threads-${{ matrix.case }}-${{ github.run_id }}
          path: out/conformance-*/
          if-no-files-found: warn

  # Every combination of frames in parse and parser threads, twice each (docs/phase2-rav1d.md, step 4:
  # "one to four frames in parse and one to eight workers, equal md5 in every combination, run
  # repeatedly"). On the weekly run or with the frames_matrix input these are four jobs
  # side by side, one for each number of frames in parse, with the thread counts that have room for it.
  frames-matrix:
    needs: [conformance-streams, rust]
    if: ${{ github.event_name == 'schedule' || inputs.frames_matrix }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        frames: [1, 2, 3, 4]
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Conformance with ${{ matrix.frames }} frame(s) in parse on every number of threads, twice
        shell: pwsh
        run: |
          $frames = ${{ matrix.frames }}
          $failed = @()
          foreach ($round in 1, 2) {
            foreach ($threads in 1..8) {
              if ($threads -lt $frames) { continue }
              python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
                --out "out/conformance-frames$frames-t$threads-round$round" --threads $threads "--tool-args=-parseframes $frames" `
                "--title=rav1g-dec with -parseframes $frames -t $threads, round $round"
              if ($LASTEXITCODE -ne 0) { $failed += "-parseframes $frames -t $threads, round ${round}: exit code $LASTEXITCODE" }
            }
          }
          if ($failed.Count) { throw "the matrix of frames in parse and threads: $($failed -join '; ') (1: not as expected.txt says, 2: the run could not be done)" }

      - name: Preserve the results and the per-stream logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-frames-matrix-${{ matrix.frames }}-${{ github.run_id }}
          path: out/conformance-*/
          if-no-files-found: warn

  # The public Argon release is a multipart ZIP. Cache the six Profile 0 folders,
  # including layered references, and share the same cache across all Windows shards.
  argon-streams:
    if: github.event_name == 'workflow_dispatch' && inputs.argon
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Profile 0 cache key
        id: key
        run: echo "key=argon-av1-v2.1.1-profile0-${{ hashFiles('testing/argon/fetch.py', 'testing/argon/suite.py') }}" >> "$GITHUB_OUTPUT"

      - name: Argon Profile 0 from the cache
        id: argon
        uses: actions/cache@v6
        with:
          path: argon-streams
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

      - name: Download Profile 0 by ZIP ranges
        if: steps.argon.outputs.cache-hit != 'true'
        run: python3 testing/argon/fetch.py --out argon-streams

  argon-conformance:
    if: github.event_name == 'workflow_dispatch' && inputs.argon
    needs: [argon-streams, rust]
    runs-on: windows-latest
    # Allow time for manual runs with several opt-in passes, including the 4K stress streams.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Argon Profile 0 from the cache
        uses: actions/cache/restore@v6
        with:
          path: argon-streams
          key: ${{ needs.argon-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The 4K stress stream test22266 can reach five minutes on hosted WARP.
      # Exercise frame-parallel parsing on small streams too and compare the full stream hash.
      - name: Argon Profile 0 on WARP
        run: >-
          python testing/argon/run.py --tool out/rav1g-dec/rav1g-dec.exe
          --streams argon-streams --out out/argon/default --shards 8 --shard ${{ matrix.shard }} --timeout 450
          --decoder-arg=-parseframes --decoder-arg=2

      - name: Argon Profile 0 on WARP with opt-in decoder switches
        if: ${{ !cancelled() && inputs.argon_switches != '' }}
        shell: pwsh
        env:
          ARGON_SWITCHES: ${{ inputs.argon_switches }}
        run: |
          # A pass is one entry: a flag, or flags with plain values separated by spaces (for example
          # "-output p010 -cdefv3legacy").
          $switches = $env:ARGON_SWITCHES -split ',' | ForEach-Object { $_.Trim() } | Select-Object -Unique
          foreach ($decoderSwitch in $switches) {
            if ($decoderSwitch -cnotmatch '\A-[a-z][a-z0-9_-]*( [a-z0-9_-]+)*\z') {
              throw 'argon_switches needs comma-separated passes of decoder flags, each flag with an optional plain value (for example -intralistslegacy,-output p010)'
            }
          }
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = $false
          foreach ($decoderSwitch in $switches) {
            Write-Host "Argon on WARP with $decoderSwitch"
            $passArgs = @($decoderSwitch -split ' ' | ForEach-Object { "--decoder-arg=$_" })
            $passDir = $decoderSwitch -replace ' ', '_'
            python testing/argon/run.py --tool out/rav1g-dec/rav1g-dec.exe `
              --streams argon-streams --out "out/argon/$passDir" --shards 8 --shard ${{ matrix.shard }} --timeout 450 `
              --decoder-arg=-parseframes --decoder-arg=2 @passArgs
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Preserve the result table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: argon-profile0-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            out/argon/*/results.tsv
            out/argon/*/summary.md
          if-no-files-found: warn

  # What the jobs above wrote, held against each other; no decoder runs here. It runs also when one of
  # them failed, on what that job wrote before it did.
  rust-dumps-equal:
    needs: [rust, rust-conformance, rust-parser-switches, rust-sinkgrid, rust-clears, rust-frames]
    if: ${{ !cancelled() && needs.rust.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-stage-dumps-${{ github.run_id }}
          path: default-dumps

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-clears-cpuclear-${{ github.run_id }}
          path: clears

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-frames-dumps-memory-${{ github.run_id }}
          path: frames

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-sinkgrid-${{ github.run_id }}
          path: sinkgrid

      - uses: actions/download-artifact@v8
        if: ${{ !cancelled() && needs.rust-parser-switches.result != 'skipped' }}
        with:
          name: rav1g-dec-parser-switches-${{ github.run_id }}
          path: switches

      # Compare the default GPU grid and the sink-written grid, including their mode info and lists.
      - name: The grid built by the GPU gives the same stage dumps as the grid the parse writes
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          dumped=0
          for dir in default-dumps/*/; do
            name=$(basename "$dir")
            [ "$name" != streams ] || continue
            dumped=$((dumped + 1))
            code=0
            python3 testing/stage_dump/stage_dump.py compare "$dir" "sinkgrid/stage-dumps-sinkgrid/$name" > compare.txt 2>&1 || code=$?
            tail -n 3 compare.txt
            if [ "$code" -ne 0 ]; then
              echo "::error::stage dumps of $name: the GPU and sink-written grids differ"
              status=1
            fi
          done
          if [ "$dumped" -eq 0 ]; then
            echo '::error::no stage dumps of the default switches to hold these against'
            status=1
          fi
          exit "$status"

      # The other side of every switch of rav1d's parse (the run of the rust-parser-switches job): the stage
      # dumps against those of the default switches byte for byte (the mode info records too: the same
      # parser wrote them). Its frames are held against the references in the run itself.
      - name: The other side of every switch of the parser gives the same stage dumps
        if: ${{ !cancelled() && needs.rust-parser-switches.result != 'skipped' }}
        run: |
          set -euo pipefail
          status=0
          switches='-parseopt none,latelists,time'
          dumped=0
          for dir in default-dumps/*/; do
            name=$(basename "$dir")
            [ "$name" != streams ] || continue
            dumped=$((dumped + 1))
            code=0
            python3 testing/stage_dump/stage_dump.py compare "$dir" "switches/stage-dumps-switches-rav1d/$name" > compare.txt 2>&1 || code=$?
            tail -n 3 compare.txt
            if [ "$code" -ne 0 ]; then
              echo "::error::stage dumps of $name: the default switches and $switches differ"
              status=1
            fi
          done
          if [ "$dumped" -eq 0 ]; then
            echo '::error::no stage dumps of the default switches to hold these against'
            status=1
          fi
          exit "$status"

      # The two ways of keeping the wavefront of intra prediction (the run of the rust-clears job): the
      # stage dumps of the wavefront in the slot's grid (-cpuclear) against those of the wavefront at the
      # edges of the tiles (the default) byte for byte. The lists of the prediction blocks are in them:
      # they are equal only if every transform block has the same iteration either way.
      - name: The wavefront in the grid and at the edges of the tiles give the same stage dumps
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          dumped=0
          for dir in default-dumps/*/; do
            name=$(basename "$dir")
            [ "$name" != streams ] || continue
            dumped=$((dumped + 1))
            code=0
            python3 testing/stage_dump/stage_dump.py compare "$dir" "clears/stage-dumps-cpuclear/$name" > compare.txt 2>&1 || code=$?
            tail -n 3 compare.txt
            if [ "$code" -ne 0 ]; then
              echo "::error::stage dumps of $name: the default and -cpuclear differ"
              status=1
            fi
          done
          if [ "$dumped" -eq 0 ]; then
            echo '::error::no stage dumps of the default to hold these against'
            status=1
          fi
          exit "$status"

      # Frames in parallel (the run of the rust-frames job): the stage dumps of a decoder with two frames
      # in parse against those of the default, one frame in parse, byte for byte: the frames are set up
      # while others are in parse and recorded by another thread, from a copy of their header, and every
      # list and every frame buffer behind every stage has to be what it is when one thread does it all
      # in turn.
      - name: Two frames in parse and one give the same stage dumps
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          dumped=0
          for dir in default-dumps/*/; do
            name=$(basename "$dir")
            [ "$name" != streams ] || continue
            dumped=$((dumped + 1))
            code=0
            python3 testing/stage_dump/stage_dump.py compare "$dir" "frames/stage-dumps-frames2/$name" > compare.txt 2>&1 || code=$?
            tail -n 3 compare.txt
            if [ "$code" -ne 0 ]; then
              echo "::error::stage dumps of $name: one frame in parse and two differ"
              status=1
            fi
          done
          if [ "$dumped" -eq 0 ]; then
            echo '::error::no stage dumps of the default to hold these against'
            status=1
          fi
          exit "$status"

  # The experiments input enables decodes with each experiment flag and the uavsync build.
  rust-experiments:
    needs: [conformance-streams, rust]
    if: ${{ inputs.experiments }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-${{ github.run_id }}
          path: out/rav1g-dec

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: rav1g-dec.exe with the shaders of the uavsync package, of the rust job
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-uavsync-x64-${{ github.run_id }}
          path: out/rav1g-dec-uavsync

      # The experiments (docs/test-player.md, "Experiments"): on a device that follows D3D each of them
      # leaves the output as it is, so the whole set is decoded again with each flag and has to give the
      # results of expected.txt, and once more with a decoder whose shaders are those of the uavsync
      # package. The experiments input exercises these paths.
      - name: Conformance with each experiment flag
        shell: pwsh
        run: |
          $runs = @(@{ name = 'lfhsplit1'; args = '-lfhsplit 1' }, @{ name = 'lfhsplit2'; args = '-lfhsplit 2' },
            @{ name = 'intraedgefix'; args = '-intraedgefix' },
            # Not experiments for a device: the whole set with the mode info pool poisoned, and with every
            # buffer and the constants poisoned, also on the fast inter path and with the second intra
            # scheduler (the rust-switches job decodes a part of the set with -poisonmi and -poisonbuf on every push).
            @{ name = 'poisonmi-all'; args = '-poisonmi' },
            @{ name = 'poisonbuf-all'; args = '-poisonbuf' },
            @{ name = 'poisonbuf-interfast'; args = '-poisonbuf -interfast' },
            @{ name = 'poisonbuf-intrav2'; args = '-poisonbuf -intrav2' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool out/rav1g-dec/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" "--title=rav1g-dec with $($run.args)"
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "conformance with an experiment flag: $($failed -join '; ')" }

      - name: Conformance with the uavsync shaders
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool out/rav1g-dec-uavsync/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-uavsync --threads 4 "--title=rav1g-dec, uavsync shaders (all-memory group syncs)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance-uavsync/lists/run001.log -Pattern '^SHADERS uavsync' -Quiet)) {
            throw 'The decoder of this run does not report the uavsync shaders'
          }
          if ($code -ne 0) { throw "conformance with the uavsync shaders: exit code $code" }

      - name: Preserve the results, the per-stream logs and md5 files of the experiments
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-experiments-${{ github.run_id }}
          path: out/conformance-*/
          if-no-files-found: warn

  # The diagnostic decoder uses the same three bytecode sets as revision 4 of the player.
  shader-pick-decoder:
    needs: conformance-streams
    if: needs.conformance-streams.outputs.shader_pick == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shader-pick bytecodes
        id: shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}
          variant: shader-pick

      - name: Shader Model 6 test shaders
        id: sm6
        uses: ./.github/actions/sm6test-shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'rustup could not install stable' }
          rustup default stable
          rustc --version

      - name: nasm
        uses: ./.github/actions/nasm

      - uses: Swatinem/rust-cache@v2
        with:
          key: dxc

      - name: Build rav1g-dec with all three shader sets
        shell: pwsh
        env:
          RAV1G_SHADER_DIR: ${{ steps.shaders.outputs.dir }}
          RAV1G_SM6TEST_SHADER_DIR: ${{ steps.sm6.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/rav1g-dec-dxc | Out-Null
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked -p rav1g-dec --features shader-pick
          if ($LASTEXITCODE -ne 0) { throw 'cargo build of rav1g-dec with the DXC shaders failed' }
          $built = [math]::Round($clock.Elapsed.TotalMinutes, 1)
          Copy-Item target/release/rav1g-dec.exe, target/release/rav1g_dec.pdb -Destination out/rav1g-dec-dxc/
          # Verify the embedded bytecode of both sets.
          python testing/shader_cache/shaders.py verify --report shader-build/shader-pick/report.json `
            --root shader-build/shader-pick out/rav1g-dec-dxc/rav1g-dec.exe
          if ($LASTEXITCODE -ne 0) { throw 'The DXC rav1g-dec was not built from the DXC shader bytecode of this run' }
          Copy-Item shader-build/shader-pick/shader_set.txt out/rav1g-dec-dxc/
          # Listings and compiler report for both sets.
          New-Item -ItemType Directory -Force out/dxc-shaders | Out-Null
          Copy-Item shader-build/shader-pick/asm out/dxc-shaders/asm -Recurse
          Copy-Item shader-build/shader-pick/report.json out/dxc-shaders/build.json
          Copy-Item shader-build/shader-pick/shader_set.txt, shader-build/shader-pick/shader_sets.txt -Destination out/dxc-shaders/
          $report = Get-Content shader-build/shader-pick/report.json -Raw | ConvertFrom-Json
          @("Commit: $env:GITHUB_SHA", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Build: cargo build --release -p rav1g-dec --features shader-pick, $(rustc --version), MSVC") +
            @(Get-Content shader-build/shader-pick/shader_sets.txt) |
            Set-Content out/rav1g-dec-dxc/SOURCES.txt -Encoding utf8
          "## rav1g-dec with shader-pick", '',
            "cargo build --release --features shader-pick: $built min ($(rustc --version)). Both sets use $($report.shader_set) (``$($report.dxc_version)``).", '' >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve the shader-pick decoder and compiler listings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-dxc-${{ github.run_id }}
          path: |
            out/rav1g-dec-dxc/
            out/dxc-shaders/
          if-no-files-found: error

  # Each shader-pick case decodes the conformance set with a fresh set of pipelines.
  rust-dxc:
    needs: [conformance-streams, shader-pick-decoder]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: dxc
            pick: ''
          - case: od
            pick: od=all
          - case: mixed
            pick: od=loopfilter_*,idct*,*_fast,inter_*,cdef_*,intra_*,dxc=inter_main_v2,reconstruct_block*
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-dxc-${{ github.run_id }}
          path: out

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Decode every stream on WARP with the selected shader set
        shell: pwsh
        env:
          PICK_CASE: ${{ matrix.case }}
          PICK: ${{ matrix.pick }}
        run: |
          $out = "out/conformance-dxc-$env:PICK_CASE"
          $options = if ($env:PICK) { "-shaderpick $env:PICK" } else { '' }
          python testing/conformance/run.py --tool out/rav1g-dec-dxc/rav1g-dec.exe --streams conformance-streams `
            --out $out --threads 4 "--tool-args=$options" "--title=rav1g-dec shader-pick, $env:PICK_CASE"
          if ($LASTEXITCODE -ne 0) { throw "Conformance of $env:PICK_CASE: exit code $LASTEXITCODE" }
          $log = "$out/lists/run001.log"
          $set = (Get-Content out/rav1g-dec-dxc/shader_set.txt -Raw).Trim()
          $count = @(Select-String -Path crates/rav1g-sys/shaders.txt -Pattern '^[a-z0-9_]+$').Count
          $line = switch ($env:PICK_CASE) {
            'dxc' { "SHADERPICK none: dxc $count (all); od 0" }
            'od' { "SHADERPICK od=all: dxc 0; od $count (all)" }
            'mixed' { "SHADERPICK $($env:PICK): " }
          }
          if (-not (Select-String -Path $log -SimpleMatch "SHADERS shader-pick ($set)" -Quiet) -or
              -not (Select-String -Path $log -SimpleMatch $line -Quiet) -or
              -not (Select-String -Path $log -Pattern '^SHADERSET dxc: ' -Quiet) -or
              -not (Select-String -Path $log -Pattern '^SHADERSET od: ' -Quiet)) {
            throw "Expected shader compiler and pick in $log ($line)"
          }

      - name: Invalid shader picks are refused
        if: ${{ !cancelled() && matrix.case == 'mixed' }}
        shell: pwsh
        run: |
          $errors = @{
            'od=no_such_shader' = "no shader has the name 'no_such_shader'"
            'fxc=all' = "the 'fxc' set has been removed. Use dxc or od."
          }
          foreach ($pick in $errors.Keys) {
            $refused = & out/rav1g-dec-dxc/rav1g-dec.exe -shaderpick $pick | Out-String
            $code = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            if ($code -ne 3 -or -not $refused.Contains("ERROR -shaderpick ${pick}: shader pick: $($errors[$pick])")) {
              throw "-shaderpick ${pick}: exit code $code, expected 3 and an ERROR line. Output: $refused"
            }
          }

      - name: The test player's decoder code without a pick
        if: ${{ !cancelled() && matrix.case == 'dxc' }}
        shell: pwsh
        run: |
          python testing/conformance/player_smoke.py --tool out/rav1g-dec-dxc/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-dxc "--title=the shader-pick build with its default DXIL"
          if ($LASTEXITCODE -ne 0) { throw "the player's decoder code with the default DXIL: exit code $LASTEXITCODE" }
          $set = (Get-Content out/rav1g-dec-dxc/shader_set.txt -Raw).Trim()
          if (-not (Get-ChildItem out/player-smoke-dxc -Recurse -File | Select-String -Pattern "LIBRARY rav1g .*shaders: $([regex]::Escape($set))" -Quiet)) {
            throw "The LIBRARY line of the player's decoder code does not name the DXC shaders ($set)"
          }

      - name: The test player's decoder code with a pick on its task lines
        if: ${{ !cancelled() && matrix.case == 'mixed' }}
        shell: pwsh
        run: |
          $pick = 'od=cdef_filter_v2,loopfilter_vert_hbd'
          python testing/conformance/player_smoke.py --tool out/rav1g-dec-dxc/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-dxc-pick "--player-args=-shaderpick $pick" "--title=the player's shader-pick build"
          if ($LASTEXITCODE -ne 0) { throw "the player's decoder code with a shader pick: exit code $LASTEXITCODE" }
          $count = @(Select-String -Path crates/rav1g-sys/shaders.txt -Pattern '^[a-z0-9_]+$').Count
          if (-not (Get-ChildItem out/player-smoke-dxc-pick -Recurse -File | Select-String -SimpleMatch `
              "SHADERPICK ${pick}: dxc $($count - 2) (all others); od 2 (cdef_filter_v2 loopfilter_vert_hbd)" -Quiet)) {
            throw "The player's log does not have the SHADERPICK line of the pick of its task lines"
          }

      - name: Preserve the conformance results and logs for the pick
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-dxc-${{ matrix.case }}-${{ github.run_id }}
          path: |
            out/conformance-dxc-*/
            out/player-smoke-dxc*/
          if-no-files-found: warn

  # Equality with the C++ decoder (docs/rust-port.md, "Equality reference"): rav1g-dec of this commit and
  # warp_decoder of branch cpp at CPP_REFERENCE_COMMIT must write the same md5 for every output frame of
  # every stream of the set and the same buffers behind every GPU stage of the dumped frames. The C++
  # decoder reads a stream with the entropy decoder of libaom, the decoder of this commit with the parse
  # pass of rav1d: this is where the two parsers are still held against each other (the mode
  # info records are listed, not held equal: libaom leaves in a field a block's kind does not have what
  # an earlier frame had there, and the layouts differ; stage_dump.py compare --two-parsers). The MEMORY
  # lines are no longer the same text: the C++ decoder has a share of the mode info and coefficient
  # buffers for each slot, this one has pools (docs/phase2-rav1d.md, step 5); what is held of them is
  # in the last step. The stage dump comparison also checks the output lists and intra prediction
  # from the shaders that differ between the two builds.
  rust-equal:
    needs: [cpp-reference, rust-conformance, rust-gpublists]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-cpp-reference-${{ github.run_id }}
          path: cpp-reference

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-conformance-${{ github.run_id }}
          path: rav1g-dec

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-stage-dumps-${{ github.run_id }}
          path: rav1g-dec-dumps

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-cpp-reference-stage-dumps-${{ github.run_id }}
          path: cpp-reference-dumps

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-conformance-md5-${{ github.run_id }}
          path: conformance-md5

      - uses: actions/download-artifact@v8
        with:
          pattern: rav1g-dec-gpublists-*-${{ github.run_id }}
          merge-multiple: true
          path: gpublists

      - name: md5 per frame and stage dumps, rav1g-dec against the C++ decoder
        run: |
          set -euo pipefail
          echo "## Equality with the C++ decoder at \`$CPP_REFERENCE_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          python3 testing/conformance/compare_md5.py --reference cpp-reference/conformance --candidate rav1g-dec/conformance \
            --manifest conformance-md5/manifest.txt --reference-dumps cpp-reference-dumps --candidate-dumps rav1g-dec-dumps \
            --reference-name 'warp_decoder (cpp, the entropy decoder of libaom)' --candidate-name 'rav1g-dec (rav1d)' --two-parsers

      - name: GPU prediction lists against the C++ decoder and the CPU lists
        run: |
          set -euo pipefail
          python3 testing/conformance/compare_md5.py --reference cpp-reference/conformance \
            --candidate gpublists/conformance-gpublists-standard --manifest conformance-md5/manifest.txt \
            --reference-dumps cpp-reference-dumps --candidate-dumps gpublists/dumps-gpublists-standard \
            --reference-name 'warp_decoder (cpp)' --candidate-name 'rav1g-dec (gpublists)' --two-parsers
          python3 testing/conformance/compare_md5.py --reference rav1g-dec/conformance \
            --candidate gpublists/conformance-gpublists-standard --manifest conformance-md5/manifest.txt \
            --reference-dumps rav1g-dec-dumps --candidate-dumps gpublists/dumps-gpublists-standard \
            --reference-name 'rav1g-dec (CPU lists)' --candidate-name 'rav1g-dec (gpublists)' --strict-data
          python3 testing/conformance/compare_md5.py --reference rav1g-dec/conformance \
            --candidate gpublists/conformance-gpublists-fast --manifest conformance-md5/manifest.txt \
            --reference-dumps gpublists/dumps-cpulists-fast --candidate-dumps gpublists/dumps-gpublists-fast \
            --reference-name 'rav1g-dec (CPU fast lists)' --candidate-name 'rav1g-dec (GPU fast lists)' --strict-data

      # The decoder creation and the buffer plan (memory_lines.py pools): the same decoder size and frame
      # buffers as the C++ decoder, pools of a chunk for every 64x64 area of the decoder size, and with
      # the same slots no more device memory than the C++ decoder takes with its shares.
      - name: MEMORY log lines, the pools of rav1g-dec next to the shares of the C++ decoder
        if: ${{ !cancelled() }}
        run: |
          python3 testing/conformance/memory_lines.py pools --shares cpp-reference/memory-lines \
            --pools rav1g-dec/memory-lines | tee -a "$GITHUB_STEP_SUMMARY"

  # Share the Windows SDK DXIL and its report with the Linux cross-build.
  shader-bytecode:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINDOWS_SDK: 10.0.26100.0
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shaders
        id: shaders
        uses: ./.github/actions/shaders
        with:
          sdk: ${{ env.WINDOWS_SDK }}

      - name: Preserve the shader bytecode of the normal build
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-shader-bytecode-${{ github.run_id }}
          path: |
            shader-build/normal/dx/shaders/dxil/
            shader-build/normal/report.json
            shader-build/normal/shader_set.txt
          if-no-files-found: error

  # Linux-native build (docs/rust-port.md, "Requirements"): the workspace for x86_64-pc-windows-msvc on a
  # Linux runner with cargo xwin, which is clang-cl and lld-link with the Windows SDK and C runtime that xwin
  # fetches; no wine, no MSVC. The C++ of the test player that rav1g-dec has for
  # -playersmoke is compiled by cc the same way. The shaders are the DXC bytecode of the
  # shader-bytecode job.
  rust-cross:
    needs: shader-bytecode
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CARGO_XWIN_VERSION: 0.23.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-shader-bytecode-${{ github.run_id }}
          path: shader-bytecode

      # clang-cl, lld-link and llvm-lib. The C++ standard library of the MSVC runtime
      # that xwin fetches (the stream readers and the player's code are C++) wants Clang 19 or newer.
      - name: Rust toolchain, LLVM and cargo-xwin
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          sudo apt-get update -qq
          # nasm, for the assembly of rav1d's parse pass (third_party/rav1d).
          sudo apt-get install -y -qq --no-install-recommends nasm
          nasm -v
          llvm=
          for version in 21 20 19; do
            if sudo apt-get install -y -qq --no-install-recommends clang-$version lld-$version llvm-$version; then
              llvm=$version
              break
            fi
          done
          if [ -z "$llvm" ]; then
            # The distribution has none: the packages of apt.llvm.org.
            llvm=20
            curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
            sudo bash llvm.sh $llvm
            rm llvm.sh
            sudo apt-get install -y -qq --no-install-recommends clang-$llvm lld-$llvm llvm-$llvm
          fi
          echo "/usr/lib/llvm-$llvm/bin" >> "$GITHUB_PATH"
          pipx install "cargo-xwin==$CARGO_XWIN_VERSION"
          rustc --version
          "/usr/lib/llvm-$llvm/bin/clang-cl" --version | head -n 1
          "/usr/lib/llvm-$llvm/bin/lld-link" --version | head -n 1

      # The Windows SDK and the MSVC C runtime (headers and import libraries), about 1.2 GB unpacked.
      - name: xwin cache (Windows SDK and C runtime)
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ env.CARGO_XWIN_VERSION }}-v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: xwin

      - name: Build the workspace for x86_64-pc-windows-msvc (cargo xwin, release)
        env:
          RAV1G_SHADER_DIR: ${{ github.workspace }}/shader-bytecode
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo xwin build --release --locked --target x86_64-pc-windows-msvc
          exe=target/x86_64-pc-windows-msvc/release/rav1g-dec.exe
          test -f "$exe"
          # Built from the bytecode of this run: it is in the program, byte for byte.
          python3 testing/shader_cache/shaders.py verify --report shader-bytecode/report.json --root shader-bytecode "$exe"
          mkdir -p out/rav1g-dec-xwin
          cp "$exe" target/x86_64-pc-windows-msvc/release/rav1g_dec.pdb out/rav1g-dec-xwin/
          # The notices of the crates the library links are those of Cargo.lock.
          python3 third_party/rust-crates/collect.py --check
          for license in LICENSE.txt libav1/LICENSE libav1/PATENTS third_party/libwebm/LICENSE.TXT third_party/libwebm/PATENTS.TXT \
              third_party/rav1d/COPYING third_party/rav1d/doc/PATENTS third_party/rust-crates/NOTICES.txt; do
            mkdir -p "out/rav1g-dec-xwin/licenses/$(dirname "$license")"
            cp "$license" "out/rav1g-dec-xwin/licenses/$license"
          done
          {
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Build: cargo xwin build --release --target x86_64-pc-windows-msvc on Linux, $(rustc --version), $(clang-cl --version | head -n 1)"
          } > out/rav1g-dec-xwin/SOURCES.txt
          {
            echo '## rav1g-dec, built on Linux'
            echo
            echo "cargo xwin build --release: $(( $(date +%s) - start )) s ($(clang-cl --version | head -n 1)); $(stat -c %s "$exe") bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      # rav1g.h, the interface for C, is written from crates/rav1g/src/capi.rs by cbindgen
      # (tools/rav1g-header) and kept in the tree: the file there has to be what the source gives.
      - name: rav1g.h is what crates/rav1g/src/capi.rs gives
        run: cargo run --release --locked -p rav1g-header -- --check

      # The library as an application in an app container links it (docs/rust-port.md, "The app
      # container"): the static library with the interface for C, for the DLL runtime (the library has no C
      # of its own to compile for the app family of the Windows API). It is linked here into a DLL that has every function of
      # rav1g.h, WindowsApp.lib first, and the DLLs that program imports from are held against the list
      # of the test player (testing/uwp_imports): no kernel32.dll, and of ntdll.dll two functions. The
      # player job does the same with the programs of its packages.
      - name: Library for an app container application, and the DLLs it imports from
        env:
          RAV1G_SHADER_DIR: ${{ github.workspace }}/shader-bytecode
        run: |
          set -euo pipefail
          separator=$(printf '\037')
          CARGO_ENCODED_RUSTFLAGS="-Ctarget-feature=-crt-static${separator}--cfg${separator}windows_slim_errors" \
            cargo xwin build --release --locked -p rav1g --lib --features capi,app-container \
            --target x86_64-pc-windows-msvc --target-dir target/app-container
          mkdir -p out/app-container
          cp target/app-container/x86_64-pc-windows-msvc/release/rav1g.lib out/app-container/
          sh testing/uwp_imports/link_probe.sh out/app-container/rav1g.lib \
            "$HOME/.cache/cargo-xwin/xwin" out/app-container-probe
          pipx install uv
          uv run --with pefile==2024.8.26 python testing/uwp_imports/check_imports.py \
            --allow testing/uwp_imports/player-dlls-allow.txt --also vcruntime140.dll \
            --report out/app-container-probe/imports.tsv out/app-container-probe/probe.dll | tee out/app-container-probe/check.txt
          {
            echo '## Library for an app container application (Linux build)'
            echo
            echo '```'
            cat out/app-container-probe/check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the imports of the app container probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-app-container-probe-${{ github.run_id }}
          path: |
            out/app-container-probe/imports.tsv
            out/app-container-probe/check.txt
          if-no-files-found: warn

      - name: Preserve rav1g-dec.exe of the Linux build
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-x64-xwin-${{ github.run_id }}
          path: out/rav1g-dec-xwin/
          if-no-files-found: error

  # The program of the Linux build is a Windows program like the other: it decodes the conformance set on
  # WARP against the same references and expected.txt, and runs the decoder code of the test player, which
  # in this program is compiled by clang-cl. The checks
  # of rust-conformance and rust-switches also run on the Linux build, in parallel shards.
  # rust-cross-run-switches flips the parser options when the coverage check selects it.
  rust-cross-run:
    needs: [rust-cross, conformance-streams]
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [conformance, decoder-switches]
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-xwin-${{ github.run_id }}
          path: rav1g-dec-xwin

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # As in the rust-conformance job: a task that names no parser is a task of the parse pass of rav1d with its
      # default switches, and the run has to say so.
      - name: Decode every stream on WARP with the rav1g-dec of the Linux build
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance --threads 4 "--title=rav1g-dec built on Linux (cargo xwin, clang-cl)"
          $code = $LASTEXITCODE
          if (-not (Select-String -Path out/conformance/lists/run001.log -Pattern '^PARSER .*the parse pass of rav1d.*switches nolfmask,tilethread,gpucdef,gpugrid \(' -Quiet)) {
            throw 'The decoder of this run does not report the parse pass of rav1d with its default switches'
          }
          if ($code -ne 0) { throw "conformance run with the rav1g-dec of the Linux build: exit code $code (1: not as expected.txt says, 2: the run could not be done)" }

      # As in the rust-conformance job: the parser of phase 2 in the program of the Linux build.
      - name: Parse digest of every stream, rav1d's parse pass in the rav1g-dec of the Linux build
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out/parse-digest | Out-Null
          $tool = Resolve-Path rav1g-dec-xwin/rav1g-dec.exe
          Push-Location conformance-streams
          & $tool -parsedigest -t 4 -list manifest.txt > ../out/parse-digest/digest.txt
          $code = $LASTEXITCODE
          Pop-Location
          $lines = @(Select-String -Path out/parse-digest/digest.txt -Pattern '^PARSEDIGEST ').Count
          "## Parse digest, rav1g-dec built on Linux (cargo xwin, clang-cl)", '', "$lines streams, exit code $code." >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { Get-Content out/parse-digest/digest.txt | Select-Object -Last 20; throw "rav1g-dec -parsedigest: exit code $code" }

      - name: Preserve the parse digests of the Linux build
        if: ${{ always() && matrix.suite == 'conformance' }}
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-parse-digest-xwin-${{ github.run_id }}
          path: out/parse-digest/
          if-no-files-found: warn

      - name: The test player's decoder code through rav1g.h on the Rust library of the Linux build
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/player_smoke.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke "--title=the Rust library built on Linux (cargo xwin, clang-cl)"
          if ($LASTEXITCODE -ne 0) { throw "the player's decoder code on the Rust library of the Linux build: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      # The other checks of the rust-conformance and rust-switches jobs with this program (the comments are there): decode errors in cut
      # streams through the Rust interface and with the player's decoder code, the order check, the memory
      # check, the part of the set with -poisonmi and with -poisonbuf, and the whole set with -interfast
      # and with -gpuclear (the clears of a slot by the GPU, with the wavefront in the slot's grid; the
      # rust-clears job has the other ways).
      - name: Decode error in a cut stream, the rav1g-dec of the Linux build
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/cut_tile_check.py --tool rav1g-dec-xwin/rav1g-dec.exe `
            --player-smoke rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams --out out/cut-tile
          if ($LASTEXITCODE -ne 0) { throw "decode error check with the rav1g-dec of the Linux build: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      - name: Order check with the rav1g-dec of the Linux build
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/order_check.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/order-check "--title=rav1g-dec built on Linux (cargo xwin, clang-cl)"
          if ($LASTEXITCODE -ne 0) { throw "order check with the rav1g-dec of the Linux build: exit code $LASTEXITCODE (1: a stream is wrong behind other streams, 2: the check could not be done)" }

      - name: Memory check with the rav1g-dec of the Linux build
        if: ${{ !cancelled() && matrix.suite == 'conformance' }}
        shell: pwsh
        run: |
          python testing/conformance/memory_check.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/memory-check "--title=rav1g-dec built on Linux (cargo xwin, clang-cl)"
          if ($LASTEXITCODE -ne 0) { throw "memory check with the rav1g-dec of the Linux build: exit code $LASTEXITCODE (1: a check failed, 2: the check could not be done)" }

      - name: Conformance with -poisonmi, with -poisonbuf, with -interfast and with -gpuclear, the rav1g-dec of the Linux build
        if: ${{ !cancelled() && matrix.suite == 'decoder-switches' }}
        shell: pwsh
        run: |
          $part = '--only=^(av1-1-b(8|10)-(00-quantizer-0[0-9]|0[1-6]-|16-|2[2-4]-)|nf-chimera-8b-270p)'
          $runs = @(@{ name = 'poisonmi'; args = '-poisonmi'; only = $part }, @{ name = 'poisonbuf'; args = '-poisonbuf'; only = $part },
            @{ name = 'interfast'; args = '-interfast'; only = '--only=' }, @{ name = 'gpuclear'; args = '-gpuclear'; only = '--only=' })
          $failed = @()
          foreach ($run in $runs) {
            python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
              --out "out/conformance-$($run.name)" --threads 4 "--tool-args=$($run.args)" `
              "--title=rav1g-dec built on Linux, with $($run.args)" $run.only
            if ($LASTEXITCODE -ne 0) { $failed += "$($run.args): exit code $LASTEXITCODE" }
          }
          if ($failed.Count) { throw "conformance with the rav1g-dec of the Linux build: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs and md5 files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-xwin-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            out/conformance/
            out/conformance-*/
            out/player-smoke/
            out/cut-tile/
            out/order-check/
            out/memory-check/
          if-no-files-found: warn

  # The Linux build with the other side of every switch of rav1d's parse.
  rust-cross-run-switches:
    needs: [rust-cross, conformance-streams]
    if: needs.conformance-streams.outputs.parser_switches == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable newline conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: rav1g-dec.exe of the Linux build
        uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-x64-xwin-${{ github.run_id }}
          path: rav1g-dec-xwin

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The whole set against its references and expected.txt, and the decoder code of the test player
      # with its -parseopt flag.
      - name: The other side of every switch of the parser, the rav1g-dec of the Linux build
        shell: pwsh
        run: |
          $failed = @()
          $switches = '-parseopt none,latelists,time'
          python testing/conformance/run.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/conformance-switches-rav1d --threads 4 "--tool-args=$switches" "--title=rav1g-dec built on Linux with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "conformance with ${switches}: exit code $LASTEXITCODE" }
          if (-not (Select-String -Path out/conformance-switches-rav1d/lists/run001.log -Pattern '^PARSER .*switches none,time,latelists \(' -Quiet)) {
            $failed += 'the decoder of the run does not report the switches of the parser'
          }
          python testing/conformance/player_smoke.py --tool rav1g-dec-xwin/rav1g-dec.exe --streams conformance-streams `
            --out out/player-smoke-switches-rav1d "--player-args=$switches" "--title=the Rust library built on Linux, the player with $switches"
          if ($LASTEXITCODE -ne 0) { $failed += "the player's decoder code with ${switches}: exit code $LASTEXITCODE" }
          if ($failed.Count) { throw "the switches of the parser: $($failed -join '; ')" }

      - name: Preserve the results, the per-stream logs and md5 files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-dec-xwin-switches-${{ github.run_id }}
          path: |
            out/conformance-*/
            out/player-smoke-*/
            out/cut-tile/
            out/*-rav1d/
          if-no-files-found: warn

  # Phase 2, step 1 (docs/phase2-rav1d.md): rav1d as it is upstream, at the commit the copy in
  # third_party/rav1d starts from, decodes every stream of the conformance set to its reference md5
  # (testing/rav1d_md5 builds upstream's crate from its repository); and the copy is that commit with the
  # changes third_party/rav1d/PATCHES.md lists and nothing else (upstream_diff.sh).
  rav1d:
    needs: conformance-streams
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Rust toolchain and nasm
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nasm
          rustc --version
          nasm -v

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: testing/rav1d_md5
          key: rav1d

      - name: The copy in third_party/rav1d is upstream at the commit of UPSTREAM with the listed changes
        run: |
          set -euo pipefail
          mkdir -p out/rav1d
          repository=$(awk '$1 == "repository" { print $2 }' third_party/rav1d/UPSTREAM)
          commit=$(awk '$1 == "commit" { print $2 }' third_party/rav1d/UPSTREAM)
          # The md5 tool below builds the same commit.
          grep -q "rev = \"$commit\"" testing/rav1d_md5/Cargo.toml
          git clone -q --filter=blob:none "$repository" upstream-rav1d
          git -C upstream-rav1d checkout -q "$commit"
          sh third_party/rav1d/upstream_diff.sh upstream-rav1d out/rav1d/upstream.diff | tee out/rav1d/upstream.txt
          {
            echo '## rav1d: the copy against upstream'
            echo
            echo '```'
            cat out/rav1d/upstream.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upstream rav1d decodes every stream to its reference md5
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path testing/rav1d_md5/Cargo.toml
          status=0
          testing/rav1d_md5/target/release/rav1d-md5 --root conformance-streams \
            --manifest conformance-streams/manifest.txt > out/rav1d/md5.txt || status=$?
          {
            echo '## rav1d as it is upstream on the conformance streams'
            echo
            echo '```'
            tail -n 1 out/rav1d/md5.txt
            grep ' FAIL ' out/rav1d/md5.txt | head -n 20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 out/rav1d/md5.txt
          exit "$status"

      - name: Preserve the diff against upstream and the md5 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-rav1d-${{ github.run_id }}
          path: out/rav1d/
          if-no-files-found: warn

  # Phase 2, step 2 (docs/phase2-rav1d.md): the parser of phase 2 (rav1d's parse pass and the sink)
  # against itself. tools/rav1g-parse-check parses every stream of the conformance set twice, each into
  # plain memory in the layouts the GPU stages read: once with the threads, frames in parse and switches
  # of the step, once with one thread, one frame in parse and the default switches (the reference). It
  # holds every frame of one against the other's: the mode info records field by field, the grid, the
  # transform block records, the coefficients, the block lists (which the D3D12 host's own function
  # counts for both), the palette blocks and the loop restoration units. So no way of running the parser
  # changes what it writes; that it reads the streams correctly is the md5 of the decodes (rust-conformance)
  # and rust-equal. No C of libaom is compiled. No GPU. The same program prints the parse digest of every stream for the parse-digest job, and times the
  # sink on the 4K stream of the set.
  parse-check:
    needs: conformance-streams
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # nasm for rav1d's assembly. Nothing here is C: the types of rav1g-sys are Rust, and its shader table
      # is built for Windows only.
      - name: Rust toolchain and nasm
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nasm
          rustc --version
          nasm -v

      - uses: Swatinem/rust-cache@v2
        with:
          key: parse-check

      - name: Build rav1g-parse-check
        run: cargo build --release --locked -p rav1g-parse-check

      # Without a flag both runs are the same parse: it gives the counts and the coverage of the set, and
      # says that two parses of a stream write the same.
      - name: Every frame of every stream, rav1d's parse pass and the sink, parsed twice with one thread
        run: |
          set -euo pipefail
          mkdir -p out/parse-check
          status=0
          target/release/rav1g-parse-check -root conformance-streams -manifest conformance-streams/manifest.txt \
            > out/parse-check/check.txt || status=$?
          {
            echo '## Parse check: rav1d and the sink, two parses with one thread'
            echo
            echo '```'
            grep '^PARSE SUMMARY\|^PARSE COVERAGE' out/parse-check/check.txt || true
            grep -A 6 ' DIFFERENT \| ERROR ' out/parse-check/check.txt | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^PARSE SUMMARY\|^PARSE COVERAGE' out/parse-check/check.txt || true
          exit "$status"

      # Four threads in rav1d against the reference with one: the tiles of a frame are then parsed side
      # by side.
      - name: Four parser threads against one
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          target/release/rav1g-parse-check -threads 4 -root conformance-streams \
            -manifest conformance-streams/manifest.txt > out/parse-check/check-threads4.txt || status=$?
          {
            echo '## Parse check with four parser threads'
            echo
            echo '```'
            grep '^PARSE SUMMARY' out/parse-check/check-threads4.txt || true
            grep -A 6 ' DIFFERENT \| ERROR ' out/parse-check/check-threads4.txt | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^PARSE SUMMARY' out/parse-check/check-threads4.txt || true
          exit "$status"

      # The switches of the parser (-parseopt, docs/phase2-rav1d.md "Where the time goes"): the two runs
      # above have the two that are on by default (nolfmask, tilethread) and the block lists counted
      # superblock by superblock; the buffers are the same with the two off and the lists counted at the
      # end of a tile, with one thread and with four.
      - name: The other side of every switch of the parser against the default switches
        if: ${{ !cancelled() && needs.conformance-streams.outputs.parser_switches == 'true' }}
        run: |
          set -euo pipefail
          status=0
          {
            echo '## Parse check with the other side of every switch of the parser (-parseopt none,latelists)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for threads in 1 4; do
            target/release/rav1g-parse-check -threads "$threads" -parseopt none,latelists -root conformance-streams \
              -manifest conformance-streams/manifest.txt > "out/parse-check/check-switches-threads$threads.txt" \
              || status=$?
            {
              grep '^PARSE SUMMARY' "out/parse-check/check-switches-threads$threads.txt" || true
              grep -A 6 ' DIFFERENT \| ERROR ' "out/parse-check/check-switches-threads$threads.txt" | head -n 60 || true
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Compare the default GPU grid (rebuilt from the records by parse-check) and the sink-written
      # grid, including edge readers with late lists, multiple threads and two frames in parse.
      - name: Check the parser with each grid path
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          {
            echo '## Parse check with each grid path'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          run=0
          for arguments in '-threads 1' '-threads 4 -parseopt nolfmask,tilethread,gpucdef' \
              '-threads 4 -parseopt none,latelists,gpugrid' '-threads 4 -frames 2'; do
            run=$((run + 1))
            # shellcheck disable=SC2086
            target/release/rav1g-parse-check $arguments -root conformance-streams \
              -manifest conformance-streams/manifest.txt > "out/parse-check/check-gpugrid-$run.txt" || status=$?
            {
              echo "$arguments"
              grep '^PARSE SUMMARY' "out/parse-check/check-gpugrid-$run.txt" || true
              grep -A 6 ' DIFFERENT \| ERROR ' "out/parse-check/check-gpugrid-$run.txt" | head -n 60 || true
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The wavefront of intra prediction (docs/phase2-rav1d.md, "No clears by the CPU"): the runs above
      # keep it at the edges of the tiles, as the decoder does without a flag. Here the reference
      # keeps it in the wavefront grid, which is cleared for every frame, and the run that is checked at
      # the edges (-wave check): the block lists are equal only if every transform block of every stream gets the
      # same iteration either way, and every entry of the grid that the edges' side writes (the ones the
      # shader reads) has to be the grid's. The edges start as a pattern no iteration has, so an entry
      # that is read without having been written in its frame shows in the lists. With one thread and
      # with four, and once with the wavefront in the grid on both sides (the way of -gpuclear, -cpuclear
      # and -syncclear).
      - name: The wavefront in the grid and at the edges of the tiles gives the same block lists
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          {
            echo '## Parse check of the two ways of keeping the wavefront (-wave check, -wave grid)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for run in 'check 1' 'check 4' 'grid 1'; do
            set -- $run
            target/release/rav1g-parse-check -wave "$1" -threads "$2" -root conformance-streams \
              -manifest conformance-streams/manifest.txt > "out/parse-check/check-wave-$1-threads$2.txt" || status=$?
            {
              grep '^PARSE SUMMARY' "out/parse-check/check-wave-$1-threads$2.txt" || true
              grep -A 6 ' DIFFERENT \| ERROR ' "out/parse-check/check-wave-$1-threads$2.txt" | head -n 60 || true
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Frames in parallel (docs/phase2-rav1d.md, step 4): rav1d with two, three and four frames in parse
      # at once, on as many threads and on more. The frames of several temporal units are then parsed
      # side by side, each into buffers of its own, and a frame may end before one that began before it.
      # Every buffer of every frame has to be what the reference wrote with one frame in parse and one
      # thread; the order of the threads is what differs from run to run, so each combination runs
      # twice.
      - name: Two, three and four frames in parse against one
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          {
            echo '## Parse check with more than one frame in parse (-frames)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for run in '2 2' '2 4' '3 3' '4 4' '3 8' '4 8'; do
            set -- $run
            for round in 1 2; do
              out="out/parse-check/check-frames$1-threads$2-round$round.txt"
              target/release/rav1g-parse-check -frames "$1" -threads "$2" -root conformance-streams \
                -manifest conformance-streams/manifest.txt > "$out" || status=$?
              {
                echo "frames $1, threads $2, round $round: $(grep '^PARSE SUMMARY' "$out" || echo 'no summary')"
                grep -A 6 ' DIFFERENT \| ERROR \|panicked' "$out" | head -n 60 || true
              } | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # A panic in the parse (a bug of the parser or of the sink, not a damaged stream): with the test
      # switch the sink panics in the third frame of a stream, on the thread that parses it. On a worker
      # thread of rav1d that used to end the thread and leave the caller waiting for the frame for ever;
      # the run has to end, and say what happened.
      - name: A panic on a thread of the parser ends the parse
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          status=0
          for run in '2 1' '4 2' '8 4'; do
            set -- $run
            out="out/parse-check/panic-threads$1-frames$2.txt"
            timeout 120 target/release/rav1g-parse-check -parseopt testpanic -threads "$1" -frames "$2" \
              conformance-streams/cut/nf-chimera-10b-1080p.ivf > "$out" 2>&1 || true
            if grep -q 'ERROR a thread of rav1d ended with a panic' "$out"; then
              echo "threads $1, frames $2: the run ended and reported the panic"
            else
              echo "FAIL threads $1, frames $2: no report of the panic"; tail -n 5 "$out"; status=1
            fi
          done | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Parse digest of every stream on Linux
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          target/release/rav1g-parse-check -digest -root conformance-streams \
            -manifest conformance-streams/manifest.txt > out/parse-check/digest.txt
          grep -c '^PARSEDIGEST ' out/parse-check/digest.txt

      # What the sink costs on the CPU of this runner, and what the switches of the parser change: the two
      # 4K streams and a 1080p stream of the set, with one thread and with four (one tile each, so the
      # three further threads have nothing to parse). "time" is the default with the calls of the sink
      # timed, "latelists,time" the same with the block lists at the end of a tile. Behind them the
      # default switches with the wavefront of intra prediction in its grid (-wave grid) and at the edges
      # of the tiles (the default), for the block lists of the two. A measurement for
      # docs/phase2-rav1d.md, not a gate.
      - name: CPU time of the parse and of the sink
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            echo '## CPU time of the parse and of the sink (this runner)'
            echo
            echo '```'
            for stream in cut/nf-dvbdash-d2-10b-2160p.ivf cut/nf-dvbdash-a1-8b-2160p.ivf cut/nf-chimera-10b-1080p.ivf; do
              for threads in 1 4; do
                for switches in none nolfmask tilethread time latelists,time time latelists,time; do
                  target/release/rav1g-parse-check -time -threads "$threads" -parseopt "$switches" \
                    "conformance-streams/$stream" || true
                done
                if [ "$threads" -eq 1 ]; then
                  for wave in grid edges grid edges; do
                    echo "wavefront: $wave"
                    target/release/rav1g-parse-check -time -threads "$threads" -wave "$wave" \
                      "conformance-streams/$stream" || true
                  done
                fi
              done
            done
            # Frames in parallel: the wall time of the parse of a stream, a frame, with one, two and three
            # frames in parse on as many threads and on one more ("with the sink" is the number: the
            # parse with the sink writing the buffers; the difference to the parse alone says nothing
            # when frames overlap).
            echo 'frames in parse:'
            for stream in cut/nf-dvbdash-d2-10b-2160p.ivf cut/nf-dvbdash-a1-8b-2160p.ivf cut/nf-chimera-10b-1080p.ivf; do
              for run in '1 1' '2 1' '2 2' '3 2' '3 3' '4 2' '2 2' '1 1'; do
                set -- $run
                target/release/rav1g-parse-check -time -threads "$1" -frames "$2" "conformance-streams/$stream" || true
              done
            done
            echo '```'
          } | tee out/parse-check/time.txt >> "$GITHUB_STEP_SUMMARY"
          cat out/parse-check/time.txt

      - name: Preserve the results of the parse check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-parse-check-${{ github.run_id }}
          path: out/parse-check/
          if-no-files-found: warn

  # The parser of phase 2 reads the same from every stream in every build: the parse digests of the MSVC
  # build and of the Linux cross build (rav1g-dec -parsedigest on Windows, four threads) against those of
  # the Linux build of the parse-check job (one thread).
  parse-digest:
    needs: [parse-check, rust-conformance, rust-cross-run]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rav1g-parse-check-${{ github.run_id }}
          path: linux

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-parse-digest-msvc-${{ github.run_id }}
          path: msvc

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-parse-digest-xwin-${{ github.run_id }}
          path: xwin

      - name: The parse digests of the three builds are the same
        run: |
          set -euo pipefail
          grep '^PARSEDIGEST ' linux/digest.txt | tr -d '\r' > linux.txt
          streams=$(grep -c . linux.txt)
          status=0
          for build in msvc xwin; do
            grep -a '^PARSEDIGEST ' "$build/digest.txt" | tr -d '\r' > "$build.txt"
            if cmp -s linux.txt "$build.txt"; then
              echo "PASS $build: $streams streams, the same lines as the Linux build"
            else
              echo "FAIL $build: the lines differ from the Linux build"
              diff linux.txt "$build.txt" | head -n 20 || true
              status=1
            fi
          done | tee result.txt
          grep -q '^FAIL' result.txt && status=1
          [ "$streams" -gt 0 ] || { echo 'FAIL: no digest lines of the Linux build'; status=1; }
          {
            echo '## Parse digests: MSVC build and Linux cross build against the Linux build'
            echo
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # What the decoder reports about the colour of a stream (docs/color.md): the colour description of the
  # sequence header and the HDR metadata OBUs, which it passes to the application with the stream info
  # and with every frame. rav1g-dec prints it per stream ("COLOUR" lines), and the lines of two runs of
  # the whole set in the rust-conformance job (through the Rust interface and through rav1g.h) are held
  # against two references that are not the decoder: FFmpeg's trace_headers for the
  # syntax elements of the sequence header, ffprobe with libdav1d for the properties and the side data
  # of every output frame. The streams that carry something (BT.709; BT.2020 with HLG; HDR10 with a
  # mastering display and light levels) are named in the script with what they carry.
  colour:
    needs: [conformance-streams, rust-conformance]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Streams from the cache
        uses: actions/cache/restore@v6
        with:
          path: conformance-streams
          key: ${{ needs.conformance-streams.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dec-conformance-${{ github.run_id }}
          path: rav1g-dec

      - name: ffmpeg and ffprobe with libdav1d
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffprobe -hide_banner -version | head -n 1
          ffprobe -hide_banner -decoders 2>/dev/null | grep libdav1d

      - name: Colour description and HDR metadata of every stream, rav1g-dec against trace_headers and ffprobe
        run: |
          set -euo pipefail
          python3 testing/conformance/colour_check.py --streams conformance-streams --out out/colour \
            --logs "rav1d's parser=rav1g-dec/conformance/logs" \
            --logs "rav1g.h (-capi)=rav1g-dec/conformance-capi/logs"

      - name: Preserve what the references say
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-colour-${{ github.run_id }}
          path: out/colour/
          if-no-files-found: warn

  # Host check of how the shaders hand data between the threads of a thread group. A GPU promises
  # only that all threads of a group meet at a group sync; upstream's shaders counted on the 64
  # threads of a group running in lockstep (one wave), which holds on the console and nowhere else.
  # Every shader with group memory, compiled as C++, runs with its thread groups under an adversarial
  # schedule and its group memory watched for races; a plain GroupMemoryBarrier() is rejected; and
  # for every group sync a copy of the shader with that sync turned into a plain barrier must be
  # rejected for a race. The restoration, deblocking, CDEF, intra and warp checks watch their own shaders.
  sync-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Group memory races, group syncs and plain barriers of all shaders
        run: |
          set -euo pipefail
          sh testing/sync_check/run.sh --mutate | tee sync-check.log
          { echo '## Thread group check'; echo '```'; cat sync-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare loop restoration with a scalar reference
        run: sh testing/restoration_check/run.sh --mutate

      - name: Compare deblocking filters and edge lists with scalar references
        run: sh testing/loopfilter_check/run.sh --mutate

      - name: Compare direct-texture film grain with a scalar reference
        run: sh testing/film_grain_check/run.sh --mutate

  # The CDEF shaders, compiled as C++, must write byte-identical frames and
  # lists (random and edge-case input, 8-bit and high bit depth).
  cdef-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare CDEF filters and lists
        run: |
          set -euo pipefail
          sh testing/cdef_check/run.sh --mutate | tee cdef-check.log
          { echo '## CDEF bit-exactness check'; echo '```'; tail -n 4 cdef-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the warp prediction shaders (local warp, global motion, GLOBAL_GLOBALMV) against
  # libaom's C code of this tree: the shaders, compiled as C++, and libaom must write byte-identical
  # frames, with and without working double precision in the shaders, also for frames whose reference 0
  # has another size than the frame (reference scaling, spatial layers), and the mutated copies of the
  # shaders must fail, among them the shaders that took the size of reference 0 for every reference.
  warp-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the warp shaders with libaom
        run: |
          set -euo pipefail
          sh testing/warp_check/run.sh --mutate | tee warp-check.log
          { echo '## Warp check'; echo '```'; tail -n 15 warp-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the default and -interfast kernels against libaom. The shaders run as C++ with generated 8-bit and 10-bit block records covering sizes,
  # phases, filters, compound weights and frame edges. Deliberate kernel mutations must fail.
  inter-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare unscaled inter shaders with libaom
        run: |
          set -euo pipefail
          sh testing/inter_check/run.sh --mutate | tee inter-check.log
          { echo '## Unscaled inter check'; echo '```'; cat inter-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Host check of the super-resolution shader (upscaling.hlsl) against libaom's normative upscale of
  # this tree, which is the upscaling process of the specification: the shader, compiled as C++,
  # must write the same samples for every denominator, 8-bit and 10-bit, at widths that are and are
  # not multiples of 8, with one and with several tile columns, and six mutated copies must fail.
  superres-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare upscaling.hlsl with libaom
        run: |
          set -euo pipefail
          sh testing/superres_check/run.sh --mutate | tee superres-check.log
          { echo '## Super-resolution check'; echo '```'; cat superres-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The Rust host's copies of 21 tables and 4 inline functions of libaom's headers
  # (crates/rav1g/src/host/tables.rs, blocks.rs) against the headers of this tree: a C program, built
  # here by gcc against libav1, prints the tables and the results of the functions over a range of
  # inputs, tools/rav1g-tables prints the same from the host's files (compiled into it by path), and
  # the two texts must be equal; 18 copies of the host's files with one number or one result changed
  # must be rejected. The decoder's build has no C of libaom and reads no header (no libclang): this
  # job is where the copies meet the headers.
  tables-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          gcc --version | head -n 1

      - name: Compare the host's tables and inline functions with libaom's headers
        run: |
          set -euo pipefail
          sh testing/tables_check/run.sh --mutate | tee tables-check.log
          { echo '## Tables and inline functions of libaom'; echo '```'; cat tables-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The conservative and prefetching wavefront kernels and intra_v2 with its scheduler
  # must write byte-identical frames on generated 8-bit and 10-bit block layouts.
  intra-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the intra wavefront kernels with intra_v2
        run: |
          set -euo pipefail
          sh testing/intra_check/run.sh --mutate --layouts 400 | tee intra-check.log
          { echo '## Intra bit-exactness check'; echo '```'; cat intra-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Timing summary self-test
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -I libav1 -o perf_stats_test testing/player_common/perf_stats_test.cpp
          ./perf_stats_test

      # The intra step timing script (testing/steptime/steptime.py): its parser and its fit on made-up steps.
      - name: Intra step timing script self-test
        run: sh testing/steptime/run.sh

      # The sequence header peek behind aom_codec_peek_stream_info and the player's -fitsize:
      # headers written by hand from the specification's syntax must be read back with their
      # values, cut headers must be reported, and five mutated copies of the peek must fail.
      - name: Sequence header peek check
        run: |
          set -euo pipefail
          sh testing/seq_header_check/run.sh --mutate | tee seq-header-check.log
          { echo '## Sequence header peek check'; echo '```'; cat seq-header-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The comparisons of the Shader Model 6 test (-sm6test): emulated outputs of its shaders must pass,
      # outputs with one word changed must fail.
      - name: Shader Model 6 test comparisons self-test
        run: |
          set -euo pipefail
          sh testing/sm6test/run.sh | tee sm6test-checks.log
          { echo '## Shader Model 6 test comparisons'; echo '```'; tail -n 1 sm6test-checks.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-intra-check-${{ github.run_id }}
          path: intra-check.log
          if-no-files-found: warn

  # Registers, group memory (LDS), scratch and theoretical waves per SIMD of every shader of
  # crates/rav1g-sys/shaders.txt, compiled offline for RDNA2 (gfx1030, wave64): DXC to SPIR-V with the
  # arguments of the real build, then the LLPC of AMD's Radeon GPU Analyzer, and RGA's analysis of the
  # code object (testing/shader_regs/README.md). No GPU. AMD's desktop compiler, not the console's: a
  # change from one commit to the next means something, the absolute numbers are approximate. Fails when
  # a shader has fewer waves per SIMD or more scratch than testing/shader_regs/baseline.tsv says, so that
  # such a change comes with a new baseline in the same commit, and the commit message says why.
  shader-regs:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Key of the pinned RGA and DXC
        id: tools
        run: python3 testing/shader_regs/shader_regs.py key >> "$GITHUB_OUTPUT"

      # The archives, about 270 MB: their SHA-256 is checked against the pins on every run.
      - name: RGA and DXC from the cache
        uses: actions/cache@v6
        with:
          path: shader-regs-downloads
          key: ${{ steps.tools.outputs.key }}

      - name: Measure every shader for gfx1030
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/shader-regs-tools"
          python3 testing/shader_regs/shader_regs.py fetch --tools "$tools" --downloads shader-regs-downloads
          mkdir -p out/shader-regs
          python3 testing/shader_regs/shader_regs.py measure --tools "$tools" --jobs 4 \
            --out out/shader-regs/shader_regs.tsv --failures out/shader-regs/failures.tsv

      - name: Compare with the baseline
        run: |
          set -euo pipefail
          status=0
          python3 testing/shader_regs/shader_regs.py compare --failures out/shader-regs/failures.tsv \
            --summary out/shader-regs/summary.md out/shader-regs/shader_regs.tsv | tee out/shader-regs/compare.txt || status=$?
          cat out/shader-regs/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Preserve the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rav1g-shader-regs-${{ github.run_id }}
          path: out/shader-regs/
          if-no-files-found: warn

  # testing/precheck.sh, the local check before a push, runs the checks of testing/*/run.sh that a change
  # touches: each of them has to be in its mapping, so that a new check is not left out. (The checks
  # themselves run in the jobs above; CI does not run precheck.sh.)
  precheck-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Every testing/*/run.sh is in the mapping of testing/precheck.sh
        run: sh testing/precheck.sh --check-mapping

  # The language bar of the README: languages.svg and languages.json of the player job (what rav1g.dll
  # of this commit is built from, by language) as the one commit of the branch badges, which the README
  # of main shows. For a push to main only: not for a tag, a dispatch, the weekly run or the branch
  # cpp. The push to badges starts no run: the workflow runs for the branches main and cpp (on.push.branches),
  # and a push with GITHUB_TOKEN starts none anyway.
  language-bar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: player
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one thing this job is given: to push the branch.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rav1g-languages-${{ github.run_id }}
          path: badges

      # A new history of one commit each time, pushed over the old one: the branch stays two small files.
      - name: Publish to the branch badges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd badges
          test -s languages.json
          test -s languages.svg
          printf '%s\n' "Written by the workflow of main (.github/workflows/build.yml, job language-bar): what rav1g.dll is built from, by language, for commit $GITHUB_SHA. One commit, replaced by every push to main." > README.md
          git init --quiet --initial-branch=badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add languages.json languages.svg README.md
          git commit --quiet -m "Languages of rav1g.dll at $GITHUB_SHA"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges:badges

  # A release (docs/integration.md, "Releases"): for a tag v<version>, when the required checks have
  # passed, rav1g.dll of the default package (the build the console runs: linked by lld-link, the app
  # runtime, DXC cs_6_0 shaders), its import library and symbols, the rav1g.h it was built with, the
  # licences the library needs (rav1g, AOM's patent licence, rav1d, the notices of the linked crates) and
  # SHA256SUMS, as a pre-release. The tag has to be v and the version of the workspace, which
  # rav1g_version() reports.
  release:
    # Tags bypass the path filters. Each dependency below runs on a tag.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [player, conformance-streams, cpp-reference, rust, rust-conformance, rust-output, rust-switches,
      rust-parser-switches, rust-sinkgrid, rust-gpublists, rust-clears, rust-frames, rust-frames-threads,
      rust-dumps-equal, shader-pick-decoder, rust-dxc, rust-equal, shader-bytecode,
      rust-cross, rust-cross-run, rust-cross-run-switches, rav1d, parse-check, parse-digest, colour, sync-check,
      cdef-check, warp-check, inter-check, superres-check, tables-check, intra-check, shader-regs,
      precheck-mapping]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: rav1g-dll-x64-${{ github.run_id }}
          path: dll

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag $TAG is not v and the version of the workspace ($version)"
            exit 1
          fi
          abi=$(sed -n 's/^#define RAV1G_ABI_VERSION \([0-9]*\)$/\1/p' crates/rav1g/include/rav1g.h)
          [ -n "$abi" ] || { echo '::error::rav1g.h has no RAV1G_ABI_VERSION'; exit 1; }
          mkdir rel licenses
          cp dll/rav1g.dll dll/rav1g.dll.lib dll/rav1g.pdb crates/rav1g/include/rav1g.h rel/
          for f in LICENSE.txt libav1/LICENSE libav1/PATENTS third_party/rav1d/COPYING third_party/rav1d/doc/PATENTS \
              third_party/rust-crates/NOTICES.txt; do
            mkdir -p "licenses/$(dirname "$f")"
            cp "$f" "licenses/$f"
          done
          (cd licenses && zip -qrX ../rel/rav1g-licenses.zip .)
          (cd rel && sha256sum rav1g.dll rav1g.dll.lib rav1g.pdb rav1g.h rav1g-licenses.zip > SHA256SUMS)
          cat rel/SHA256SUMS
          {
            echo "rav1g $version: the AV1 decoder of this repository as \`rav1g.dll\`, for a D3D12 app on Xbox Series X|S"
            echo "that loads it at run time (docs/integration.md). Built by CI run $GITHUB_RUN_NUMBER from \`$GITHUB_SHA\`; all"
            echo "required checks passed before this was published."
            echo
            echo "- \`rav1g.dll\`: the library of the default package (no C, linked by lld-link, the app"
            echo "  runtime; shaders DXC cs_6_0). \`rav1g.dll.lib\` to link it, \`rav1g.pdb\` for its symbols."
            echo "- \`rav1g.h\`: the interface it was built with, \`RAV1G_ABI_VERSION\` $abi; a loader compares"
            echo "  \`rav1g_abi_version()\` with it."
            echo "- \`rav1g-licenses.zip\`: the licences a redistribution of the library has to carry."
            echo "- \`SHA256SUMS\`: the SHA-256 of each file, for a pin."
            echo
            echo "A pre-release: the decoder is tested on the conformance set in CI and on a game console, and is"
            echo "not yet used by a released application."
          } > notes.md
          gh release create "$TAG" rel/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "rav1g $version" --notes-file notes.md
          { echo "## Release $TAG"; echo '```'; cat rel/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
