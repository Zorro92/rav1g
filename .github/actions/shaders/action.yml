name: Shaders
description: Build signed DXC cs_6_0 shaders from a cache by content.

inputs:
  repo:
    description: The directory of the checkout, relative to the workspace
    default: .
  sdk:
    description: The Windows SDK supplying DXC
    required: true
  variant:
    description: normal, uavsync, or shader-pick
    default: normal

outputs:
  dir:
    description: Build root with dx/shaders/dxil, shader_set.txt, asm and report.json
    value: ${{ steps.build.outputs.dir }}

runs:
  using: composite
  steps:
    - name: Keys of the shaders
      id: key
      shell: pwsh
      env:
        SHADER_REPO: ${{ inputs.repo }}
        SHADER_SDK: ${{ inputs.sdk }}
        SHADER_VARIANT: ${{ inputs.variant }}
      run: |
        $ErrorActionPreference = 'Stop'
        $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin\$env:SHADER_SDK\x64"
        $dxc = Join-Path $sdkBin dxc.exe
        "dxc=$dxc" >> $env:GITHUB_OUTPUT
        python "$env:SHADER_REPO/testing/shader_cache/shaders.py" key --dxc $dxc --variants $env:SHADER_VARIANT
        if ($LASTEXITCODE -ne 0) { throw 'The keys of the shaders could not be computed' }

    - name: Shader cache
      uses: actions/cache@v6
      with:
        path: shader-cache/${{ inputs.variant }}
        key: rav1g-shaders-v1-${{ inputs.variant }}-${{ steps.key.outputs.digest }}
        restore-keys: |
          rav1g-shaders-v1-${{ inputs.variant }}-

    - name: Bytecode and listings, compiling what the cache does not have
      id: build
      shell: pwsh
      env:
        SHADER_REPO: ${{ inputs.repo }}
        SHADER_VARIANT: ${{ inputs.variant }}
        DXC: ${{ steps.key.outputs.dxc }}
      run: |
        $ErrorActionPreference = 'Stop'
        $script = "$env:SHADER_REPO/testing/shader_cache/shaders.py"
        $cache = "shader-cache/$env:SHADER_VARIANT"
        $directory = (New-Item -ItemType Directory -Force "shader-build/$env:SHADER_VARIANT").FullName
        $report = Join-Path $directory 'report.json'
        python $script build --dxc $env:DXC --variant $env:SHADER_VARIANT --cache $cache --root $directory `
          --listings (Join-Path $directory 'asm') --report $report
        if ($LASTEXITCODE -ne 0) { throw "The shaders of the $env:SHADER_VARIANT build could not be compiled" }
        python $script prune --cache $cache $report
        if ($LASTEXITCODE -ne 0) { throw 'The shader cache could not be pruned' }
        "dir=$directory" >> $env:GITHUB_OUTPUT
