# rav1d (https://github.com/memorysafety/rav1d) at the commit of UPSTREAM, with the changes of rav1g: the
# parse pass only, behind a sink (src/parse.rs). PATCHES.md lists every change against upstream;
# docs/phase2-rav1d.md of the repository is the design.
[package]
name = "rav1d"
authors = ["Rav1d Developers", "Prossimo"]
version = "1.1.1"
edition = "2021"
rust-version = "1.85"
description = "Rust port of the dav1d AV1 decoder; here its parse pass only, as vendored by rav1g"
license = "BSD-2-Clause"
repository = "https://github.com/memorysafety/rav1d"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
assert_matches = "1.5.0"
atomig = { version = "0.4.0", features = ["derive"] }
av-data = "0.4.2"
bitflags = "2.4.0"
cfg-if = "1.0.0"
libc = "0.2"
parking_lot = "0.12.2"
paste = "1.0.14"
raw-cpuid = "11.0.1"
static_assertions = "1.1.0"
strum = { version = "0.27", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.7.32", features = ["derive"] }

[build-dependencies]
cc = "1.0.79"
nasm-rs = { version = "0.3", features = ["parallel"] }

[features]
# asm: the two x86-64 assembly files of the parse pass (entropy decoder, motion vector lists), assembled
# with nasm by build.rs. On another architecture, build without it.
default = ["asm", "bitdepth_8", "bitdepth_16"]
asm = []
bitdepth_8 = []
bitdepth_16 = []
