[package]
name = "rav1g-sys"
description = "The types of rav1g with a fixed shape (the records the shaders read, the state of the host, the enums of the bitstream), and its shader table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# The experiment build for shaders whose group syncs are syncs of all memory
# (docs/test-player.md, "Experiments"). RAV1G_SHADER_DIR must then be the uavsync variant.
uavsync = []
# Embed the alternate DXC -Od bytecode for debugging with -shaderpick.
# RAV1G_SHADER_DIR must be the shader-pick variant.
shader-pick = []
# For an application in an app container. It chose WINAPI_FAMILY_APP for the C this crate compiled; the
# crate has no C any more and the feature changes nothing in it (crates/rav1g hands it on).
app-container = []
