# The Rust port (docs/rust-port.md). Build with the shader headers of the FXC build:
#   RAV1G_SHADER_DIR=<directory with dx/shaders/h> cargo build --release
[workspace]
resolver = "3"
members = [
    "crates/rav1g-sys",
    "crates/rav1g-parse",
    "crates/rav1g",
    "tools/rav1g-dec",
    "tools/rav1g-header",
    "tools/rav1g-parse-check",
    "third_party/rav1d",
]
# The header tool builds for the machine it runs on and is run by name (cargo run -p rav1g-header).
default-members = ["crates/rav1g-sys", "crates/rav1g", "tools/rav1g-dec"]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.99"
license = "BSD-2-Clause"
repository = "https://github.com/Zorro92/rav1g"
publish = false

[workspace.dependencies]
rav1g-sys = { path = "crates/rav1g-sys" }
rav1g = { path = "crates/rav1g" }
rav1g-parse = { path = "crates/rav1g-parse" }
rav1d = { path = "third_party/rav1d" }
cc = "1.2"
bindgen = "0.73"

[profile.release]
# Line tables only: enough for the crash line of rav1g-dec to be resolved with the .pdb.
debug = "line-tables-only"
